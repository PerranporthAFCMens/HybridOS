name: Add member class detail modal
on:
  push:
    paths:
      - '.github/workflows/add-member-class-detail-modal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add clickable class detail modal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('member.html')
          s=p.read_text()

          modal='''\n<div id="classDetailModal" class="modal hidden"><div class="modal-card"><div class="section-title"><div><div class="eyebrow">Class details</div><h3 id="classDetailName" style="margin:4px 0"></h3></div><button id="closeClassDetail" class="btn secondary">Close</button></div><div id="classDetailWhen" class="muted" style="margin-bottom:12px"></div><div id="classDetailDescription" style="line-height:1.55"></div><div id="classDetailCoach" class="muted" style="margin-top:12px"></div><div id="classDetailAvailability" class="muted" style="margin-top:8px"></div><div class="actions"><button id="classDetailAction" class="btn primary">Book class</button></div><div id="classDetailMsg" class="msg"></div></div></div>\n'''
          marker='<div id="workoutModal" class="modal hidden">'
          if 'id="classDetailModal"' not in s:
            s=s.replace(marker,modal+marker,1)

          s=s.replace("const supabase=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');const $=id=>document.getElementById(id);const previewAsMember=new URLSearchParams(location.search).get('preview')==='member';let session,gym,profile,membership;",
                      "const supabase=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');const $=id=>document.getElementById(id);const previewAsMember=new URLSearchParams(location.search).get('preview')==='member';let session,gym,profile,membership,currentClassRows=[];",1)

          old="""  const rows=(data||[]).filter(x=>!x.is_cancelled).slice(0,12);\n  const renderRow=x=>{\n    const booked=x.my_booking_status==='booked';\n    const full=Number(x.spaces_left||0)<=0&&!booked;\n    const label=booked?'Cancel booking':full?'Full':'Book class';\n    return `<div class=\\\"row\\\"><div class=\\\"rowtop\\\"><div><h4>${esc(x.name)}</h4><div class=\\\"muted\\\">${fmt(x.starts_at)} · ${x.booked_count}/${x.capacity} booked</div></div><button class=\\\"btn ${booked?'secondary':'primary'} class-book-btn\\\" data-session-id=\\\"${x.session_id}\\\" data-booked=\\\"${booked?'1':'0'}\\\" ${full?'disabled':''}>${label}</button></div></div>`;\n  };"""
          new="""  const rows=(data||[]).filter(x=>!x.is_cancelled).slice(0,12);currentClassRows=rows;\n  const renderRow=x=>{\n    const booked=x.my_booking_status==='booked';\n    const full=Number(x.spaces_left||0)<=0&&!booked;\n    const label=booked?'Cancel booking':full?'Full':'Book class';\n    return `<div class=\\\"row class-detail-row\\\" data-class-id=\\\"${x.session_id}\\\" style=\\\"cursor:pointer\\\"><div class=\\\"rowtop\\\"><div><h4>${esc(x.name)}</h4><div class=\\\"muted\\\">${fmt(x.starts_at)} · ${x.booked_count}/${x.capacity} booked</div><div class=\\\"muted\\\" style=\\\"font-size:12px;margin-top:4px\\\">Tap for details</div></div><button class=\\\"btn ${booked?'secondary':'primary'} class-book-btn\\\" data-session-id=\\\"${x.session_id}\\\" data-booked=\\\"${booked?'1':'0'}\\\" ${full?'disabled':''}>${label}</button></div></div>`;\n  };"""
          if old not in s:
            raise SystemExit('member renderRow block not found')
          s=s.replace(old,new,1)

          hook="document.querySelectorAll('.class-book-btn').forEach(btn=>btn.onclick=async()=>{"
          if hook not in s:
            raise SystemExit('member booking hook not found')
          s=s.replace(hook,"document.querySelectorAll('.class-detail-row').forEach(row=>row.onclick=e=>{if(e.target.closest('.class-book-btn'))return;openClassDetail(row.dataset.classId)});\n            "+hook,1)

          anchor="function metricFields(type,a='',b=''){"
          detail_js="""function openClassDetail(id){const x=currentClassRows.find(r=>r.session_id===id);if(!x)return;const booked=x.my_booking_status==='booked',full=Number(x.spaces_left||0)<=0&&!booked;$('classDetailName').textContent=x.name||'Class';$('classDetailWhen').textContent=fmt(x.starts_at)+(x.ends_at?' – '+new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit'}).format(new Date(x.ends_at)):'');$('classDetailDescription').textContent=x.description||'No description has been added for this class yet.';$('classDetailCoach').textContent=x.staff_names?.length?'Coach: '+x.staff_names.join(', '):'';$('classDetailAvailability').textContent=x.availability_note||`${x.spaces_left} spaces left`;$('classDetailAction').dataset.sessionId=x.session_id;$('classDetailAction').dataset.booked=booked?'1':'0';$('classDetailAction').textContent=booked?'Cancel booking':full?'Full':'Book class';$('classDetailAction').className='btn '+(booked?'secondary':'primary');$('classDetailAction').disabled=full;$('classDetailMsg').textContent='';$('classDetailModal').classList.remove('hidden')}\n$('closeClassDetail').onclick=()=>$('classDetailModal').classList.add('hidden');$('classDetailModal').onclick=e=>{if(e.target===$('classDetailModal'))$('classDetailModal').classList.add('hidden')};$('classDetailAction').onclick=async()=>{const b=$('classDetailAction'),booked=b.dataset.booked==='1';b.disabled=true;b.textContent=booked?'Cancelling…':'Booking…';const{error}=await supabase.rpc(booked?'cancel_class_booking':'book_class_session',{p_session_id:b.dataset.sessionId});if(error){$('classDetailMsg').textContent=error.message||'Could not update booking';$('classDetailMsg').className='msg bad';b.disabled=false;return}$('classDetailModal').classList.add('hidden');await loadClasses()};\n"""
          if detail_js not in s:
            s=s.replace(anchor,detail_js+anchor,1)
          p.write_text(s)

          pp=Path('member-preview.html')
          ps=pp.read_text()
          if 'id="previewClassModal"' not in ps:
            ps=ps.replace('</body>', '''<div id="previewClassModal" style="display:none;position:fixed;inset:0;background:rgba(11,16,32,.58);z-index:100;place-items:center;padding:18px"><div style="width:min(560px,100%);background:#fff;border-radius:20px;padding:20px"><div class="section-title"><h3 id="previewClassName" style="margin:0"></h3><button id="previewClassClose" class="btn secondary">Close</button></div><div id="previewClassTime" class="muted" style="margin:8px 0 12px"></div><div id="previewClassDesc" style="line-height:1.55"></div><div class="muted" style="margin-top:12px">Coach: Demo coach</div></div></div></body>''',1)
          preview_inject="""\nfunction wirePreviewClassDetails(){document.querySelectorAll('#classes .row').forEach((row,i)=>{row.style.cursor='pointer';row.onclick=e=>{if(e.target.closest('button'))return;const names=['Early Engine','Hybrid Strength','Express Conditioning','Hybrid Conditioning','Evening Engine'];const desc=['Aerobic engine work to build sustainable conditioning and pacing.','Strength-focused hybrid session combining major lifts with functional conditioning.','A shorter high-intensity conditioning session for busy schedules.','Mixed strength and conditioning using functional fitness movements.','End-of-day engine session focused on aerobic capacity and controlled hard efforts.'];document.getElementById('previewClassName').textContent=names[i]||row.querySelector('h4')?.textContent||'Class';document.getElementById('previewClassTime').textContent=row.querySelector('.muted')?.textContent||'';document.getElementById('previewClassDesc').textContent=desc[i]||'Full class description will appear here.';document.getElementById('previewClassModal').style.display='grid'}});document.getElementById('previewClassClose').onclick=()=>document.getElementById('previewClassModal').style.display='none';document.getElementById('previewClassModal').onclick=e=>{if(e.target.id==='previewClassModal')e.currentTarget.style.display='none'}}\n"""
          if 'function wirePreviewClassDetails()' not in ps:
            ps=ps.replace('</script>',preview_inject+'\nwirePreviewClassDetails();\n</script>',1)
          pp.write_text(ps)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member.html member-preview.html
          git commit -m "Add clickable member class details" || exit 0
          git push
