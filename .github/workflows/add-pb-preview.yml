name: Add PB page to member preview
on:
  push:
    paths:
      - '.github/workflows/add-pb-preview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch member preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('member-preview.html')
          s=p.read_text()
          s=s.replace(".pb-card{", ".pb-card{") if ".pb-card{" in s else s.replace(".bottom{display:none}", ".pb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.pb-card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.pb-icon{font-size:28px}.pb-value{font-size:26px;font-weight:900;margin-top:8px}.bottom{display:none}")
          s=s.replace(".bottom{display:grid;position:fixed;left:0;right:0;bottom:0;grid-template-columns:repeat(6,1fr)", ".pb-grid{grid-template-columns:1fr}.bottom{display:grid;position:fixed;left:0;right:0;bottom:0;grid-template-columns:repeat(7,1fr)")
          s=s.replace('<button data-page="workouts">◇ Workouts</button><button data-page="membership">£ My membership</button>', '<button data-page="workouts">◇ Workouts</button><button data-page="pbs">🏆 PBs</button><button data-page="membership">£ My membership</button>')
          pb='''<section id="pbs" class="page"><div class="section-title"><div><div class="eyebrow">Personal records</div><h2 style="margin:4px 0">My PBs</h2></div><button class="btn secondary">+ Add PB</button></div><div class="pb-grid"><div class="pb-card"><div class="pb-icon">🏋️</div><div class="eyebrow" style="margin-top:8px">Weight</div><h3 style="margin:5px 0">Deadlift</h3><div class="pb-value">145 kg</div><div class="muted">12 Sep 2026</div></div><div class="pb-card"><div class="pb-icon">🔁</div><div class="eyebrow" style="margin-top:8px">Reps</div><h3 style="margin:5px 0">Pull-ups</h3><div class="pb-value">14 reps</div><div class="muted">8 Sep 2026</div></div><div class="pb-card"><div class="pb-icon">⏱️</div><div class="eyebrow" style="margin-top:8px">Time</div><h3 style="margin:5px 0">5K run</h3><div class="pb-value">24:18</div><div class="muted">Lower is better</div></div><div class="pb-card"><div class="pb-icon">📏</div><div class="eyebrow" style="margin-top:8px">Distance</div><h3 style="margin:5px 0">Row</h3><div class="pb-value">5,000 m</div><div class="muted">15 Sep 2026</div></div></div></section>\n'''
          if 'id="pbs"' not in s:
              s=s.replace('<section id="membership" class="page">', pb+'<section id="membership" class="page">')
          s=s.replace('<button data-page="workouts">◇<br>Workouts</button><button data-page="membership">£<br>Plan</button>', '<button data-page="workouts">◇<br>Workouts</button><button data-page="pbs">🏆<br>PBs</button><button data-page="membership">£<br>Plan</button>')
          p.write_text(s)
          PY
      - name: Commit preview update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member-preview.html
          git diff --cached --quiet || git commit -m "Add PB page to member preview"
          git push
