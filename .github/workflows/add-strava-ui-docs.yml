name: Add Strava integration UI and docs
on:
  push:
    paths:
      - '.github/workflows/add-strava-ui-docs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch member pages and handover
        run: |
          python - <<'PY'
          from pathlib import Path

          # Real member portal: add Integrations to desktop nav and Profile card.
          p=Path('member.html'); s=p.read_text()
          if 'integrations.html' not in s:
              s=s.replace('<button data-page="profile">◉ Profile</button>', '<button onclick="location.href=\'./integrations.html\'">↗ Integrations</button><button data-page="profile">◉ Profile</button>', 1)
              marker='<section id="profile" class="page"><div><div class="eyebrow">Your account</div><h2>Profile</h2></div><div class="card"><div id="profileGrid" class="profile"></div></div></section>'
              repl='<section id="profile" class="page"><div><div class="eyebrow">Your account</div><h2>Profile</h2></div><div class="card"><div id="profileGrid" class="profile"></div></div><div class="card" style="margin-top:16px"><div class="section-title"><div><div class="eyebrow">Connected services</div><h3 style="margin:4px 0">Integrations</h3></div><a class="btn secondary" href="./integrations.html" style="text-decoration:none">Manage</a></div><div class="muted">Connect Strava so runs, rides and other activities can appear in your workout history automatically.</div></div></section>'
              s=s.replace(marker,repl)
              p.write_text(s)

          # Preview: add integrations link and preview card.
          p=Path('member-preview.html'); s=p.read_text()
          if 'integrations.html?preview=1' not in s:
              s=s.replace('<button data-page="profile">◉ Profile</button>', '<a href="./integrations.html?preview=1">↗ Integrations</a><button data-page="profile">◉ Profile</button>', 1)
              marker='<section id="profile" class="page"><div><div class="eyebrow">Your account</div><h2>Profile</h2></div><div class="card"><div class="profile">'
              repl='<section id="profile" class="page"><div><div class="eyebrow">Your account</div><h2>Profile</h2></div><div class="card"><div class="profile">'
              s=s.replace(marker,repl,1)
              # add a visible mobile-accessible integration card immediately before profile section closes when possible
              target='</div></div></section></main>'
              card='</div></div><div class="card" style="margin-top:16px"><div class="section-title"><div><div class="eyebrow">Connected services</div><h3 style="margin:4px 0">Integrations</h3></div><a class="btn secondary" href="./integrations.html?preview=1" style="text-decoration:none">Manage</a></div><div class="muted">Strava demo connection is ready to preview.</div></div></section></main>'
              if target in s: s=s.replace(target,card,1)
              p.write_text(s)

          # Handover: append a durable Strava section.
          p=Path('HANDOVER.md'); s=p.read_text()
          if '## 19. Strava integration scaffold' not in s:
              s += '''\n\n## 19. Strava integration scaffold\n\nStrava has now been scaffolded in the same spirit as GoCardless: the product/database/server flow exists even though production API credentials have not yet been added.\n\nBackend tables:\n\n- `strava_connections` — non-secret connection metadata only\n- `strava_activities` — imported activity summaries, private to the owning member by RLS\n- `private.strava_tokens` — access/refresh tokens; never browser-readable\n- `private.strava_oauth_states` — short-lived OAuth state records\n- `private.strava_webhook_events` — raw webhook event store\n\nSupabase Edge Functions:\n\n- `strava-connect` — authenticated member OAuth start; gracefully reports not configured until secrets exist\n- `strava-callback` — public OAuth callback; exchanges code and stores tokens server-side\n- `strava-webhook` — public Strava webhook verification/event receiver; acknowledges quickly and records events\n- `strava-sync` — authenticated member manual sync; refreshes tokens, imports recent activities and creates corresponding Hybrid OS workout sessions/entries/sets\n\nRequired future Supabase secrets:\n\n- `STRAVA_CLIENT_ID`\n- `STRAVA_CLIENT_SECRET`\n- `STRAVA_VERIFY_TOKEN`\n\nCurrent UI:\n\n- `integrations.html` is the member integrations page\n- `integrations.html?preview=1` provides a no-credentials demo of the Strava experience\n- member Profile links to integrations\n- member preview links to the Strava demo\n\nImported activity data is intentionally private to the member by default. Do not expose Strava-derived activity detail to coaches, staff or other members unless Strava's current API terms explicitly permit the intended use.\n\nCurrent Strava architecture uses `activity:read` as the intended default scope, not `activity:read_all`. Webhooks should be used for ongoing activity events rather than aggressive polling. Before activation, re-check current Strava API endpoints/terms because their API base URL changed in June 2026.\n'''
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add member.html member-preview.html HANDOVER.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Strava integration entry points and handover docs'
          git push
