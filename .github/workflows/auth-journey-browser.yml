name: HybridOne Auth journey browser

# Release-gate browser verification for the exact dev revision.
# Persistent Admin shell account menu is included in this gate.

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/auth-journey-browser.yml'
      - 'admin.html'
      - 'admin-frame.js'
      - 'admin-frame.css'
      - 'gym-switcher.js'
      - 'account-menu.js'
      - 'shared-shell.js'
      - 'app-consistency.css'
      - 'gym-context.js'
      - 'choose-gym.html'
      - 'login.html'
      - 'scripts/build_site.py'
      - 'scripts/smoke_test.py'

permissions:
  contents: read
  id-token: write

jobs:
  auth-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Record exact dev SHA
        shell: bash
        run: echo "HYBRID_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for exact public Pages revision
        env:
          PAGES_URL: https://perranporthafcmens.github.io/HybridOS/
        run: python3 scripts/runtime_pages_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Create disposable two-gym Auth account
        shell: bash
        run: |
          set -euo pipefail
          INITIAL_PASS="$(python3 -c 'import secrets; print("H1!"+secrets.token_urlsafe(24))')"
          echo "::add-mask::$INITIAL_PASS"
          echo "AUTH_JOURNEY_PASSWORD=$INITIAL_PASS" >> "$GITHUB_ENV"
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          BODY="$(INITIAL_PASS="$INITIAL_PASS" python3 -c 'import json,os; print(json.dumps({"password":os.environ["INITIAL_PASS"]}))')"
          curl --fail-with-body -sS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             --data "$BODY"             https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-auth-journey-setup             -o /tmp/setup.json
          python3 -c "import json; d=json.load(open('/tmp/setup.json')); assert d.get('ok') is True, d; print('Disposable Auth journey account created')"

      - name: Verify universal login, switch, refresh/back and sign-out on dev
        env:
          DEV_BASE: https://perranporthafcmens.github.io/HybridOS/
          TEST_EMAIL: delivered@resend.dev
          HUB_GYM_ID: 242f57c2-6e37-4977-b3c5-1c87de7d0b98
          PUFFIN_GYM_ID: aec16956-3793-4543-873b-4412646ca1eb
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          const base=process.env.DEV_BASE;
          const email=process.env.TEST_EMAIL;
          const password=process.env.AUTH_JOURNEY_PASSWORD;
          const hub=process.env.HUB_GYM_ID;
          const puffin=process.env.PUFFIN_GYM_ID;

          async function waitForAdminPortal(page,gymId){
            await page.waitForURL(url=>{
              const leaf=url.pathname.split('/').pop();
              return (leaf==='admin.html'||leaf==='index.html')&&url.searchParams.get('gym_id')===gymId;
            },{timeout:20000});
          }

          async function accountControls(page){
            const top=page.locator('.userchip').first();
            if(await top.count()){
              await top.waitFor({state:'visible',timeout:20000});
              return {
                chip:top,
                switchBtn:page.locator('#accountSwitchGymBtn'),
                signOutBtn:page.locator('#accountSignOutBtn')
              };
            }
            const frame=page.frameLocator('.admin-content-frame.active');
            await frame.locator('.userchip').waitFor({state:'visible',timeout:20000});
            return {
              chip:frame.locator('.userchip'),
              switchBtn:frame.locator('#accountSwitchGymBtn'),
              signOutBtn:frame.locator('#accountSignOutBtn')
            };
          }

          async function loginAndChoose(page,gymId){
            await page.goto(base+'login.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#email').fill(email);
            await page.locator('#password').fill(password);
            await page.locator('#signIn').click();
            await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html'),{timeout:20000});
            const cards=page.locator('.gym-card');
            await page.waitForFunction(()=>document.querySelectorAll('.gym-card').length===2,null,{timeout:20000});
            assert.equal(await cards.count(),2,'expected exactly two active gyms');
            const chooserText=await page.locator('#gyms').innerText();
            assert.match(chooserText,/Hybrid Hub/i);
            assert.match(chooserText,/Puffin Performance/i);
            await page.locator('[data-gym="'+gymId+'"]').click();
            await waitForAdminPortal(page,gymId);
            assert.equal(await page.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),gymId,'active gym context mismatch after chooser');
          }

          async function switchGym(page,gymId){
            const account=await accountControls(page);
            await account.chip.click();
            await account.switchBtn.waitFor({state:'visible',timeout:20000});
            await account.switchBtn.click();
            await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html')&&url.searchParams.get('switch')==='1',{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.gym-card').length===2,null,{timeout:20000});
            await page.locator('[data-gym="'+gymId+'"]').click();
            await waitForAdminPortal(page,gymId);
            assert.equal(await page.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),gymId,'active gym context mismatch after switch');
          }

          async function visibleSidebarSwitch(page,{mobile=false}={}){
            if(mobile){
              const menu=page.locator('.admin-frame-mobile');
              await menu.waitFor({state:'visible',timeout:20000});
              const open=await page.evaluate(()=>document.body.classList.contains('admin-frame-menu-open'));
              if(!open)await menu.click();
              await page.waitForFunction(()=>document.body.classList.contains('admin-frame-menu-open'),null,{timeout:5000});
            }
            const note=page.locator('.admin-frame-shell>.side .hybrid-gym-switch-note');
            await note.waitFor({state:'visible',timeout:20000});
            assert.equal((await note.innerText()).trim(),'Switch gym','persistent sidebar switch label mismatch');
            const card=page.locator('.admin-frame-shell>.side .hybrid-shell-gym.hybrid-gym-switchable');
            await card.waitFor({state:'visible',timeout:20000});
            assert.equal(await card.getAttribute('aria-label'),'Switch gym','persistent sidebar switch control missing aria label');
            return card;
          }

          async function switchGymFromSidebar(page,gymId,{mobile=false}={}){
            const card=await visibleSidebarSwitch(page,{mobile});
            await card.click();
            await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html')&&url.searchParams.get('switch')==='1',{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.gym-card').length===2,null,{timeout:20000});
            await page.locator('[data-gym="'+gymId+'"]').click();
            await waitForAdminPortal(page,gymId);
            assert.equal(await page.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),gymId,'active gym context mismatch after persistent sidebar switch');
          }

          async function signOutAndRelog(page){
            const account=await accountControls(page);
            await account.chip.click();
            await account.signOutBtn.waitFor({state:'visible',timeout:20000});
            await account.signOutBtn.click();
            await page.waitForURL(url=>url.pathname.endsWith('/login.html'),{timeout:20000});
            assert.equal(await page.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),null,'gym context was not cleared by sign out');
            await page.waitForTimeout(750);
            assert.ok(page.url().includes('/login.html'),'signed-out session silently re-entered the app');

            await page.locator('#email').fill(email);
            await page.locator('#password').fill(password);
            await page.locator('#signIn').click();
            await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html'),{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.gym-card').length===2,null,{timeout:20000});
            assert.equal(await page.locator('.gym-card').count(),2,'re-login did not restore the two-gym chooser');
            await page.locator('[data-gym="'+hub+'"]').click();
            await waitForAdminPortal(page,hub);
            assert.equal(await page.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),hub);
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const desktop=await browser.newContext({viewport:{width:1440,height:1000}});
              const dp=await desktop.newPage();
              await loginAndChoose(dp,hub);
              await visibleSidebarSwitch(dp);
              await switchGymFromSidebar(dp,puffin);
              await switchGymFromSidebar(dp,hub);
              await switchGym(dp,puffin);
              await dp.reload({waitUntil:'domcontentloaded'});
              await waitForAdminPortal(dp,puffin);
              assert.equal(await dp.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),puffin,'desktop refresh lost gym context');
              await signOutAndRelog(dp);
              console.log('Desktop universal login, switch, refresh, sign-out and re-login passed');
              await desktop.close();

              const mobile=await browser.newContext({viewport:{width:390,height:844}});
              const mp=await mobile.newPage();
              await loginAndChoose(mp,hub);
              console.log('Mobile portal diagnostics',JSON.stringify({
                url:mp.url(),
                shellCount:await mp.locator('.admin-frame-shell').count(),
                menuCount:await mp.locator('.admin-frame-mobile').count(),
                innerWidth:await mp.evaluate(()=>innerWidth),
                mobileMedia:await mp.evaluate(()=>matchMedia('(max-width:900px)').matches)
              }));
              await visibleSidebarSwitch(mp,{mobile:true});
              await switchGymFromSidebar(mp,puffin,{mobile:true});
              await switchGymFromSidebar(mp,hub,{mobile:true});
              await switchGymFromSidebar(mp,puffin,{mobile:true});
              await mp.reload({waitUntil:'domcontentloaded'});
              await waitForAdminPortal(mp,puffin);
              assert.equal(await mp.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),puffin,'mobile refresh lost gym context');

              await mp.goto(base+'admin-access.html?gym_id='+puffin,{waitUntil:'domcontentloaded',timeout:30000});
              await mp.waitForTimeout(500);
              assert.ok(!mp.url().includes('/login.html'),'authenticated mobile protected route fell back to login');
              const back=await mp.goBack({waitUntil:'domcontentloaded',timeout:20000});
              if(back){
                await mp.waitForTimeout(500);
                assert.ok(!mp.url().includes('/login.html')&&!mp.url().includes('/choose-gym.html'),'mobile back navigation entered an auth loop');
                const url=new URL(mp.url());
                if(url.searchParams.get('gym_id'))assert.equal(url.searchParams.get('gym_id'),puffin,'mobile back navigation changed gym URL context');
                assert.equal(await mp.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),puffin,'mobile back navigation lost gym context');
              }
              console.log('Mobile refresh/back gym-context journey passed');
              await mobile.close();
            }finally{
              await browser.close();
            }
          })().catch(err=>{console.error(err);process.exit(1)});
          JS

      - name: Verify reset and magic-link journeys in production browser
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"

          get_link() {
            local endpoint="$1"
            curl --fail-with-body -sS               -H "Authorization: Bearer $OIDC"               -H "Content-Type: application/json"               --data '{}'               "https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/$endpoint"               -o /tmp/link.json
            ACTION_URL="$(python3 -c 'import json; d=json.load(open("/tmp/link.json")); assert d.get("ok") is True, d; print(d["url"])')"
            echo "::add-mask::$ACTION_URL"
            export ACTION_URL
          }

          run_browser() {
            export MODE="$1"
            export EXPECTED_GYM="$2"
            export EXPECTED_NAME="$3"
            export LOGIN_PATH="$4"
            export NEW_PASSWORD="$5"
            node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const EMAIL='delivered@resend.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              let context=await browser.newContext({viewport:{width:390,height:844}});
              let page=await context.newPage();
              await page.goto(process.env.ACTION_URL,{waitUntil:'domcontentloaded',timeout:30000});
              if(process.env.MODE==='recovery'){
                await page.waitForFunction(()=>document.querySelector('#heading')?.textContent?.includes('Choose a new password'),null,{timeout:20000});
                assert.equal((await page.locator('#gymBrand').innerText()).trim(),process.env.EXPECTED_NAME);
                await page.locator('#password').fill(process.env.NEW_PASSWORD);
                await page.locator('#confirmPassword').fill(process.env.NEW_PASSWORD);
                await page.locator('#savePassword').click();
                await page.waitForFunction(()=>document.querySelector('#heading')?.textContent?.includes('Password updated'),null,{timeout:20000});
                const href=await page.locator('#continueBtn').getAttribute('href');
                assert.ok(href && href.includes('admin.html?gym_id='+process.env.EXPECTED_GYM));
                await page.locator('#continueBtn').click();
                await page.waitForURL(new RegExp('admin\\.html\\?gym_id='+process.env.EXPECTED_GYM),{timeout:20000});
                await context.close();

                context=await browser.newContext({viewport:{width:390,height:844}});
                page=await context.newPage();
                await page.goto('https://www.hybridone.co.uk/'+process.env.LOGIN_PATH,{waitUntil:'domcontentloaded',timeout:30000});
                await page.locator('#email').fill(EMAIL);
                await page.locator('#password').fill(process.env.NEW_PASSWORD);
                await page.locator('#signIn').click();
                await page.waitForURL(new RegExp('admin\\.html\\?gym_id='+process.env.EXPECTED_GYM),{timeout:20000});
                console.log(process.env.EXPECTED_NAME+' password reset and new-password login passed');
              }else{
                await page.waitForFunction(()=>document.querySelector('#heading')?.textContent?.includes('Secure link verified'),null,{timeout:20000});
                assert.equal((await page.locator('#gymBrand').innerText()).trim(),process.env.EXPECTED_NAME);
                const href=await page.locator('#continueBtn').getAttribute('href');
                assert.ok(href && href.includes('admin.html?gym_id='+process.env.EXPECTED_GYM));
                await page.locator('#continueBtn').click();
                await page.waitForURL(new RegExp('admin\\.html\\?gym_id='+process.env.EXPECTED_GYM),{timeout:20000});
                console.log(process.env.EXPECTED_NAME+' magic-link sign-in passed');
              }
            }finally{
              await browser.close();
            }
          })().catch(err=>{console.error(err.message);process.exit(1)});
          JS
          }

          HUB_PASS="$(python3 -c 'import secrets; print("Hub!"+secrets.token_urlsafe(24))')"
          PUFFIN_PASS="$(python3 -c 'import secrets; print("Puf!"+secrets.token_urlsafe(24))')"
          echo "::add-mask::$HUB_PASS"
          echo "::add-mask::$PUFFIN_PASS"

          get_link hybridone-link-hub-recovery
          run_browser recovery 242f57c2-6e37-4977-b3c5-1c87de7d0b98 "Hybrid Hub" hybrid-hub "$HUB_PASS"

          get_link hybridone-link-puffin-recovery
          run_browser recovery aec16956-3793-4543-873b-4412646ca1eb "Puffin Performance" puffin-performance "$PUFFIN_PASS"

          get_link hybridone-link-hub-magic
          run_browser magic 242f57c2-6e37-4977-b3c5-1c87de7d0b98 "Hybrid Hub" hybrid-hub unused

          get_link hybridone-link-puffin-magic
          run_browser magic aec16956-3793-4543-873b-4412646ca1eb "Puffin Performance" puffin-performance unused

      - name: Send remaining live Auth email combinations
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          sleep 65
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data '{}' \
            https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-send-hub-magic \
            -o /tmp/hub-mail.json
          python3 -c "import json; d=json.load(open('/tmp/hub-mail.json')); assert d.get('ok') is True, d"
          echo "Hybrid Hub magic-link email request accepted"
          sleep 65
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data '{}' \
            https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-send-puffin-recovery \
            -o /tmp/puffin-mail.json
          python3 -c "import json; d=json.load(open('/tmp/puffin-mail.json')); assert d.get('ok') is True, d"
          echo "Puffin Performance recovery email request accepted"

      - name: Clean up disposable Auth account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          curl --fail-with-body -sS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             --data '{}'             https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-auth-journey-cleanup             -o /tmp/cleanup.json
          python3 -c "import json; d=json.load(open('/tmp/cleanup.json')); assert d.get('ok') is True and d.get('cleaned') is True, d; print('Disposable Auth journey account removed')"

      - name: Create disposable one-gym Auth account
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          BODY="$(AUTH_JOURNEY_PASSWORD="$AUTH_JOURNEY_PASSWORD" python3 -c 'import json,os; print(json.dumps({"password":os.environ["AUTH_JOURNEY_PASSWORD"],"mode":"hub_only"}))')"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-auth-journey-setup \
            -o /tmp/one-gym-setup.json
          python3 -c "import json; d=json.load(open('/tmp/one-gym-setup.json')); assert d.get('ok') is True and d.get('mode') == 'hub_only', d; print('Disposable one-gym Auth account created')"

      - name: Verify one-gym login bypasses chooser
        env:
          DEV_BASE: https://perranporthafcmens.github.io/HybridOS/
          TEST_EMAIL: delivered@resend.dev
          HUB_GYM_ID: 242f57c2-6e37-4977-b3c5-1c87de7d0b98
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const base=process.env.DEV_BASE;
          const email=process.env.TEST_EMAIL;
          const password=process.env.AUTH_JOURNEY_PASSWORD;
          const hub=process.env.HUB_GYM_ID;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext({viewport:{width:1440,height:1000}});
              const page=await context.newPage();
              await page.goto(base+'login.html',{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#email').fill(email);
              await page.locator('#password').fill(password);
              await page.locator('#signIn').click();
              await page.waitForURL(url=>{
                const leaf=url.pathname.split('/').pop();
                return (leaf==='admin.html'||leaf==='index.html')&&url.searchParams.get('gym_id')===hub;
              },{timeout:20000});
              assert.ok(!page.url().includes('/choose-gym.html'),'one-gym account was incorrectly sent to chooser');
              assert.equal(await page.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),hub,'one-gym login did not set Hub context');
              console.log('One-gym universal login bypassed chooser and entered Hybrid Hub');
              await context.close();
            }finally{await browser.close()}
          })().catch(err=>{console.error(err);process.exit(1)});
          JS

      - name: Clean up one-gym Auth account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data '{}' \
            https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-auth-journey-cleanup \
            -o /tmp/one-gym-cleanup.json
          python3 -c "import json; d=json.load(open('/tmp/one-gym-cleanup.json')); assert d.get('ok') is True and d.get('cleaned') is True, d; print('Disposable one-gym Auth account removed')"

      - name: Classify live member signup confirmation mode
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(python3 -c 'import secrets; print("S1!"+secrets.token_urlsafe(24))')"
          echo "::add-mask::$PASS"
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          BODY="$(PASS="$PASS" python3 -c 'import json,os; print(json.dumps({"password":os.environ["PASS"]}))')"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-signup-confirm-probe \
            -o /tmp/signup-probe.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/signup-probe.json'))
          assert d.get('ok') is True,d
          print("Signup returned active session:",bool(d.get('has_session')))
          print("Signup email confirmed at creation:",bool(d.get('email_confirmed_at')))
          PY
          sleep 5

      - name: Clean up signup probe account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC" \
