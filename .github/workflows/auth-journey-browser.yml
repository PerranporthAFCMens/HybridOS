name: HybridOne Auth journey browser

# Release-gate browser verification for the exact dev revision; harmless claim-function ACL trigger comment.
# Persistent Admin shell account menu is included in this gate.
# Task 4 route-preservation verification trigger.
# Release-candidate exact-SHA gate trigger.
# Hold-lift exact-SHA gate trigger.
# Cross-gate exact-SHA trigger.
# Post-Stage-2a live database verification trigger.
# 9 October release exact-SHA trigger (so every required check starts from the release commit itself).
# 11 October release exact-SHA trigger (same reason).
# 14 October release exact-SHA trigger (same reason).
# 15 October release exact-SHA trigger (same reason).

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'vercel.json'
      - 'scripts/**'
      - 'PROJECT_STATE.json'
      - '.github/workflows/**'
      # The new web app (web/) has its own checks (web-checks, web-days). These older checks test the original pages, so a
      # change that only touches web/ no longer starts them. A change to any other listed file still does.
      - '!web/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: hybridone-auth-journey
  cancel-in-progress: false

jobs:
  auth-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Record exact dev SHA
        shell: bash
        run: echo "HYBRID_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for exact public Pages revision
        env:
          PAGES_URL: https://perranporthafcmens.github.io/HybridOS/
        run: python3 scripts/runtime_pages_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          # The system-package part of this step is sometimes very slow on GitHub's servers (22 seconds to 6 minutes
          # on 12 October 2026). Cap each try and try again, as the web app checks do.
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install --with-deps chromium; then exit 0; fi
            echo "Browser install attempt $attempt stalled or failed; trying again."
          done
          exit 1

      - name: Create disposable two-gym Auth account
        shell: bash
        run: |
          set -euo pipefail
          INITIAL_PASS="$(python3 -c 'import secrets; print("H1!"+secrets.token_urlsafe(24))')"
          echo "::add-mask::$INITIAL_PASS"
          echo "AUTH_JOURNEY_PASSWORD=$INITIAL_PASS" >> "$GITHUB_ENV"
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          BODY="$(INITIAL_PASS="$INITIAL_PASS" python3 -c 'import json,os; print(json.dumps({"password":os.environ["INITIAL_PASS"]}))')"
          curl --fail-with-body -sS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             --data "$BODY"             https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-auth-journey-setup             -o /tmp/setup.json
          python3 -c "import json; d=json.load(open('/tmp/setup.json')); assert d.get('ok') is True, d; print('Disposable Auth journey account created')"

      - name: Verify universal login, switch, refresh/back and sign-out on dev
        env:
          DEV_BASE: https://perranporthafcmens.github.io/HybridOS/
          TEST_EMAIL: delivered@resend.dev
          HUB_GYM_ID: 242f57c2-6e37-4977-b3c5-1c87de7d0b98
          PUFFIN_GYM_ID: aec16956-3793-4543-873b-4412646ca1eb
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          const base=process.env.DEV_BASE;
          const email=process.env.TEST_EMAIL;
          const password=process.env.AUTH_JOURNEY_PASSWORD;
          const hub=process.env.HUB_GYM_ID;
          const puffin=process.env.PUFFIN_GYM_ID;
          const NAMES={[hub]:'Hybrid Hub',[puffin]:'Puffin Performance'};

          // Owners and admins land in the new app (admin.html sends them to /today). These checks use that app's own sidebar:
          // the current gym name, a "Switch gym" link, the signed-in name and role, and a Sign out button.
          async function waitForNewApp(page,gymId){
            await page.waitForURL(url=>url.pathname.endsWith('/today'),{timeout:30000});
            await page.locator('.side .gym b').waitFor({state:'visible',timeout:20000});
            await page.waitForFunction(name=>document.querySelector('.side .gym b')?.textContent?.trim()===name,NAMES[gymId],{timeout:20000});
            assert.equal(await page.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),gymId,'active gym context mismatch');
          }

          async function openMenuIfMobile(page,mobile){
            if(!mobile)return;
            const open=await page.locator('.shell.open').count();
            if(!open)await page.locator('.menu-btn').click();
            await page.locator('.shell.open').waitFor({state:'attached',timeout:5000});
          }

          async function assertAccount(page,gymId,mobile){
            await openMenuIfMobile(page,mobile);
            await page.locator('.side .account .who-name').waitFor({timeout:20000});
            const who=await page.locator('.side .account .who').innerText();
            const text=who.replace(/\s+/g,' ').trim();
            console.log('Account area for '+NAMES[gymId]+': '+text);
            assert.match(text,/HybridOne Auth Journey Test|delivered/i,'account area did not show the test account name');
            assert.match(text,/owner|admin/i,'account area did not show an owner or admin role');
            assert.equal((await page.locator('.side .gym b').innerText()).trim(),NAMES[gymId],'sidebar showed the wrong gym');
            const link=page.locator('.side .gym a');
            assert.equal((await link.innerText()).trim(),'Switch gym','sidebar switch-gym link missing');
          }

          async function loginAndChoose(page,gymId){
            await page.goto(base+'login.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#email').fill(email);
            await page.locator('#password').fill(password);
            await page.locator('#signIn').click();
            await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html'),{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.gym-card').length===2,null,{timeout:20000});
            assert.equal(await page.locator('.gym-card').count(),2,'expected exactly two active gyms');
            const chooserText=await page.locator('#gyms').innerText();
            assert.match(chooserText,/Hybrid Hub/i);
            assert.match(chooserText,/Puffin Performance/i);
            await page.locator('[data-gym="'+gymId+'"]').click();
            await waitForNewApp(page,gymId);
          }

          async function switchGym(page,gymId,mobile){
            await openMenuIfMobile(page,mobile);
            await page.locator('.side .gym a').click();
            await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html')&&url.searchParams.get('switch')==='1',{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.gym-card').length===2,null,{timeout:20000});
            await page.locator('[data-gym="'+gymId+'"]').click();
            await waitForNewApp(page,gymId);
          }

          async function assertNoGymFallsBackToChooser(context){
            const page=await context.newPage();
            try{
              await page.goto(base+'today',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html'),{timeout:20000});
              assert.equal(await page.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),null,'Missing gym context silently selected a gym');
            }finally{await page.close()}
          }

          async function signOutAndRelog(page,mobile){
            await openMenuIfMobile(page,mobile);
            await page.getByRole('button',{name:'Sign out'}).click();
            await page.waitForURL(url=>url.pathname.endsWith('/login.html'),{timeout:20000});
            await page.waitForTimeout(750);
            assert.ok(page.url().includes('/login.html'),'signed-out session silently re-entered the app');
            await page.goto(base+'today',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForURL(url=>url.pathname.endsWith('/login.html'),{timeout:20000});
            await page.locator('#email').fill(email);
            await page.locator('#password').fill(password);
            await page.locator('#signIn').click();
            await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html'),{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.gym-card').length===2,null,{timeout:20000});
            assert.equal(await page.locator('.gym-card').count(),2,'re-login did not restore the two-gym chooser');
            await page.locator('[data-gym="'+hub+'"]').click();
            await waitForNewApp(page,hub);
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const desktop=await browser.newContext({viewport:{width:1440,height:1000}});
              const dp=await desktop.newPage();
              await loginAndChoose(dp,hub);
              await assertAccount(dp,hub,false);
              await switchGym(dp,puffin,false);
              await assertAccount(dp,puffin,false);
              await switchGym(dp,hub,false);
              await assertAccount(dp,hub,false);
              await switchGym(dp,puffin,false);
              await assertNoGymFallsBackToChooser(desktop);
              await dp.reload({waitUntil:'domcontentloaded'});
              await waitForNewApp(dp,puffin);
              await dp.getByRole('link',{name:'Members'}).first().click();
              await dp.waitForURL(url=>!url.pathname.endsWith('/today'),{timeout:20000});
              const back=await dp.goBack({waitUntil:'domcontentloaded',timeout:20000});
              if(back){
                await dp.waitForTimeout(500);
                assert.ok(!dp.url().includes('/login.html')&&!dp.url().includes('/choose-gym.html'),'back navigation entered an auth loop');
                assert.equal(await dp.evaluate(()=>sessionStorage.getItem('hybrid-gym-id')),puffin,'back navigation lost gym context');
              }
              await signOutAndRelog(dp,false);
              console.log('Desktop universal login, switch, refresh, back, sign-out and re-login passed');
              await desktop.close();

              const mobile=await browser.newContext({viewport:{width:390,height:844}});
              const mp=await mobile.newPage();
              await loginAndChoose(mp,hub);
              await assertAccount(mp,hub,true);
              await switchGym(mp,puffin,true);
              await assertAccount(mp,puffin,true);
              await switchGym(mp,hub,true);
              await switchGym(mp,puffin,true);
              await mp.reload({waitUntil:'domcontentloaded'});
              await waitForNewApp(mp,puffin);
              await mp.goto(base+'today',{waitUntil:'domcontentloaded',timeout:30000});
              await mp.waitForTimeout(500);
              assert.ok(!mp.url().includes('/login.html'),'authenticated mobile protected route fell back to login');
              await signOutAndRelog(mp,true);
              console.log('Mobile switch, refresh, sign-out and re-login passed');
              await mobile.close();
            }finally{
              await browser.close();
            }
          })().catch(err=>{console.error(err);process.exit(1)});
          JS

      - name: Capture full visual UX audit
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-audit]')
        env:
          DEV_BASE: https://perranporthafcmens.github.io/HybridOS/
          TEST_EMAIL: delivered@resend.dev
          HUB_GYM_ID: 242f57c2-6e37-4977-b3c5-1c87de7d0b98
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const base=process.env.DEV_BASE,email=process.env.TEST_EMAIL,password=process.env.AUTH_JOURNEY_PASSWORD,hub=process.env.HUB_GYM_ID,out='visual-audit';
          const errors=[],manifest=[];
          const adminViews=['index.html','community.html','classes.html','class-setup.html','workout-builder.html','admin-access.html','admin-operations.html','resource-availability.html','staff-permissions.html','access-settings.html','reporting.html','member-view-settings.html','member-memberships.html','communications.html'];
          const safe=v=>v.replace(/[^a-z0-9_-]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
          async function settle(page,ms=700){await page.waitForLoadState('domcontentloaded').catch(()=>{});await page.waitForTimeout(ms)}
          async function snap(page,vp,surface,{wait=700,fullPage=true}={}){
            try{await settle(page,wait);const file=vp+'__'+safe(surface)+'.png';await page.screenshot({path:path.join(out,file),fullPage});manifest.push({viewport:vp,surface,file,url:page.url()});console.log('captured',file)}
            catch(err){errors.push({viewport:vp,surface,url:page.url(),error:String(err?.message||err)});console.warn('capture failed',vp,surface,err?.message||err)}
          }
          async function publicPages(page,vp){
            for(const [surface,href] of [['public-landing','landing.html'],['public-login','login.html'],['public-hybrid-hub-login','hybrid-hub-login.html'],['public-puffin-login','puffin-performance-login.html'],['public-join-hybrid-hub','join.html?gym_id='+hub]]){
              await page.goto(base+href,{waitUntil:'domcontentloaded',timeout:30000});await snap(page,vp,surface);
            }
          }
          async function login(page,vp){
            await page.goto(base+'login.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#email').fill(email);await page.locator('#password').fill(password);await page.locator('#signIn').click();
            await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html'),{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.gym-card').length===2,null,{timeout:20000});
            await snap(page,vp,'auth-choose-gym');
            await page.locator('[data-gym="'+hub+'"]').click();
            await page.waitForURL(url=>{const leaf=url.pathname.split('/').pop();return(leaf==='admin.html'||leaf==='index.html')&&url.searchParams.get('gym_id')===hub},{timeout:20000});
            await settle(page,1000);
          }
          async function admin(page,vp){
            for(const view of adminViews){
              await page.goto(base+'admin.html?gym_id='+hub+'&view='+encodeURIComponent(view),{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>!!document.querySelector('.admin-content-frame.active'),null,{timeout:15000}).catch(()=>{});
              await snap(page,vp,'admin-'+view.replace('.html',''),{wait:1200});
            }
            if(vp==='mobile'){
              await page.goto(base+'admin.html?gym_id='+hub+'&view=index.html',{waitUntil:'domcontentloaded',timeout:30000});await settle(page,1000);
              const btn=page.locator('.admin-frame-mobile');if(await btn.count()){await btn.click();await page.waitForTimeout(250);await snap(page,vp,'admin-mobile-drawer',{fullPage:false})}
            }
          }
          async function staff(page,vp){
            await page.goto(base+'staff.html?view=staff&gym_id='+hub,{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#app:not(.hidden)').waitFor({state:'visible',timeout:20000}).catch(()=>{});
            await snap(page,vp,'staff-home',{wait:1200});
            if(vp==='mobile'){const btn=page.locator('#mobileMenuBtn,.staff-mobile-menu-btn').first();if(await btn.count()){await btn.click();await page.waitForTimeout(250);await snap(page,vp,'staff-mobile-drawer',{fullPage:false})}}
          }
          async function member(page,vp){
            await page.goto(base+'member.html?view=member&gym_id='+hub,{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#app:not(.hidden)').waitFor({state:'visible',timeout:20000}).catch(()=>{});
            await snap(page,vp,'member-home',{wait:1400});
            for(const key of ['classes','workouts','pbs','membership','profile']){
              const switched=await page.evaluate(key=>{
                const target=[...document.querySelectorAll('[data-page]')].find(el=>el.dataset.page===key);
                if(!target)return false;
                target.click();
                return true;
              },key);
              if(switched){await page.waitForTimeout(450);await snap(page,vp,'member-'+key,{wait:250})}
            }
            if(vp==='mobile'){const btn=page.locator('#mobileMenuBtn').first();if(await btn.count()){await btn.click();await page.waitForTimeout(250);await snap(page,vp,'member-mobile-drawer',{fullPage:false})}}
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const spec of [{name:'desktop',viewport:{width:1440,height:1000}},{name:'mobile',viewport:{width:390,height:844},isMobile:true,hasTouch:true}]){
                const context=await browser.newContext({viewport:spec.viewport,isMobile:!!spec.isMobile,hasTouch:!!spec.hasTouch});
                const page=await context.newPage();await publicPages(page,spec.name);await login(page,spec.name);await admin(page,spec.name);await staff(page,spec.name);await member(page,spec.name);await context.close();
              }
            }finally{await browser.close();fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify({build_sha:process.env.HYBRID_BUILD_SHA,captures:manifest,errors},null,2))}
          })().catch(err=>{errors.push({fatal:true,error:String(err?.stack||err)});fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify({build_sha:process.env.HYBRID_BUILD_SHA,captures:manifest,errors},null,2));console.error(err);process.exit(1)});
          JS

      - name: Upload visual UX audit
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-audit]'))
        uses: actions/upload-artifact@v4
        with:
          name: hybridone-visual-audit-${{ github.sha }}
          path: visual-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Verify reset and magic-link journeys in production browser
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"

          get_link() {
            local endpoint="$1"
            curl --fail-with-body -sS               -H "Authorization: Bearer $OIDC"               -H "Content-Type: application/json"               --data '{}'               "https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/$endpoint"               -o /tmp/link.json
            ACTION_URL="$(python3 -c 'import json; d=json.load(open("/tmp/link.json")); assert d.get("ok") is True, d; print(d["url"])')"
            echo "::add-mask::$ACTION_URL"
            export ACTION_URL
          }

          run_browser() {
            export MODE="$1"
            export EXPECTED_GYM="$2"
            export EXPECTED_NAME="$3"
            export LOGIN_PATH="$4"
            export NEW_PASSWORD="$5"
            node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const EMAIL='delivered@resend.dev';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              let context=await browser.newContext({viewport:{width:390,height:844}});
              let page=await context.newPage();
              await page.goto(process.env.ACTION_URL,{waitUntil:'domcontentloaded',timeout:30000});
              if(process.env.MODE==='recovery'){
                await page.waitForFunction(()=>document.querySelector('#heading')?.textContent?.includes('Choose a new password'),null,{timeout:20000});
                assert.equal((await page.locator('#gymBrand').innerText()).trim(),process.env.EXPECTED_NAME);
                await page.locator('#password').fill(process.env.NEW_PASSWORD);
                await page.locator('#confirmPassword').fill(process.env.NEW_PASSWORD);
                await page.locator('#savePassword').click();
                await page.waitForFunction(()=>document.querySelector('#heading')?.textContent?.includes('Password updated'),null,{timeout:20000});
                const href=await page.locator('#continueBtn').getAttribute('href');
                assert.ok(href && href.includes('admin.html?gym_id='+process.env.EXPECTED_GYM));
                await page.locator('#continueBtn').click();
                await page.waitForURL(new RegExp('admin\\.html\\?gym_id='+process.env.EXPECTED_GYM),{timeout:20000});
                await context.close();

                context=await browser.newContext({viewport:{width:390,height:844}});
                page=await context.newPage();
                await page.goto('https://www.hybridone.co.uk/'+process.env.LOGIN_PATH,{waitUntil:'domcontentloaded',timeout:30000});
                await page.locator('#email').fill(EMAIL);
                await page.locator('#password').fill(process.env.NEW_PASSWORD);
                await page.locator('#signIn').click();
                await page.waitForURL(new RegExp('admin\\.html\\?gym_id='+process.env.EXPECTED_GYM),{timeout:20000});
                console.log(process.env.EXPECTED_NAME+' password reset and new-password login passed');
              }else{
                await page.waitForFunction(()=>document.querySelector('#heading')?.textContent?.includes('Secure link verified'),null,{timeout:20000});
                assert.equal((await page.locator('#gymBrand').innerText()).trim(),process.env.EXPECTED_NAME);
                const href=await page.locator('#continueBtn').getAttribute('href');
                assert.ok(href && href.includes('admin.html?gym_id='+process.env.EXPECTED_GYM));
                await page.locator('#continueBtn').click();
                await page.waitForURL(new RegExp('admin\\.html\\?gym_id='+process.env.EXPECTED_GYM),{timeout:20000});
                console.log(process.env.EXPECTED_NAME+' magic-link sign-in passed');
              }
            }finally{
              await browser.close();
            }
          })().catch(err=>{console.error(err.message);process.exit(1)});
          JS
          }

          HUB_PASS="$(python3 -c 'import secrets; print("Hub1!"+secrets.token_urlsafe(24))')"
          PUFFIN_PASS="$(python3 -c 'import secrets; print("Puf1!"+secrets.token_urlsafe(24))')"
          echo "::add-mask::$HUB_PASS"
          echo "::add-mask::$PUFFIN_PASS"

          get_link hybridone-link-hub-recovery
          run_browser recovery 242f57c2-6e37-4977-b3c5-1c87de7d0b98 "Hybrid Hub" hybrid-hub "$HUB_PASS"

          get_link hybridone-link-puffin-recovery
          run_browser recovery aec16956-3793-4543-873b-4412646ca1eb "Puffin Performance" puffin-performance "$PUFFIN_PASS"

          get_link hybridone-link-hub-magic
          run_browser magic 242f57c2-6e37-4977-b3c5-1c87de7d0b98 "Hybrid Hub" hybrid-hub unused

          get_link hybridone-link-puffin-magic
          run_browser magic aec16956-3793-4543-873b-4412646ca1eb "Puffin Performance" puffin-performance unused

      - name: Send remaining live Auth email combinations
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          sleep 65
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data '{}' \
            https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-send-hub-magic \
            -o /tmp/hub-mail.json
          python3 -c "import json; d=json.load(open('/tmp/hub-mail.json')); assert d.get('ok') is True, d"
          echo "Hybrid Hub magic-link email request accepted"
          sleep 65
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data '{}' \
            https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-send-puffin-recovery \
            -o /tmp/puffin-mail.json
          python3 -c "import json; d=json.load(open('/tmp/puffin-mail.json')); assert d.get('ok') is True, d"
          echo "Puffin Performance recovery email request accepted"

      - name: Clean up disposable Auth account
        if: always()
        shell: bash
