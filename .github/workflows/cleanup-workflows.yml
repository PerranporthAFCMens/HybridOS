name: Clean up one-off workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-workflows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the Pages deployment workflow
        run: |
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name 'pages.yml' -delete
          echo 'Remaining workflows:'
          ls -la .github/workflows
      - name: Commit workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Remove obsolete one-off workflows"
          git push
