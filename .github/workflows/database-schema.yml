          snap /tmp/cb_after_migration.txt
          # the block benchmarks migration (20261016170000) points at blocks, so it comes off first and goes back on last
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/rollback/20261016_drop_block_benchmarks.sql
