          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          MIG=supabase/migrations/20261012140000_training_feedback_loop.sql
          # read-only verification query: every row must say ok
          psql "$DB_URL" -X -At -F ' | ' -f supabase/verification/20261012_training_feedback_loop_check.sql > /tmp/training_check.txt
          cat /tmp/training_check.txt
          if grep -v ' | ok$' /tmp/training_check.txt; then echo 'A training feedback loop verification check is not ok'; exit 1; fi
          # owner, admin, staff, coach, two clients and another gym's people, run as the authenticated role; rolls itself back
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/training_feedback_loop.sql
          # the rollback removes everything it added, and applying the migration again restores the same catalog
          snap() { psql "$DB_URL" -X -q -f supabase/tests/catalog_snapshot.sql > "$1"; }
          snap /tmp/tl_after_migration.txt
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/rollback/20261012_drop_training_feedback_loop.sql
          snap /tmp/tl_after_rollback.txt
          if diff -q /tmp/tl_after_migration.txt /tmp/tl_after_rollback.txt >/dev/null; then echo 'The migration changed nothing: snapshot is not sensitive enough'; exit 1; fi
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$MIG"
          # Dropping and recreating the replies table loses what a LATER migration did to it (it limits the service role to reading), so put that back too.
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/migrations/20261012160000_training_notify_service_access.sql
          # ...and the own-clients rule on the replies table (part 2 of the PT clients change).
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/migrations/20261016121000_pt_clients_replies.sql
          snap /tmp/tl_after_reapply.txt
          if diff -u /tmp/tl_after_migration.txt /tmp/tl_after_reapply.txt; then echo 'Rollback then re-apply gives the same catalog'; else echo 'Re-applying after rollback differs'; exit 1; fi
