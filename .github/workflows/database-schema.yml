name: HybridOne database schema rebuild
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migrations-legacy/**'
      - 'supabase/tests/**'
      - 'supabase/rollback/**'
      - 'supabase/verification/**'
      - 'SUPABASE_SCHEMA_RECONCILIATION.md'
      - '.github/workflows/database-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Initialise local Supabase only
        run: supabase init
      - name: Start fresh local Supabase
        run: supabase start
      - name: Rebuild empty local database from repo migrations
        run: supabase db reset --local
      - name: Verify reconstructed schema
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare v_tables integer; v_functions integer; v_policies integer; v_triggers integer; v_sequences integer;
          begin
            select count(*) into v_tables from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','private') and c.relkind in ('r','p');
            select count(*) into v_functions from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','private') and p.prokind='f';
            select count(*) into v_policies from pg_policies where schemaname in ('public','private','storage');
            select count(*) into v_triggers from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace tn on tn.oid=c.relnamespace join pg_proc p on p.oid=t.tgfoid join pg_namespace fn on fn.oid=p.pronamespace where not t.tgisinternal and (tn.nspname in ('public','private') or fn.nspname in ('public','private'));
            select count(*) into v_sequences from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','private') and c.relkind='S';
            raise notice 'schema counts: tables=%, functions=%, policies=%, triggers=%, sequences=%',v_tables,v_functions,v_policies,v_triggers,v_sequences;
            if v_tables<>94 then raise exception 'Expected 94 app tables, got %',v_tables; end if;
            if v_functions<>167 then raise exception 'Expected 167 committed app functions, got %',v_functions; end if;
            if v_policies<>226 then raise exception 'Expected 226 app/storage policies, got %',v_policies; end if;
            if v_triggers<>42 then raise exception 'Expected 42 app-related triggers, got %',v_triggers; end if;
            if v_sequences<>1 then raise exception 'Expected 1 app sequence, got %',v_sequences; end if;
            if exists(select 1 from public.gyms) then raise exception 'Baseline must not contain live gym rows'; end if;
            if exists(select 1 from public.profiles) then raise exception 'Baseline must not contain live profile rows'; end if;
          end $$;
          SQL
      - name: Member details and sign-up documents verification
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          # read-only verification queries: every row must say ok
          for f in supabase/verification/20261011_member_join_details_check.sql supabase/verification/20261011_signup_documents_check.sql; do
            psql "$DB_URL" -X -At -F ' | ' -f "$f" > /tmp/check.txt
            cat /tmp/check.txt
            if grep -v ' | ok$' /tmp/check.txt; then echo "A verification check is not ok in $f"; exit 1; fi
          done
      - name: Membership status verification query and persona tests
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          # read-only verification query: every check must be true
          psql "$DB_URL" -X -At -F ' | ' -f supabase/verification/20261005_membership_status_check.sql > /tmp/membership_status_check.txt
          cat /tmp/membership_status_check.txt
          if grep -E ' \| f$' /tmp/membership_status_check.txt; then echo 'A membership status verification check is false'; exit 1; fi
          # twelve personas x two gyms, run as the authenticated role with real JWT claims; rolls itself back
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/membership_status_personas.sql
          # member details: edit, the owner's visibility choice, and members reading nothing about each other; then a guard that a plain member can run only member functions
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/member_details_edit_and_privacy.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/member_cannot_use_admin_functions.sql
      - name: Membership rules verification, persona tests and rollback
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          MIG=supabase/migrations/20261010150000_membership_rules.sql
          # read-only verification query: every row must say ok
          psql "$DB_URL" -X -At -F ' | ' -f supabase/verification/20261010_membership_rules_check.sql > /tmp/membership_rules_check.txt
          cat /tmp/membership_rules_check.txt
          if grep -v ' | ok$' /tmp/membership_rules_check.txt; then echo 'A membership rules verification check is not ok'; exit 1; fi
          # personas (owner, admin, staff, members, another gym) run as the authenticated role; rolls itself back
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/membership_rules.sql
          # the rollback removes everything it added, and applying the migration again restores the same catalog
          snap() { psql "$DB_URL" -X -q -f supabase/tests/catalog_snapshot.sql > "$1"; }
          snap /tmp/rules_after_migration.txt
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/rollback/20261010_drop_membership_rules.sql
          snap /tmp/rules_after_rollback.txt
          if diff -q /tmp/rules_after_migration.txt /tmp/rules_after_rollback.txt >/dev/null; then echo 'The migration changed nothing: snapshot is not sensitive enough'; exit 1; fi
          if psql "$DB_URL" -X -At -c "select count(*) from information_schema.tables where table_schema='public' and table_name in ('membership_rules','membership_requests')" | grep -qv '^0$'; then echo 'Rollback left a table behind'; exit 1; fi
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$MIG"
          # The plan terms migration (part 2) replaces two of these functions, so put its versions back too.
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/migrations/20261015091000_plan_terms_functions.sql
          snap /tmp/rules_after_reapply.txt
          if diff -u /tmp/rules_after_migration.txt /tmp/rules_after_reapply.txt; then echo 'Rollback then re-apply gives the same catalog'; else echo 'Re-applying after rollback differs'; exit 1; fi
      - name: Community broadcasts verification, persona tests and rollback
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          MIG=supabase/migrations/20261012120000_community_broadcasts.sql
          # read-only verification query: every row must say ok
          psql "$DB_URL" -X -At -F ' | ' -f supabase/verification/20261012_community_broadcasts_check.sql > /tmp/broadcasts_check.txt
          cat /tmp/broadcasts_check.txt
          if grep -v ' | ok$' /tmp/broadcasts_check.txt; then echo 'A community broadcasts verification check is not ok'; exit 1; fi
          # owner, admin, staff, members and another gym's admin, run as the authenticated role; rolls itself back
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/community_broadcasts.sql
          # the rollback removes everything it added, and applying the migration again restores the same catalog
          snap() { psql "$DB_URL" -X -q -f supabase/tests/catalog_snapshot.sql > "$1"; }
          snap /tmp/bc_after_migration.txt
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/rollback/20261012_drop_community_broadcasts.sql
          snap /tmp/bc_after_rollback.txt
          if diff -q /tmp/bc_after_migration.txt /tmp/bc_after_rollback.txt >/dev/null; then echo 'The migration changed nothing: snapshot is not sensitive enough'; exit 1; fi
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$MIG"
          snap /tmp/bc_after_reapply.txt
          if diff -u /tmp/bc_after_migration.txt /tmp/bc_after_reapply.txt; then echo 'Rollback then re-apply gives the same catalog'; else echo 'Re-applying after rollback differs'; exit 1; fi
      - name: Training feedback loop verification, persona tests and rollback
