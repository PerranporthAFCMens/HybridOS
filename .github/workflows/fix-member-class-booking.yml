name: Fix member class booking
on:
  push:
    paths:
      - '.github/workflows/fix-member-class-booking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch real member booking and preview interactions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('member.html')
          s=p.read_text()
          pattern=r"async function loadClasses\(\)\{.*?\}\nfunction metricFields"
          replacement=r'''async function loadClasses(){
            const from=new Date(),to=new Date(Date.now()+14*86400000);
            const{data,error}=await supabase.rpc('get_class_calendar',{p_gym_id:gym.id,p_from:from.toISOString(),p_to:to.toISOString()});
            if(error){$('classList').innerHTML='<div class="empty">Could not load classes.</div>';return}
            const rows=(data||[]).filter(x=>!x.is_cancelled).slice(0,12);
            const renderRow=x=>{
              const booked=x.my_booking_status==='booked';
              const full=Number(x.spaces_left||0)<=0&&!booked;
              const label=booked?'Cancel booking':full?'Full':'Book class';
              return `<div class="row"><div class="rowtop"><div><h4>${esc(x.name)}</h4><div class="muted">${fmt(x.starts_at)} · ${x.booked_count}/${x.capacity} booked</div></div><button class="btn ${booked?'secondary':'primary'} class-book-btn" data-session-id="${x.id}" data-booked="${booked?'1':'0'}" ${full?'disabled':''}>${label}</button></div></div>`;
            };
            $('classList').innerHTML=rows.length?rows.map(renderRow).join(''):'<div class="empty">No upcoming classes.</div>';
            $('nextClasses').innerHTML=rows.length?rows.slice(0,3).map(x=>{const booked=x.my_booking_status==='booked';return `<div class="row"><div class="rowtop"><div><h4>${esc(x.name)}</h4><div class="muted">${fmt(x.starts_at)}</div></div><button class="btn ${booked?'secondary':'primary'} class-book-btn" data-session-id="${x.id}" data-booked="${booked?'1':'0'}">${booked?'Cancel':'Book'}</button></div></div>`}).join(''):'<div class="empty">No upcoming classes.</div>';
            $('upcomingCount').textContent=(data||[]).filter(x=>x.my_booking_status==='booked').length;
            document.querySelectorAll('.class-book-btn').forEach(btn=>btn.onclick=async()=>{
              const wasBooked=btn.dataset.booked==='1';
              const original=btn.textContent;
              btn.disabled=true;
              btn.textContent=wasBooked?'Cancelling…':'Booking…';
              const rpc=wasBooked?'cancel_class_booking':'book_class_session';
              const{error:bookError}=await supabase.rpc(rpc,{p_session_id:btn.dataset.sessionId});
              if(bookError){btn.disabled=false;btn.textContent=original;alert(bookError.message||'Could not update booking.');return}
              await loadClasses();
            });
          }
          function metricFields'''
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
            raise SystemExit(f'Expected to replace loadClasses once, replaced {n}')
          p.write_text(ns)

          pp=Path('member-preview.html')
          ps=pp.read_text()
          marker="function openPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}"
          inject=marker+"\nfunction wirePreviewClassBooking(){document.querySelectorAll('#classes .row').forEach(row=>{const tag=row.querySelector('.tag');if(!tag)return;const booked=tag.classList.contains('good')||/booked/i.test(tag.textContent);const b=document.createElement('button');b.className='btn '+(booked?'secondary':'primary');b.textContent=booked?'Cancel booking':'Book class';b.onclick=()=>{const nowBooked=b.textContent.startsWith('Book');b.disabled=true;b.textContent=nowBooked?'Booking…':'Cancelling…';setTimeout(()=>{b.disabled=false;b.className='btn '+(nowBooked?'secondary':'primary');b.textContent=nowBooked?'Cancel booking':'Book class';tag.className='tag '+(nowBooked?'good':'');tag.textContent=nowBooked?'Booked':'Space available';},350)};tag.parentNode.replaceChild(b,tag);});}"
          if marker not in ps:
            raise SystemExit('Preview openPage marker not found')
          ps=ps.replace(marker,inject,1)
          ps=ps.replace("document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));","document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));wirePreviewClassBooking();",1)
          pp.write_text(ps)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member.html member-preview.html
          git commit -m "Enable member class booking buttons" || exit 0
          git push
