name: Fix member preview hamburger
on:
  push:
    paths:
      - '.github/workflows/fix-member-preview-hamburger.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch member preview hamburger
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('member-preview.html')
          s=p.read_text()
          marker='<!-- hamburger-hotfix -->'
          if marker not in s:
              hotfix='''\n<!-- hamburger-hotfix -->\n<script>\n(function(){\n  function initMemberPreviewMenu(){\n    var openBtn=document.getElementById('mobileMenuBtn');\n    var closeBtn=document.getElementById('mobileMenuClose');\n    var backdrop=document.getElementById('mobileNavBackdrop');\n    var side=document.querySelector('.side');\n    if(!openBtn||!side) return;\n    function openMenu(e){\n      if(e){e.preventDefault();e.stopPropagation();}\n      document.body.classList.add('mobile-nav-open');\n      openBtn.setAttribute('aria-expanded','true');\n      side.setAttribute('aria-hidden','false');\n    }\n    function closeMenu(e){\n      if(e){e.preventDefault();}\n      document.body.classList.remove('mobile-nav-open');\n      openBtn.setAttribute('aria-expanded','false');\n      side.setAttribute('aria-hidden','true');\n    }\n    openBtn.onclick=openMenu;\n    if(closeBtn) closeBtn.onclick=closeMenu;\n    if(backdrop) backdrop.onclick=closeMenu;\n    document.querySelectorAll('.side .nav button,.side .nav a').forEach(function(el){\n      el.addEventListener('click',function(){ if(window.innerWidth<=900) closeMenu(); });\n    });\n    side.setAttribute('aria-hidden', window.innerWidth<=900 ? 'true' : 'false');\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initMemberPreviewMenu);\n  else initMemberPreviewMenu();\n})();\n</script>\n'''
              s=s.replace('</body>',hotfix+'</body>')
              p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member-preview.html
          git diff --cached --quiet || git commit -m "Fix member preview hamburger"
          git push
