name: Fix member preview link
on:
  push:
    paths:
      - '.github/workflows/fix-member-preview-link.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point admin preview to standalone preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("./member.html?preview=member","./member-preview.html")
          p.write_text(s)
          PY
      - name: Commit preview link
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Point member preview to standalone preview"
          git push
