name: Home class detail and booking
on:
  push:
    paths:
      - '.github/workflows/home-class-detail.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch member home class cards
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch_member(path, preview=False):
              p=Path(path); s=p.read_text()
              if 'id="homeClassModal"' not in s:
                  modal='''\n<div id="homeClassModal" class="modal hidden"><div class="modal-card"><div class="section-title"><div><div class="eyebrow">Class details</div><h3 id="homeClassTitle" style="margin:4px 0"></h3></div><button id="homeClassClose" class="btn secondary">Close</button></div><div id="homeClassTime" class="muted"></div><p id="homeClassDesc" style="line-height:1.5"></p><div id="homeClassAvailability" class="muted" style="margin-top:8px"></div><div class="actions"><button id="homeClassBook" class="btn primary">Book class</button></div><div id="homeClassMsg" class="msg"></div></div></div>\n'''
                  marker='<div id="workoutModal"'
                  if marker in s:
                      s=s.replace(marker,modal+marker,1)
                  else:
                      s=s.replace('</body>',modal+'</body>',1)
              if not preview and 'window.hybridClassRows=rows' not in s:
                  s=s.replace("const rows=(data||[]).filter(x=>!x.is_cancelled).slice(0,12);","const rows=(data||[]).filter(x=>!x.is_cancelled).slice(0,12);window.hybridClassRows=rows;",1)
              if 'function wireHomeClassCards()' not in s:
                  if preview:
                      js='''\nfunction wireHomeClassCards(){const desc={"Early Engine":"A coached conditioning session focused on aerobic capacity, pacing and building your engine.","Hybrid Strength":"A full-body strength session combining compound lifts, accessories and progressive overload.","Evening Engine":"An evening conditioning session mixing cardio intervals and functional work."};document.querySelectorAll('#home #nextClasses .row,#home .wide .list .row').forEach(r=>{r.style.cursor='pointer';r.onclick=e=>{if(e.target.closest('button'))return;const name=r.querySelector('h4')?.textContent?.trim();if(!name)return;document.getElementById('homeClassTitle').textContent=name;document.getElementById('homeClassTime').textContent=r.querySelector('.muted')?.textContent||'';document.getElementById('homeClassDesc').textContent=desc[name]||'Class details and coaching information will appear here.';const tag=r.querySelector('.tag');const booked=tag&&/booked/i.test(tag.textContent);document.getElementById('homeClassAvailability').textContent=tag?.textContent||'';const b=document.getElementById('homeClassBook');b.textContent=booked?'Cancel booking':'Book class';b.dataset.booked=booked?'1':'0';b.onclick=()=>{b.disabled=true;b.textContent=booked?'Cancelling…':'Booking…';setTimeout(()=>{b.disabled=false;b.textContent=booked?'Book class':'Cancel booking';document.getElementById('homeClassMsg').textContent=booked?'Booking cancelled.':'Class booked.';},300)};document.getElementById('homeClassModal').classList.remove('hidden')}})}document.getElementById('homeClassClose').onclick=()=>document.getElementById('homeClassModal').classList.add('hidden')}\nwireHomeClassCards();\n'''
                  else:
                      js='''\nfunction wireHomeClassCards(){const host=$('nextClasses');if(!host)return;host.querySelectorAll('.row').forEach(r=>{r.style.cursor='pointer';r.onclick=e=>{if(e.target.closest('button'))return;const name=r.querySelector('h4')?.textContent?.trim();const x=(window.hybridClassRows||[]).find(v=>v.name===name);if(!x)return;$('homeClassTitle').textContent=x.name;$('homeClassTime').textContent=fmt(x.starts_at);$('homeClassDesc').textContent=x.description||'No description has been added for this class yet.';$('homeClassAvailability').textContent=x.my_booking_status==='booked'?'Booked':(x.availability_note||`${x.spaces_left} spaces left`);const b=$('homeClassBook');const booked=x.my_booking_status==='booked';b.disabled=false;b.textContent=booked?'Cancel booking':'Book class';b.onclick=async()=>{b.disabled=true;b.textContent=booked?'Cancelling…':'Booking…';const rpc=booked?'cancel_class_booking':'book_class_session';const{error}=await supabase.rpc(rpc,{p_session_id:x.session_id});if(error){$('homeClassMsg').textContent=error.message||'Could not update booking.';b.disabled=false;return}$('homeClassModal').classList.add('hidden');await loadClasses()};$('homeClassMsg').textContent='';$('homeClassModal').classList.remove('hidden')}})}$('homeClassClose').onclick=()=>$('homeClassModal').classList.add('hidden')}\n'''
                      s=s.replace("$('upcomingCount').textContent=(data||[]).filter(x=>x.my_booking_status==='booked').length;","$('upcomingCount').textContent=(data||[]).filter(x=>x.my_booking_status==='booked').length;wireHomeClassCards();",1)
                      js='\n'+js
                  s=s.replace('</script>',js+'</script>',1)
              p.write_text(s)

          patch_member('member.html',False)
          patch_member('member-preview.html',True)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member.html member-preview.html
          git commit -m "Enable class detail and booking from home cards" || exit 0
          git push
