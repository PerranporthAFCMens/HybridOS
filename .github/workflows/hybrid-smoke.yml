name: HybridOne smoke checks

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build isolated site
        run: python3 scripts/build_site.py

      - name: Smoke test built site
        run: python3 scripts/smoke_test.py _site

      - name: Smoke test Auth email hook
        run: python3 scripts/email_hook_smoke.py
