name: Manual Strava export
on:
  push:
    paths:
      - '.github/workflows/manual-strava-export.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manual Strava export UX
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('member.html')
          s=p.read_text()
          old="""return `<div class=\"row\"><div class=\"rowtop\"><div><h4>${esc(w.title||'Workout')}</h4><div class=\"muted\">${fmt(w.performed_at)} · ${ec} exercise${ec===1?'':'s'} · ${sc} sets</div></div><button class=\"btn danger\" data-del-workout=\"${w.id}\">Delete</button></div></div>`"""
          new="""return `<div class=\"row\"><div class=\"rowtop\"><div><h4>${esc(w.title||'Workout')}</h4><div class=\"muted\">${fmt(w.performed_at)} · ${ec} exercise${ec===1?'':'s'} · ${sc} sets</div></div><div class=\"actions\" style=\"margin-top:0\"><button class=\"btn secondary\" data-strava-workout=\"${w.id}\">Add to Strava</button><button class=\"btn danger\" data-del-workout=\"${w.id}\">Delete</button></div></div></div>`"""
          if old not in s:
              raise SystemExit('member workout row pattern not found')
          s=s.replace(old,new,1)

          old2="""document.querySelectorAll('[data-del-workout]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this workout?'))return;await supabase.from('workout_sessions').delete().eq('id',b.dataset.delWorkout);loadWorkouts()})}"""
          new2="""document.querySelectorAll('[data-strava-workout]').forEach(b=>b.onclick=async()=>{const original=b.textContent;b.disabled=true;b.textContent='Adding…';try{const {data,error}=await supabase.functions.invoke('strava-push',{body:{workout_session_id:b.dataset.stravaWorkout}});if(error)throw error;if(data?.configured===false){alert(data.message||'Connect Strava first.');return}if(data?.ready){b.textContent='Ready for Strava';alert('Manual Strava export is ready. Once live Strava credentials are added, this button will create the activity in Strava.');return}alert('Workout sent to Strava.')}catch(err){alert(err.message||'Could not add this workout to Strava.')}finally{b.disabled=false;if(b.textContent==='Adding…')b.textContent=original}});document.querySelectorAll('[data-del-workout]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this workout?'))return;await supabase.from('workout_sessions').delete().eq('id',b.dataset.delWorkout);loadWorkouts()})}"""
          if old2 not in s:
              raise SystemExit('member workout handler pattern not found')
          s=s.replace(old2,new2,1)

          s=s.replace('Connect Strava so runs, rides and other activities can appear in your workout history automatically.','Connect Strava so activities can import into Hybrid OS automatically. Sending a Hybrid OS workout to Strava is always manual — tap Add to Strava on the workout you want to share.',1)
          p.write_text(s)

          p=Path('integrations.html')
          s=p.read_text()
          s=s.replace('Connect training services so activities can flow into your workout history automatically.','Connect training services to bring activities into Hybrid OS. Hybrid OS never auto-posts workouts to Strava — you choose Add to Strava on an individual workout.',1)
          s=s.replace('Import runs, rides and other activities into Workouts and use them for progress/PB tracking.','Import runs, rides and other activities into Workouts for progress/PB tracking. Exporting the other way is manual only.',1)
          insert='<div class="card"><div class="eyebrow">How Strava sync works</div><h3 style="margin:4px 0 8px">You stay in control</h3><div class="muted">Strava activities can flow into Hybrid OS after connection. Hybrid OS workouts are never pushed back automatically. To share one, open Workouts and tap <b>Add to Strava</b> on that specific workout.</div></div>\n'
          marker='<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center">'
          if insert not in s and marker in s:
              s=s.replace(marker,insert+marker,1)
          p.write_text(s)

          p=Path('HANDOVER.md')
          s=p.read_text()
          note='''\n### Strava outbound-sync decision\n\nStrava import can be automatic/webhook-driven once connected. **Hybrid OS must never automatically push workouts to Strava.** Outbound sync is explicitly member-triggered on an individual workout using an **Add to Strava** button. The authenticated `strava-push` Edge Function is scaffolded for this manual-only path.\n'''
          if '### Strava outbound-sync decision' not in s:
              s += note
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member.html integrations.html HANDOVER.md
          git commit -m "Make Strava export manual only" || exit 0
          git push
