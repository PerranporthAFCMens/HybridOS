name: Deploy Hybrid OS prototype

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject shared member mobile rail stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('member.html', 'member-preview.html'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              href = '<link rel="stylesheet" href="./member-mobile-rail.css">'
              if href not in s:
                  s = s.replace('</head>', href + '</head>', 1)
                  p.write_text(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
