name: HybridOne dev preview

on:
  workflow_run:
    workflows: ["HybridOne smoke checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group per branch. This workflow also starts (and is then skipped by the job's `if`) every time the smoke checks finish on a pull request;
# in one shared group those skipped runs cancelled the real dev deploy that was in progress, so the dev gates timed out waiting for a revision that never published.
concurrency:
  group: pages-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'dev' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Record checked-out dev SHA
        shell: bash
        run: echo "HYBRID_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build isolated site
        run: python3 scripts/build_site.py

      - name: Smoke test built site
        run: python3 scripts/smoke_test.py _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy dev preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public dev runtime
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/runtime_pages_check.py
