name: HybridOne resend button probe

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/resend-button-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Create fresh invite and verify Resend email in dev
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-resend-button-probe" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          curl --fail-with-body -sS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             --data '{}'             https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-resend-button-probe             -o /tmp/probe.json

          python3 -c "import json; d=json.load(open('/tmp/probe.json')); assert d.get('ok') is True, d; print('Fresh Hybrid Hub email invite created and sent')"
          OWNER_MAGIC_URL="$(python3 -c 'import json; print(json.load(open("/tmp/probe.json"))["owner_magic_url"])')"
          INVITE_ID="$(python3 -c 'import json; print(json.load(open("/tmp/probe.json"))["invite_id"])')"
          echo "::add-mask::$OWNER_MAGIC_URL"
          export OWNER_MAGIC_URL INVITE_ID

          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            try{
              await page.goto(process.env.OWNER_MAGIC_URL,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>document.querySelector('#heading')?.textContent?.includes('Secure link verified'),null,{timeout:20000});

              await page.goto(
                'https://perranporthafcmens.github.io/HybridOS/admin-access.html?gym_id=242f57c2-6e37-4977-b3c5-1c87de7d0b98',
                {waitUntil:'domcontentloaded',timeout:30000}
              );
              await page.waitForFunction(()=>window.__hybridAppReady===true,null,{timeout:20000});

              const row=page.locator('.invite').filter({hasText:'a.j.turner+hybridtest1@hotmail.com'}).first();
              await row.waitFor({state:'visible',timeout:20000});
              const resend=row.locator('button[data-send-email]');
              await resend.waitFor({state:'visible',timeout:10000});
              assert.equal((await resend.innerText()).trim(),'Resend email');

              await resend.click();
              await page.locator('#hybridInviteToast').waitFor({state:'visible',timeout:20000});
              const toast=(await page.locator('#hybridInviteToast').innerText()).replace(/\s+/g,' ').trim();
              assert.match(toast,/Invite sent/i);
              assert.match(toast,/Invitation email sent/i);

              console.log('Resend email button visible and resend action succeeded');
            } finally {
              await browser.close();
            }
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
