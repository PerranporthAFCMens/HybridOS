name: Simplify Hybrid OS brand
on:
  push:
    paths:
      - '.github/workflows/simplify-brand.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace sled logo with abstract mark
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          brand = '''<div class="logo brand-logo"><svg class="brand-mark" viewBox="0 0 54 48" aria-hidden="true"><path d="M6 42 L27 6 M12 42 L30 11 M18 42 L33 16 M48 42 L27 6 M42 42 L24 11 M36 42 L21 16"/></svg><span class="brand-word">HYBRID <b>OS</b></span></div>'''
          css = '''\n.brand-logo{display:flex;align-items:center;gap:10px;width:max-content}.brand-mark{width:38px;height:34px;display:block;overflow:visible}.brand-mark path{fill:none;stroke:#fff;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.brand-word{color:#fff;font-size:18px;font-weight:800;letter-spacing:.08em;white-space:nowrap}.brand-word b{font-weight:900}.auth-panel .brand-word{color:#101828}.auth-panel .brand-mark path{stroke:#101828}\n'''

          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              old=s
              s=re.sub(r'<div class="logo"><img\s+src="\./Hybrid_OS_Sled_Logo\.svg"\s+alt="Hybrid OS"[^>]*></div>', brand, s)
              if s != old and '.brand-mark path{' not in s:
                  s=s.replace('</style>', css+'\n</style>', 1)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print('Changed:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit brand update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Simplify Hybrid OS branding"
            git push
          fi
