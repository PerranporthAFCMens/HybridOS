name: HybridOne UI audit

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ui-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Record dev SHA
        run: echo "HYBRID_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Wait for public Pages
        env:
          PAGES_URL: https://perranporthafcmens.github.io/HybridOS/
        run: python3 scripts/runtime_pages_check.py
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create disposable audit account
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(python3 -c 'import secrets; print("Ui!"+secrets.token_urlsafe(24))')"
          echo "::add-mask::$PASS"
          echo "UI_AUDIT_PASS=$PASS" >> "$GITHUB_ENV"
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-ui-audit" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          BODY="$(PASS="$PASS" python3 -c 'import json,os; print(json.dumps({"action":"setup","password":os.environ["PASS"]}))')"
          curl --fail-with-body -sS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data "$BODY" https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-ui-audit-harness -o /tmp/ui-setup.json
          python3 -c "import json; d=json.load(open('/tmp/ui-setup.json')); assert d.get('ok') is True, d"
      - name: Capture surfaces
        env:
          BASE_URL: https://perranporthafcmens.github.io/HybridOS/
          AUDIT_EMAIL: delivered@resend.dev
          HUB_GYM_ID: 242f57c2-6e37-4977-b3c5-1c87de7d0b98
        run: |
          mkdir -p ui-audit
          node scripts/ui_audit.js
      - name: Upload UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybridone-ui-audit
          path: ui-audit/
          if-no-files-found: error
          retention-days: 3
      - name: Clean up disposable audit account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-ui-audit" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
