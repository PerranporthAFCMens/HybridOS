name: HybridOne visual UX audit

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/visual-ux-audit.yml'

permissions:
  contents: read
  id-token: write

# Reuse the Auth fixture serialization because both workflows use the same
# disposable delivered@resend.dev account.
concurrency:
  group: hybridone-auth-journey
  cancel-in-progress: false

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Record exact dev SHA
        shell: bash
        run: echo "HYBRID_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for exact public Pages revision
        env:
          PAGES_URL: https://perranporthafcmens.github.io/HybridOS/
        run: python3 scripts/runtime_pages_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Create disposable two-gym audit account
        shell: bash
        run: |
          set -euo pipefail
          INITIAL_PASS="$(python3 -c 'import secrets; print("H1!"+secrets.token_urlsafe(24))')"
          echo "::add-mask::$INITIAL_PASS"
          echo "AUDIT_PASSWORD=$INITIAL_PASS" >> "$GITHUB_ENV"
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          BODY="$(INITIAL_PASS="$INITIAL_PASS" python3 -c 'import json,os; print(json.dumps({"password":os.environ["INITIAL_PASS"]}))')"
          curl --fail-with-body -sS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             --data "$BODY"             https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-auth-journey-setup             -o /tmp/setup.json
          python3 -c "import json; d=json.load(open('/tmp/setup.json')); assert d.get('ok') is True, d; print('Disposable visual-audit account created')"

      - name: Capture desktop and mobile product surfaces
        env:
          DEV_BASE: https://perranporthafcmens.github.io/HybridOS/
          TEST_EMAIL: delivered@resend.dev
          HUB_GYM_ID: 242f57c2-6e37-4977-b3c5-1c87de7d0b98
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const base=process.env.DEV_BASE;
          const email=process.env.TEST_EMAIL;
          const password=process.env.AUDIT_PASSWORD;
          const hub=process.env.HUB_GYM_ID;
          const out='visual-audit';
          const errors=[];
          const manifest=[];

          const adminViews=[
            'index.html',
            'community.html',
            'classes.html',
            'class-setup.html',
            'workout-builder.html',
            'admin-access.html',
            'admin-operations.html',
            'resource-availability.html',
            'gym-layout.html',
            'staff-permissions.html',
            'access-settings.html',
            'reporting.html',
            'member-view-settings.html',
            'member-memberships.html',
            'communications.html'
          ];

          function safeName(v){return v.replace(/[^a-z0-9_-]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}

          async function settle(page, extra=700){
            await page.waitForLoadState('domcontentloaded').catch(()=>{});
            await page.waitForTimeout(extra);
          }

          async function snap(page, viewportName, surface, opts={}){
            try{
              await settle(page,opts.wait||700);
              const name=viewportName+'__'+safeName(surface)+'.png';
              await page.screenshot({path:path.join(out,name),fullPage:opts.fullPage!==false});
              manifest.push({viewport:viewportName,surface,file:name,url:page.url()});
              console.log('captured',name,page.url());
            }catch(err){
              errors.push({viewport:viewportName,surface,url:page.url(),error:String(err?.message||err)});
              console.warn('capture failed',viewportName,surface,err?.message||err);
            }
          }

          async function capturePublic(page, viewportName){
            for(const [surface,href] of [
              ['public-landing','landing.html'],
              ['public-login','login.html'],
              ['public-hybrid-hub-login','hybrid-hub-login.html'],
              ['public-puffin-login','puffin-performance-login.html'],
              ['public-join-hybrid-hub','join.html?gym_id='+hub]
            ]){
              await page.goto(base+href,{waitUntil:'domcontentloaded',timeout:30000});
              await snap(page,viewportName,surface);
            }
          }

          async function loginToHub(page, viewportName){
            await page.goto(base+'login.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#email').fill(email);
            await page.locator('#password').fill(password);
            await page.locator('#signIn').click();
            await page.waitForURL(url=>url.pathname.endsWith('/choose-gym.html'),{timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('.gym-card').length>=2,null,{timeout:20000});
            await snap(page,viewportName,'auth-choose-gym');
            await page.locator('[data-gym="'+hub+'"]').click();
            await page.waitForURL(url=>{
              const leaf=url.pathname.split('/').pop();
              return (leaf==='admin.html'||leaf==='index.html')&&url.searchParams.get('gym_id')===hub;
            },{timeout:20000});
            await settle(page,1200);
          }

          async function captureAdmin(page, viewportName){
            for(const view of adminViews){
              const u=base+'admin.html?gym_id='+hub+'&view='+encodeURIComponent(view);
              await page.goto(u,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>{
                const f=document.querySelector('.admin-content-frame.active');
                return !!f;
              },null,{timeout:15000}).catch(()=>{});
              await snap(page,viewportName,'admin-'+view.replace('.html',''),{wait:1200});
            }
            if(viewportName==='mobile'){
              await page.goto(base+'admin.html?gym_id='+hub+'&view=index.html',{waitUntil:'domcontentloaded',timeout:30000});
              await settle(page,1000);
              const menu=page.locator('.admin-frame-mobile');
              if(await menu.count()){
                await menu.click();
                await page.waitForTimeout(250);
                await snap(page,viewportName,'admin-mobile-drawer',{fullPage:false});
              }
            }
          }

          async function captureStaff(page, viewportName){
            await page.goto(base+'staff.html?view=staff&gym_id='+hub,{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#app:not(.hidden)').waitFor({state:'visible',timeout:20000}).catch(()=>{});
            await snap(page,viewportName,'staff-home',{wait:1200});
            if(viewportName==='mobile'){
              const btn=page.locator('#mobileMenuBtn,.staff-mobile-menu-btn').first();
              if(await btn.count()){
                await btn.click();
                await page.waitForTimeout(250);
                await snap(page,viewportName,'staff-mobile-drawer',{fullPage:false});
              }
            }
          }

          async function captureMember(page, viewportName){
            await page.goto(base+'member.html?view=member&gym_id='+hub,{waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#app:not(.hidden)').waitFor({state:'visible',timeout:20000}).catch(()=>{});
            await snap(page,viewportName,'member-home',{wait:1400});
            for(const key of ['classes','workouts','pbs','membership','profile']){
              const target=page.locator('[data-page="'+key+'"]').first();
              if(await target.count()){
                await target.click();
                await page.waitForTimeout(450);
                await snap(page,viewportName,'member-'+key,{wait:250});
              }
            }
            if(viewportName==='mobile'){
              const btn=page.locator('#mobileMenuBtn').first();
              if(await btn.count()){
                await btn.click();
                await page.waitForTimeout(250);
                await snap(page,viewportName,'member-mobile-drawer',{fullPage:false});
              }
            }
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const spec of [
                {name:'desktop',viewport:{width:1440,height:1000}},
                {name:'mobile',viewport:{width:390,height:844},isMobile:true,hasTouch:true}
              ]){
                const context=await browser.newContext({
                  viewport:spec.viewport,
                  isMobile:!!spec.isMobile,
                  hasTouch:!!spec.hasTouch
                });
                const page=await context.newPage();
                await capturePublic(page,spec.name);
                await loginToHub(page,spec.name);
                await captureAdmin(page,spec.name);
                await captureStaff(page,spec.name);
                await captureMember(page,spec.name);
                await context.close();
              }
            }finally{
              await browser.close();
              fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify({build_sha:process.env.HYBRID_BUILD_SHA,captures:manifest,errors},null,2));
              fs.writeFileSync(path.join(out,'README.txt'),
                'HybridOne visual UX audit\nBuild: '+process.env.HYBRID_BUILD_SHA+'\nCaptures: '+manifest.length+'\nErrors: '+errors.length+'\n');
            }
          })().catch(err=>{
            errors.push({fatal:true,error:String(err?.stack||err)});
            fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify({build_sha:process.env.HYBRID_BUILD_SHA,captures:manifest,errors},null,2));
            console.error(err);
            process.exit(1);
          });
          JS

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybridone-visual-audit-${{ github.sha }}
          path: visual-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Clean up disposable audit account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hybridone-auth-journey" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          curl --fail-with-body -sS             -H "Authorization: Bearer $OIDC"             -H "Content-Type: application/json"             --data '{}'             https://mzgnhmeydhhpzgxlgudh.supabase.co/functions/v1/hybridone-auth-journey-cleanup             -o /tmp/cleanup.json
          python3 -c "import json; d=json.load(open('/tmp/cleanup.json')); assert d.get('ok') is True and d.get('cleaned') is True, d; print('Disposable visual-audit account removed')"
