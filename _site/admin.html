<!doctype html>
<html lang="en">
<head><script src="./supabase-request-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>HybridOne Admin</title>

<link rel="stylesheet" href="./admin-frame.css?v=4bd681f03ea3">
<link rel="stylesheet" href="./app-consistency.css?v=4bd681f03ea3"></head>
<body>
<div id="adminFrameApp" class="admin-frame-shell">
  <aside class="side">
    <div class="brand">HybridOne</div>
    <div class="gym"><small>Current gym</small><div id="adminFrameGym">Loading…</div></div>
    <nav id="adminFrameNav" class="nav"></nav>
    <div class="admin-frame-account userchip" aria-label="Account menu" style="width:100%;margin-top:auto;box-sizing:border-box">
      <div class="avatar" id="userAvatar">H</div>
      <div class="who" style="min-width:0"><b id="userName">Account</b><div class="muted" id="userEmail" style="font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div></div>
    </div>
  </aside>
  <main class="admin-frame-main" aria-busy="true">
    <div id="adminFrameLoading" class="admin-frame-loading" aria-live="polite">
      <span class="admin-frame-loading-spinner" aria-hidden="true"></span>
      <div><b>Loading workspace</b><small>Preparing this page…</small></div>
    </div>
    <iframe id="adminContentFrameA" class="admin-content-frame active" title="HybridOne admin content"></iframe>
    <iframe id="adminContentFrameB" class="admin-content-frame" title="HybridOne admin content"></iframe>
  </main>
</div>
<script src="./gym-context.js?v=4bd681f03ea3"></script>
<script src="./shared-shell.js?v=4bd681f03ea3"></script>
<script src="./account-menu.js?v=4bd681f03ea3" defer></script>
<script type="module" src="./admin-frame.js?v=4bd681f03ea3"></script>
<script src="./gym-switcher.js?v=4bd681f03ea3" defer></script></body>
</html>
