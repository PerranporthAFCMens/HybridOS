<!doctype html>
<html lang="en">
<head><script src="./supabase-request-guard.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account access · HybridOne</title>
<style>
:root{--ink:var(--hybrid-ink);--muted:var(--hybrid-muted);--line:var(--hybrid-line);--dark:var(--hybrid-dark);--good:var(--hybrid-volt);--bad:var(--hybrid-ember)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--hybrid-bg);color:var(--ink);font-family:var(--hybrid-font)}.wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand{background:var(--dark);color:#fff;padding:8vw;display:flex;flex-direction:column;justify-content:center}.brand small{font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--hybrid-muted);font-family:var(--hybrid-mono)}.brand h1{font-size:clamp(42px,6vw,74px);line-height:1;margin:12px 0}.brand p{color:var(--hybrid-muted);font-size:18px;line-height:1.5;max-width:540px}.panel{padding:8vw 6vw;display:flex;align-items:center;background:var(--hybrid-panel)}.box{width:100%;max-width:440px;margin:auto}.eyebrow{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--hybrid-muted);font-family:var(--hybrid-mono)}.box h2{font-size:36px;margin:8px 0}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font:inherit}button,a.btn{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--hybrid-volt);color:var(--hybrid-dark);font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}button.secondary,a.btn.secondary{background:var(--hybrid-panel);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.55}.msg{margin-top:14px;font-size:14px}.bad{color:var(--bad)}.good{color:var(--good)}.hidden{display:none!important}@media(max-width:760px){.wrap{display:block}.brand{min-height:220px;padding:42px 28px}.brand h1{font-size:42px}.panel{padding:36px 24px}}
</style><meta name="theme-color" content="#0B1020"><link rel="icon" href="./assets/brand/icons/favicon.ico" sizes="any"><link rel="icon" href="./assets/brand/icons/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/brand/icons/apple-touch-icon.png"><link rel="manifest" href="./assets/brand/icons/site.webmanifest"><link rel="preload" href="./assets/brand/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="./assets/brand/brand.css?v=a2dbf599d51d"></head>
<body><div class="wrap"><section class="brand"><small>Powered by HybridOne</small><h1 id="gymBrand">Your gym</h1><p>Secure account access for your gym.</p></section><section class="panel"><div class="box"><div class="eyebrow" id="eyebrow">Secure account access</div><h2 id="heading">Checking your link…</h2><div class="muted" id="intro">Please keep this page open while we verify your secure link.</div><div id="passwordBox" class="hidden"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"><button id="savePassword">Save new password</button></div><a id="continueBtn" class="btn hidden" href="./">Continue</a><a id="loginBtn" class="btn secondary hidden" href="./">Back to sign in</a><div id="msg" class="msg"></div></div></section></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import'./gym-context.js';
const supabase=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');
const ctx=window.HybridGymContext,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),gymId=params.get('gym_id')||'',mode=params.get('mode')||'return';
const KNOWN={'242f57c2-6e37-4977-b3c5-1c87de7d0b98':'Hybrid Hub','aec16956-3793-4543-873b-4412646ca1eb':'Puffin Performance'},gymName=KNOWN[gymId]||'HybridOne';
$('gymBrand').textContent=gymName;$('loginBtn').href=ctx.loginUrl({gymId});
async function destinationFor(session){
 if(!session)return ctx.loginUrl({gymId});
 const{data,error}=await supabase.from('gym_members').select('gym_id,role,access_status').eq('user_id',session.user.id).eq('is_active',true).eq('access_status','active').order('created_at');
 if(error||!data?.length)return ctx.loginUrl({gymId});
 if(gymId){const selected=data.find(x=>x.gym_id===gymId);if(selected){ctx.setGym(selected.gym_id);return ctx.destination(selected)}}
 if(data.length===1){ctx.setGym(data[0].gym_id);return ctx.destination(data[0])}
 ctx.clearGym();return ctx.chooserUrl();
}
function showMessage(text,kind=''){$('msg').textContent=text;$('msg').className='msg '+kind}
function showRecovery(){document.title='Reset password · '+gymName;$('eyebrow').textContent=gymName;$('heading').textContent='Choose a new password';$('intro').textContent='Set a new password for your HybridOne account.';$('passwordBox').classList.remove('hidden');$('loginBtn').classList.remove('hidden')}
function showReturn(){document.title='Signed in · '+gymName;$('eyebrow').textContent=gymName;$('heading').textContent='Secure link verified';$('intro').textContent='Your secure sign-in link has been verified.';$('continueBtn').classList.remove('hidden');$('loginBtn').classList.remove('hidden')}
const{data:{session}}=await supabase.auth.getSession();if(session)$('continueBtn').href=await destinationFor(session);
if(mode==='recovery'){if(session)showRecovery();else{$('heading').textContent='This reset link is not active';$('intro').textContent='Open the latest password reset email or request another link.';$('loginBtn').classList.remove('hidden')}}else if(session)showReturn();else{$('heading').textContent='This secure link is not active';$('intro').textContent='Open the latest HybridOne email or return to sign in.';$('loginBtn').classList.remove('hidden')}
$('savePassword').onclick=async()=>{const password=$('password').value,confirm=$('confirmPassword').value;if(password.length<8){showMessage('Use at least 8 characters.','bad');return}if(password!==confirm){showMessage('Passwords do not match.','bad');return}const btn=$('savePassword');btn.disabled=true;showMessage('');try{const{error}=await supabase.auth.updateUser({password});if(error)throw error;$('passwordBox').classList.add('hidden');$('heading').textContent='Password updated';$('intro').textContent='Your new password is ready to use.';$('continueBtn').href=await destinationFor((await supabase.auth.getSession()).data.session);$('continueBtn').classList.remove('hidden');$('loginBtn').classList.add('hidden');showMessage('Password saved.','good')}catch(e){showMessage(e.message||'Could not update your password.','bad')}finally{btn.disabled=false}};
</script></body></html>
