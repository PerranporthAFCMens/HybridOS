<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a gym · HybridOne</title>
<style>
:root{--ink:var(--hybrid-ink);--muted:var(--hybrid-muted);--line:var(--hybrid-line);--dark:var(--hybrid-dark)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--hybrid-bg);color:var(--ink);font-family:var(--hybrid-font)}
.page{min-height:100vh;padding:56px 22px}.shell{width:min(760px,100%);margin:auto}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;letter-spacing:.04em;margin-bottom:42px}.brand svg{width:34px;height:31px;fill:none;stroke:var(--hybrid-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.eyebrow{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--hybrid-muted);font-family:var(--hybrid-mono)}.head h1{font-size:38px;margin:7px 0 8px;letter-spacing:-.03em}.muted{color:var(--muted);line-height:1.5}.gyms{display:grid;gap:12px;margin-top:26px}.gym-card{width:100%;display:flex;align-items:center;gap:15px;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--hybrid-panel);padding:18px;cursor:pointer;box-shadow:none;transition:.15s}.gym-card:hover{border-color:var(--hybrid-line-strong);transform:translateY(-1px);box-shadow:none}.gym-logo{width:54px;height:54px;flex:0 0 54px;border-radius:10px;background:#0b1020;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:600;overflow:hidden}.gym-logo img{width:100%;height:100%;object-fit:contain;padding:6px;background:var(--hybrid-panel)}.gym-copy{min-width:0;flex:1}.gym-copy b{display:block;font-size:17px}.gym-meta{margin-top:4px;color:var(--muted);font-size:13px}.arrow{font-size:22px;color:var(--hybrid-muted)}.tag{display:inline-flex;margin-left:7px;padding:3px 7px;border-radius:999px;background:var(--hybrid-bg);color:var(--hybrid-pulse);font-size:10px;font-weight:600;vertical-align:2px}.actions{display:flex;gap:9px;margin-top:24px;flex-wrap:wrap}.secondary{border:1px solid var(--line);border-radius:10px;background:var(--hybrid-panel);color:var(--hybrid-text);padding:11px 13px;font:inherit;font-weight:600;cursor:pointer}.msg{margin-top:20px;color:var(--hybrid-ember)}
@media(max-width:600px){.page{padding:32px 16px}.brand{margin-bottom:34px}.head h1{font-size:32px}.gym-card{padding:15px}.gym-logo{width:48px;height:48px;flex-basis:48px}}
</style><meta name="theme-color" content="#0B1020"><link rel="icon" href="./assets/brand/icons/favicon.ico" sizes="any"><link rel="icon" href="./assets/brand/icons/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/brand/icons/apple-touch-icon.png"><link rel="manifest" href="./assets/brand/icons/site.webmanifest"><link rel="preload" href="./assets/brand/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="./assets/brand/brand.css?v=a2dbf599d51d"></head>
<body><main class="page"><div class="shell">
<div class="brand"><img class="hybrid-logo-img" src="./assets/brand/logo/svg/hybridone-logo-on-dark.svg" alt="HybridOne" height="34"></div>
<div class="head"><div class="eyebrow">Your account</div><h1>Choose a gym</h1><div id="intro" class="muted">Your account has access to more than one gym. Choose where you want to go.</div></div>
<div id="gyms" class="gyms"></div><div id="msg" class="msg"></div><div class="actions"><button id="signOut" class="secondary" type="button">Sign out</button></div>
</div></main>
<script src="./gym-context.js"></script>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');
const ctx=window.HybridGymContext,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),switching=params.get('switch')==='1',returnTo=params.get('return_to')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function roleLabel(role){return role==='owner'?'Owner':role==='admin'?'Admin':role==='coach'?'Coach':role==='staff'?'Staff':'Member'}
function initials(name){return String(name||'Gym').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function destination(m){ctx.setGym(m.gym_id);if(!switching&&returnTo){const safe=ctx.safeReturn(returnTo,m.gym_id);if(safe)return safe}return ctx.destination(m)}
async function load(){
 const{data:{session}}=await supabase.auth.getSession();if(!session){location.replace(ctx.loginUrl({returnTo}));return}
 const{data,error}=await supabase.from('gym_members').select('gym_id,role,access_status,gyms(id,name,slug,logo_url)').eq('user_id',session.user.id).eq('is_active',true).eq('access_status','active').order('created_at');
 if(error){$('msg').textContent='Could not load your gyms.';return}
 const rows=data||[];if(!rows.length){$('intro').textContent='This account does not currently have active gym access.';return}
 if(rows.length===1&&!switching){location.replace(destination(rows[0]));return}
 const last=localStorage.getItem('hybrid-last-gym-id')||'';
 $('intro').textContent=rows.length===1?'You currently have access to one gym.':switching?'Choose the gym you want to switch to.':'Your account has access to more than one gym. Choose where you want to go.';
 $('gyms').innerHTML=rows.map(m=>{const g=m.gyms||{},lastTag=m.gym_id===last?'<span class="tag">Last used</span>':'',logo=g.logo_url?'<img src="'+esc(g.logo_url)+'" alt="">':esc(initials(g.name));return '<button type="button" class="gym-card" data-gym="'+esc(m.gym_id)+'"><span class="gym-logo">'+logo+'</span><span class="gym-copy"><b>'+esc(g.name||'Gym')+lastTag+'</b><span class="gym-meta">'+esc(roleLabel(m.role))+'</span></span><span class="arrow">›</span></button>'}).join('');
 $('gyms').querySelectorAll('[data-gym]').forEach(b=>b.onclick=()=>{const m=rows.find(x=>x.gym_id===b.dataset.gym);if(m)location.replace(destination(m))});
}
$('signOut').onclick=async()=>{ctx.clearGym();await supabase.auth.signOut();location.replace('./login.html')};await load();
</script></body></html>
