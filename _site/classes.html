async function loadWeek(){const end=addDays(weekStart,7);$('weekLabel').textContent=fmtWeek(weekStart,addDays(weekStart,6));$('calendar').innerHTML='<div class="loading-state">Loading classes…</div>';const{data,error}=await supabase.rpc('get_class_calendar',{p_gym_id:gym.id,p_from:weekStart.toISOString(),p_to:end.toISOString()});if(error){$('calendar').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const rows=data||[];const sessionIds=rows.map(x=>x.session_id);if(sessionIds.length){const ar=await supabase.from('class_session_staff').select('session_id,user_id,assignment_role,is_lead').in('session_id',sessionIds);const uids=[...new Set((ar.data||[]).map(x=>x.user_id))];let aps=[];if(uids.length){const pr=await supabase.from('profiles').select('id,display_name,first_name,last_name').in('id',uids);aps=pr.data||[]}const apm=new Map(aps.map(x=>[x.id,x]));rows.forEach(r=>{r.staff_names=(ar.data||[]).filter(a=>a.session_id===r.session_id).map(a=>{const p=apm.get(a.user_id)||{};return p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Staff'})})}$('calendar').innerHTML='';for(let i=0;i<7;i++){const d=addDays(weekStart,i),key=isoLocalDate(d),today=isoLocalDate(new Date())===key,dayRows=rows.filter(r=>isoLocalDate(new Date(r.starts_at))===key);const el=document.createElement('section');el.className='day'+(today?' today':'');el.innerHTML=`<div class="dayhead"><b>${new Intl.DateTimeFormat('en-GB',{weekday:'short'}).format(d)}</b><span class="datebubble">${d.getDate()}</span></div>${dayRows.length?dayRows.map(card).join(''):'<div class="empty">No classes</div>'}`;$('calendar').appendChild(el)}document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>book(b.dataset.book,b));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelBooking(b.dataset.cancel,b))}
function card(s){const booked=s.my_booking_status==='booked',full=Number(s.spaces_left)<=0,reserved=s.reserved_capacity>0;let cls=s.is_cancelled?'Cancelled':booked?'Booked':s.availability_note||`${s.spaces_left} spaces left`;let tag=s.is_cancelled?'warn':booked?'good':reserved?'warn':'';let button='';return `<article class="session ${s.is_cancelled?'cancelled':''}"><div class="time">${fmtTime(s.starts_at)}–${fmtTime(s.ends_at)}</div><h3>${esc(s.name)}</h3>${s.description?`<div class="meta">${esc(s.description)}</div>`:''}${s.staff_names?.length?`<div class="meta" style="margin-top:5px">Coach: ${esc(s.staff_names.join(', '))}</div>`:''}<div class="meta">${s.booked_count}/${s.capacity} booked</div><span class="status ${tag}">${esc(cls)}</span>${reserved&&s.reserved_plan_names?.length?`<div class="meta" style="margin-top:6px">Reserved: ${esc(s.reserved_plan_names.join(', '))}</div>`:''}${button}</article>`}
