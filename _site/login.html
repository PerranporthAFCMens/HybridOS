<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sign in · HybridOne</title>
<style>
:root{--ink:var(--hybrid-ink);--muted:var(--hybrid-muted);--line:var(--hybrid-line);--dark:var(--hybrid-dark);--bad:var(--hybrid-ember);--good:var(--hybrid-volt)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--hybrid-bg);color:var(--ink);font-family:var(--hybrid-font)}
.wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand{background:var(--dark);color:#fff;padding:8vw;display:flex;flex-direction:column;justify-content:center}.brand-mark{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600;letter-spacing:.04em}.brand-mark svg{width:38px;height:34px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.brand small{font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--hybrid-muted);margin-top:28px;font-family:var(--hybrid-mono)}.brand h1{font-size:clamp(42px,6vw,72px);line-height:1;margin:12px 0}.brand p{color:var(--hybrid-muted);font-size:18px;line-height:1.5;max-width:560px}.panel{padding:8vw 6vw;display:flex;align-items:center;background:var(--hybrid-panel)}.box{width:100%;max-width:440px;margin:auto}.eyebrow{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--hybrid-muted);font-family:var(--hybrid-mono)}.box h2{font-size:36px;margin:8px 0}.muted{color:var(--muted);line-height:1.5}.hint{display:none;margin:18px 0 0;padding:12px 14px;border:1px solid var(--hybrid-line);border-radius:10px;background:var(--hybrid-bg);font-size:13px}.hint.show{display:block}.hint b{display:block;margin-bottom:2px}label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font:inherit;outline:none}input:focus{border-color:#6C8CFF;box-shadow:none}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--hybrid-volt);color:var(--hybrid-dark);font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.55}.auth-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.auth-link{margin:0;padding:10px 8px;background:var(--hybrid-panel);color:var(--hybrid-text);border:1px solid var(--line);font-size:13px}.msg{min-height:22px;margin-top:14px;font-size:14px;color:var(--bad)}.msg.good{color:var(--good)}.join-link{margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:600;color:var(--ink);text-decoration:none;font-size:14px}.sales-link{display:inline-block;margin-top:20px;color:var(--hybrid-muted);font-size:13px;text-decoration:none}
@media(max-width:760px){.wrap{display:block}.brand{min-height:220px;padding:38px 26px}.brand small{margin-top:22px}.brand h1{font-size:40px}.brand p{font-size:16px}.panel{padding:34px 24px}.box h2{font-size:32px}}@media(max-width:460px){.auth-links{grid-template-columns:1fr}}
</style>
<meta name="theme-color" content="#0B1020"><link rel="icon" href="./assets/brand/icons/favicon.ico" sizes="any"><link rel="icon" href="./assets/brand/icons/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/brand/icons/apple-touch-icon.png"><link rel="manifest" href="./assets/brand/icons/site.webmanifest"><meta property="og:title" content="HybridOne"><meta property="og:description" content="Your gym. Your members. One operating system."><meta property="og:image" content="https://www.hybridone.co.uk/assets/brand/social/og-image-1200x630.png"><meta name="twitter:card" content="summary_large_image"><link rel="preload" href="./assets/brand/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="./assets/brand/brand.css?v=a2dbf599d51d"></head>
<body>
<div class="wrap">
<section class="brand">
  <div class="brand-mark"><img class="hybrid-logo-img" src="./assets/brand/logo/svg/hybridone-logo-on-dark.svg" alt="HybridOne" height="34"></div>
  <small>One account</small><h1>Your gyms.<br>One login.</h1><p>Sign in once. If your account has access to more than one gym, choose where you want to go next.</p>
</section>
<section class="panel"><div class="box">
  <img id="gymLogo" alt="" style="display:none;max-width:200px;max-height:80px;object-fit:contain;margin-bottom:14px"><div class="eyebrow" id="loginEyebrow">HybridOne</div><h2>Sign in</h2><div class="muted">Use the email address and password linked to your HybridOne account.</div>
  <div id="gymHint" class="hint"><b id="gymHintTitle"></b><span id="gymHintText"></span></div>
  <label for="email">Email</label><input id="email" type="email" autocomplete="email">
  <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
  <button id="signIn">Sign in</button>
  <div class="auth-links"><button class="auth-link" id="forgotPassword" type="button">Forgot password?</button><button class="auth-link" id="magicLink" type="button">Email me a sign-in link</button></div>
  <a id="joinLink" class="join-link" href="./join.html" style="display:none"></a><div id="msg" class="msg"></div><a class="sales-link" href="./"><i class="hi hi-arrow-left" aria-hidden="true"></i> Back to HybridOne</a>
</div></section>
</div>
<script src="./gym-context.js"></script>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');
const ctx=window.HybridGymContext,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),hintGymId=params.get('gym_id')||'',returnTo=params.get('return_to')||'';
const btn=$('signIn'),msg=$('msg');
const SLUGS={'242f57c2-6e37-4977-b3c5-1c87de7d0b98':'hybrid-hub-demo','aec16956-3793-4543-873b-4412646ca1eb':'puffin-performance'};
const KNOWN={'242f57c2-6e37-4977-b3c5-1c87de7d0b98':'Hybrid Hub','aec16956-3793-4543-873b-4412646ca1eb':'Puffin Performance'};
if(hintGymId){$('gymHint').classList.add('show');$('gymHintTitle').textContent=KNOWN[hintGymId]||'Gym link';$('gymHintText').textContent='This link will open that gym if your account has access.'}
if(SLUGS[hintGymId]){const a=$('joinLink');a.href='./join.html?gym='+SLUGS[hintGymId];a.textContent='New member? Join '+KNOWN[hintGymId];a.style.display='block'}
if(hintGymId){supabase.rpc('get_public_gym_brand',{p_gym_id:hintGymId}).then(function(r){var b=r&&r.data;if(!b)return;if(b.name){$('loginEyebrow').textContent=b.name;$('gymHintTitle').textContent=b.name}if(b.logo_url){var i=$('gymLogo');i.src=b.logo_url;i.alt=b.name||'';i.style.display='block'}}).catch(function(){})}
function emailValue(){return $('email').value.trim().toLowerCase()}
function show(text,good=false){msg.textContent=text;msg.className='msg'+(good?' good':'')}
async function memberships(userId){const{data,error}=await supabase.from('gym_members').select('gym_id,role,access_status,gyms(id,name,slug,logo_url)').eq('user_id',userId).eq('is_active',true).eq('access_status','active').order('created_at');if(error)throw error;return data||[]}
function chooserUrl(){const u=new URL('./choose-gym.html',location.href);if(returnTo)u.searchParams.set('return_to',returnTo);return u.toString()}
function selectedDestination(m){ctx.setGym(m.gym_id);if(returnTo){const safe=ctx.safeReturn(returnTo,m.gym_id);if(safe)return safe}return ctx.destination(m)}
async function continueSession(session){
  if(!session)return false;
  const rows=await memberships(session.user.id);
  if(!rows.length){ctx.clearGym();show('This account does not currently have active access to a gym.');return false}
  if(hintGymId){const hinted=rows.find(x=>x.gym_id===hintGymId);if(hinted){location.replace(selectedDestination(hinted));return true}show('This account does not have access to the gym in this link.');return false}
  if(rows.length===1){location.replace(selectedDestination(rows[0]));return true}
  ctx.clearGym();location.replace(chooserUrl());return true
}
btn.onclick=async()=>{show('');const email=emailValue(),password=$('password').value;if(!email||!password){show('Enter your email and password.');return}btn.disabled=true;try{const{data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;await continueSession(data.session)}catch(e){console.error(e);show('Email or password not recognised.')}finally{btn.disabled=false}};
function authReturn(mode){const u=new URL('./auth-return.html',location.href);u.searchParams.set('mode',mode);return u.toString()}
$('forgotPassword').onclick=async()=>{const email=emailValue();if(!email){show('Enter your email address first.');return}const b=$('forgotPassword');b.disabled=true;try{const{error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:authReturn('recovery')});if(error)throw error;show('Check your email for a password reset link.',true)}catch(e){console.error(e);show('Could not send a reset link.')}finally{b.disabled=false}};
$('magicLink').onclick=async()=>{const email=emailValue();if(!email){show('Enter your email address first.');return}const b=$('magicLink');b.disabled=true;try{const{error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:authReturn('magic'),shouldCreateUser:false}});if(error)throw error;show('Check your email for a secure sign-in link.',true)}catch(e){console.error(e);show('Could not send a sign-in link.')}finally{b.disabled=false}};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click()});
const{data:{session}}=await supabase.auth.getSession();if(session)await continueSession(session);
</script>
</body></html>
