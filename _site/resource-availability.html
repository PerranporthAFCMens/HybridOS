</style><script src="./gym-context.js?v=a2dbf599d51d"></script><script src="./app-stability.js?v=a2dbf599d51d"></script><link rel="stylesheet" href="./admin-shell.css?v=a2dbf599d51d"><link rel="stylesheet" href="./admin-pages.css?v=a2dbf599d51d"><link rel="stylesheet" href="./app-consistency.css?v=a2dbf599d51d"><meta name="theme-color" content="#0B1020"><link rel="icon" href="./assets/brand/icons/favicon.ico" sizes="any"><link rel="icon" href="./assets/brand/icons/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/brand/icons/apple-touch-icon.png"><link rel="manifest" href="./assets/brand/icons/site.webmanifest"></head><body><div id="loading">Loading resource availability…</div><div id="app" class="shell hidden"><aside class="side"><div class="brand"><img class="hybrid-logo-img" src="./assets/brand/logo/svg/hybridone-logo-on-dark.svg" alt="HybridOne" height="34"></div><div class="gym"><small>Current gym</small><div id="gymName" style="font-weight:600;margin-top:4px"></div></div><nav class="nav"></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">Scheduling engine</div><h1>Resource availability</h1><div class="muted">Set the normal hours each room, area or piece of equipment can be scheduled.</div></div></div><div class="card"><div class="field"><label>Resource</label><select id="resource"></select></div><div class="days" id="days"></div><div id="msg" class="msg"></div><button id="save" class="btn primary" style="width:100%;margin-top:12px">Save availability</button></div></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');const $=id=>document.getElementById(id);const labels=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let gymId=null,resources=[];async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href=window.HybridGymContext.loginUrl({gymId:new URLSearchParams(location.search).get('gym_id')||sessionStorage.getItem('hybrid-gym-id')||'',returnTo:location.href});return}const{data:gm}=await sb.from('gym_members').select('gym_id,role,gyms(name)').eq('user_id',session.user.id).eq('is_active',true).eq('gym_id',sessionStorage.getItem('hybrid-gym-id')||'00000000-0000-0000-0000-000000000000').limit(1);if(!gm?.length){location.href=window.HybridGymContext.chooserUrl({returnTo:location.href});return}if(!['owner','admin'].includes(gm[0].role)){location.href=window.HybridGymContext.destination(gm[0]);return}gymId=gm[0].gym_id;window.HybridGymContext.setGym(gymId);$('gymName').textContent=gm[0].gyms?.name||'';const{data}=await sb.from('resources').select('id,name,resource_type,is_active').eq('gym_id',gymId).eq('is_active',true).order('name');resources=data||[];$('resource').innerHTML=resources.map(r=>`<option value="${r.id}">${r.name} · ${r.resource_type}</option>`).join('');$('days').innerHTML=labels.map((d,i)=>`<div class="day"><b>${d.slice(0,3)}</b><label><input type="checkbox" data-on="${i}" checked> Open</label><input type="time" data-start="${i}" value="06:00"><input type="time" data-end="${i}" value="22:00"></div>`).join('');$('resource').onchange=load;$('save').onclick=save;$('loading').classList.add('hidden');$('app').classList.remove('hidden');await load()}async function load(){const rid=$('resource').value;if(!rid)return;const{data}=await sb.from('resource_availability').select('*').eq('gym_id',gymId).eq('resource_id',rid);const map=new Map((data||[]).map(x=>[Number(x.weekday),x]));for(let i=0;i<7;i++){const r=map.get(i);document.querySelector(`[data-on="${i}"]`).checked=r?r.is_available:true;document.querySelector(`[data-start="${i}"]`).value=(r?.start_time||'06:00').slice(0,5);document.querySelector(`[data-end="${i}"]`).value=(r?.end_time||'22:00').slice(0,5)}}async function save(){const rid=$('resource').value;if(!rid)return;const btn=$('save');btn.disabled=true;btn.textContent='Saving…';const rows=[];for(let i=0;i<7;i++)rows.push({gym_id:gymId,resource_id:rid,weekday:i,is_available:document.querySelector(`[data-on="${i}"]`).checked,start_time:document.querySelector(`[data-start="${i}"]`).value,end_time:document.querySelector(`[data-end="${i}"]`).value});const{error}=await sb.from('resource_availability').upsert(rows,{onConflict:'resource_id,weekday'});btn.disabled=false;btn.textContent='Save availability';$('msg').textContent=error?error.message:'Availability saved.';$('msg').className='msg '+(error?'bad':'good')}init();</script><script src="./shared-shell.js?v=a2dbf599d51d" defer></script><script src="./gym-switcher.js?v=a2dbf599d51d" defer></script><script src="./account-menu.js?v=a2dbf599d51d" defer></script><script src="./admin-embed.js?v=a2dbf599d51d" defer></script><script src="./shared-admin-nav.js?v=a2dbf599d51d" defer></script><script src="./admin-access-guard.js?v=a2dbf599d51d" defer></script><script src="./admin-transition-diagnostics.js?v=a2dbf599d51d" defer></script></body></html>
