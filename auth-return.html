<!doctype html>
<html lang="en">
<head><script src="./supabase-request-guard.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020">
<title>Account access · HybridOne</title>
<style>
:root{--ink:#101828;--muted:#667085;--line:#dfe4ec;--dark:#0b1020;--good:#067647;--bad:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand{background:var(--dark);color:#fff;padding:8vw;display:flex;flex-direction:column;justify-content:center}.brand small{font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#aeb8ca}.brand h1{font-size:clamp(42px,6vw,74px);line-height:1;margin:12px 0}.brand p{color:#cbd3df;font-size:18px;line-height:1.5;max-width:540px}.panel{padding:8vw 6vw;display:flex;align-items:center;background:#fff}.box{width:100%;max-width:440px;margin:auto}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#7a8494}.box h2{font-size:36px;margin:8px 0}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:800;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;font:inherit}button,a.btn{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:var(--dark);color:#fff;font:inherit;font-weight:900;cursor:pointer;text-align:center;text-decoration:none}button.secondary,a.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.55}.msg{margin-top:14px;font-size:14px}.bad{color:var(--bad)}.good{color:var(--good)}.hidden{display:none!important}@media(max-width:760px){.wrap{display:block}.brand{min-height:220px;padding:42px 28px}.brand h1{font-size:42px}.panel{padding:36px 24px}}
</style></head>
<body><div class="wrap"><section class="brand"><small>Powered by HybridOne</small><h1 id="gymBrand">Your gym</h1><p>Secure account access for your gym.</p></section><section class="panel"><div class="box"><div class="eyebrow" id="eyebrow">Secure account access</div><h2 id="heading">Checking your link…</h2><div class="muted" id="intro">Please keep this page open while we verify your secure link.</div><div id="passwordBox" class="hidden"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"><button id="savePassword">Save new password</button></div><a id="continueBtn" class="btn hidden" href="./">Continue</a><a id="loginBtn" class="btn secondary hidden" href="./">Back to sign in</a><div id="msg" class="msg"></div></div></section></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),gymId=params.get('gym_id')||sessionStorage.getItem('hybrid-gym-id')||'',mode=params.get('mode')||'return';
const KNOWN={'242f57c2-6e37-4977-b3c5-1c87de7d0b98':{name:'Hybrid Hub',login:'./hybrid-hub'},'aec16956-3793-4543-873b-4412646ca1eb':{name:'Puffin Performance',login:'./puffin-performance'}};
const gym=KNOWN[gymId]||{name:'Your gym',login:'./'};if(gymId)sessionStorage.setItem('hybrid-gym-id',gymId);$('gymBrand').textContent=gym.name;$('loginBtn').href=gym.login;
async function destinationFor(session){if(!session||!gymId)return gym.login;const{data:membership}=await supabase.from('gym_members').select('role').eq('user_id',session.user.id).eq('gym_id',gymId).eq('is_active',true).maybeSingle();if(!membership)return gym.login;if(membership.role==='member')return './member.html';if(['staff','coach'].includes(membership.role))return './staff.html';if(['owner','admin'].includes(membership.role))return './admin.html?gym_id='+encodeURIComponent(gymId);return gym.login}
function showMessage(text,kind=''){$('msg').textContent=text;$('msg').className='msg '+kind}
function showRecovery(){document.title='Reset password · '+gym.name;$('eyebrow').textContent=gym.name;$('heading').textContent='Choose a new password';$('intro').textContent='Set a new password for your '+gym.name+' account.';$('passwordBox').classList.remove('hidden');$('loginBtn').classList.remove('hidden')}
function showReturn(){document.title='Signed in · '+gym.name;$('eyebrow').textContent=gym.name;$('heading').textContent='Secure link verified';$('intro').textContent='Your secure sign-in link has been verified.';$('continueBtn').classList.remove('hidden');$('loginBtn').classList.remove('hidden')}
const{data:{session}}=await supabase.auth.getSession();if(session)$('continueBtn').href=await destinationFor(session);
if(mode==='recovery'){if(session)showRecovery();else{$('heading').textContent='This reset link is not active';$('intro').textContent='Open the latest password reset email for '+gym.name+' or request another link.';$('loginBtn').classList.remove('hidden')}}else if(session)showReturn();else{$('heading').textContent='This secure link is not active';$('intro').textContent='Open the latest email from '+gym.name+' or return to sign in.';$('loginBtn').classList.remove('hidden')}
$('savePassword').onclick=async()=>{const password=$('password').value,confirm=$('confirmPassword').value;if(password.length<8){showMessage('Use at least 8 characters.','bad');return}if(password!==confirm){showMessage('Passwords do not match.','bad');return}const btn=$('savePassword');btn.disabled=true;showMessage('');try{const{error}=await supabase.auth.updateUser({password});if(error)throw error;$('passwordBox').classList.add('hidden');$('heading').textContent='Password updated';$('intro').textContent='Your new password is ready to use.';$('continueBtn').classList.remove('hidden');$('loginBtn').classList.add('hidden');showMessage('Password saved.','good')}catch(e){showMessage(e.message||'Could not update your password.','bad')}finally{btn.disabled=false}};
</script></body></html>
