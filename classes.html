<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b1020" />
<title>Classes · Hybrid OS</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#e7ebf2;--accent:#00d9a6;--dark:#0b1020;--good:#067647;--warn:#b54708;--bad:#b42318;--shadow:0 16px 40px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{background:var(--dark);color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:22px}.logo img{width:180px;max-width:100%;display:block}.gym{padding:13px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}.gym small{color:#98a2b3}.nav{display:grid;gap:6px}.nav a{color:#a9b2c2;text-decoration:none;padding:12px;border-radius:12px}.nav a.active,.nav a:hover{background:rgba(255,255,255,.09);color:#fff}.main{padding:28px 30px 80px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#7a8494}.top h1{font-size:32px;margin:4px 0 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--dark);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.good{background:#ecfdf3;color:#067647}.btn.danger{background:#fef3f2;color:#b42318}.btn:disabled{opacity:.5;cursor:not-allowed}.weekbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.weekbar strong{font-size:18px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.day{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}.day.today{border-color:#b9efe1}.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dayhead b{font-size:13px}.datebubble{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f2f4f7;font-weight:850;font-size:12px}.today .datebubble{background:#dffaf3;color:#066c59}.session{border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:9px;background:#fff}.session.cancelled{opacity:.55}.time{font-size:12px;font-weight:850;color:#344054}.session h3{font-size:15px;margin:5px 0}.meta{font-size:12px;color:var(--muted);line-height:1.45}.status{display:inline-flex;margin-top:8px;padding:4px 7px;border-radius:999px;background:#f2f4f7;font-size:11px;font-weight:800}.status.good{background:#ecfdf3;color:#067647}.status.warn{background:#fffaeb;color:#b54708}.session .btn{width:100%;margin-top:9px;padding:9px}.empty{font-size:12px;color:var(--muted);padding:12px 2px}.modal{position:fixed;inset:0;background:rgba(11,16,32,.58);display:grid;place-items:center;padding:18px;z-index:30}.modal-card{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:20px}.modal-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:12px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.checks{display:grid;gap:8px}.check{display:flex;gap:8px;align-items:center;font-size:13px}.notice{padding:11px 12px;background:#f4f3ff;color:#3e347d;border-radius:12px;font-size:13px}.msg{margin-top:10px;font-size:13px}.error{color:#b42318}.goodtxt{color:#067647}.mobile-back{display:none}@media(max-width:1100px){.calendar{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:800px){.shell{display:block}.side{display:none}.main{padding:18px 14px 60px}.mobile-back{display:inline-block;margin-bottom:12px}.calendar{grid-template-columns:1fr}.day{padding:14px}.top h1{font-size:28px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loading" style="padding:30px">Loading classes…</div>
<div id="app" class="shell hidden">
  <aside class="side"><div class="logo"><img src="./Hybrid_OS_Sled_Logo.svg" alt="Hybrid OS"></div><div class="gym"><small>Current gym</small><div id="gymName" style="font-weight:800;margin-top:4px"></div></div><nav class="nav"><a href="./index.html">⌂ Dashboard</a><a class="active" href="./classes.html">▦ Classes</a><a href="./index.html#memberships">£ Memberships</a><a href="./index.html#members">◉ Members</a></nav></aside>
  <main class="main">
    <a class="mobile-back" href="./index.html">← Back to Hybrid OS</a>
    <div class="top"><div><div class="eyebrow">Timetable & bookings</div><h1>Classes</h1></div><div class="actions"><button id="todayBtn" class="btn secondary">Today</button><button id="addBtn" class="btn primary hidden">+ Add class</button></div></div>
    <div class="weekbar"><div class="actions"><button id="prevBtn" class="btn secondary">← Previous</button><button id="nextBtn" class="btn secondary">Next →</button></div><strong id="weekLabel"></strong></div>
    <div id="calendar" class="calendar"></div>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-top"><div><div class="eyebrow">New class</div><h2 style="margin:4px 0">Add to timetable</h2></div><button id="closeBtn" class="btn secondary">Close</button></div><div class="grid2"><div class="field"><label>Class name</label><input id="name" placeholder="Hybrid Conditioning"></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Start time</label><input id="start" type="time" value="18:00"></div><div class="field"><label>Duration (minutes)</label><input id="duration" type="number" min="5" max="480" value="60"></div><div class="field"><label>Total capacity</label><input id="capacity" type="number" min="1" value="20"></div><div class="field"><label>Reserved spaces</label><input id="reserved" type="number" min="0" value="0"></div></div><div class="field"><label>Release reserved spaces</label><select id="release"><option value="">Keep reserved until class starts</option><option value="1440">24 hours before</option><option value="720">12 hours before</option><option value="120">2 hours before</option><option value="60">1 hour before</option><option value="30">30 minutes before</option></select></div><div class="field"><label>Description</label><textarea id="desc" placeholder="Optional class details"></textarea></div><div class="field"><label>Assign gym staff</label><div id="staffChecks" class="checks"></div></div><div class="field"><label>Memberships allowed to use reserved spaces</label><div id="planChecks" class="checks"></div></div><div class="notice">Example: capacity 20 + 5 reserved means standard members can fill up to 15 places, while eligible premium plans can still book into the final 5.</div><div id="modalMsg" class="msg"></div><button id="saveBtn" class="btn primary" style="width:100%;margin-top:10px">Save class</button></div></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');
const $=id=>document.getElementById(id);let gym=null,role=null,plans=[],staffOptions=[],weekStart=startOfWeek(new Date());
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function isoLocalDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fmtTime(v){return new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit'}).format(new Date(v))}function fmtWeek(a,b){const f=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'});return f.format(a)+' – '+f.format(b)}
async function init(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='./index.html';return}const{data:gm,error}=await supabase.from('gym_members').select('gym_id,role,gyms(id,name)').eq('user_id',session.user.id).eq('is_active',true).limit(1);if(error||!gm?.length){location.href='./index.html';return}gym=gm[0].gyms;role=gm[0].role;$('gymName').textContent=gym.name;const pr=await supabase.from('membership_plans').select('id,name,price_pence').eq('gym_id',gym.id).eq('is_active',true).order('price_pence');plans=pr.data||[];const sr=await supabase.from('gym_members').select('user_id,role').eq('gym_id',gym.id).eq('is_active',true).in('role',['owner','admin','staff','coach']);const staffIds=(sr.data||[]).map(x=>x.user_id);let staffProfiles=[];if(staffIds.length){const sp=await supabase.from('profiles').select('id,display_name,first_name,last_name').in('id',staffIds);staffProfiles=sp.data||[]}const pm=new Map(staffProfiles.map(x=>[x.id,x]));staffOptions=(sr.data||[]).map(x=>{const p=pm.get(x.user_id)||{};return{user_id:x.user_id,role:x.role,name:p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||x.role}}).sort((a,b)=>a.name.localeCompare(b.name));if(['owner','admin','staff'].includes(role))$('addBtn').classList.remove('hidden');renderPlanChecks();renderStaffChecks();$('loading').classList.add('hidden');$('app').classList.remove('hidden');await loadWeek()}
function renderPlanChecks(){$('planChecks').innerHTML=plans.length?plans.map(p=>`<label class="check"><input type="checkbox" value="${p.id}"> ${esc(p.name)} · £${(p.price_pence/100).toFixed(2)}</label>`).join(''):'<div class="meta">No active membership plans yet.</div>'}
function renderStaffChecks(){$('staffChecks').innerHTML=staffOptions.length?staffOptions.map((p,i)=>`<label class="check"><input type="checkbox" value="${p.user_id}" data-role="${p.role}"> ${esc(p.name)} · ${esc(p.role)}${i===0?'':''}</label>`).join(''):'<div class="meta">No staff or coaches have been added yet.</div>'}
async function loadWeek(){const end=addDays(weekStart,7);$('weekLabel').textContent=fmtWeek(weekStart,addDays(weekStart,6));$('calendar').innerHTML='<div class="empty">Loading…</div>';const{data,error}=await supabase.rpc('get_class_calendar',{p_gym_id:gym.id,p_from:weekStart.toISOString(),p_to:end.toISOString()});if(error){$('calendar').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const rows=data||[];const sessionIds=rows.map(x=>x.session_id);if(sessionIds.length){const ar=await supabase.from('class_session_staff').select('session_id,user_id,assignment_role,is_lead').in('session_id',sessionIds);const uids=[...new Set((ar.data||[]).map(x=>x.user_id))];let aps=[];if(uids.length){const pr=await supabase.from('profiles').select('id,display_name,first_name,last_name').in('id',uids);aps=pr.data||[]}const apm=new Map(aps.map(x=>[x.id,x]));rows.forEach(r=>{r.staff_names=(ar.data||[]).filter(a=>a.session_id===r.session_id).map(a=>{const p=apm.get(a.user_id)||{};return p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Staff'})})}$('calendar').innerHTML='';for(let i=0;i<7;i++){const d=addDays(weekStart,i),key=isoLocalDate(d),today=isoLocalDate(new Date())===key,dayRows=rows.filter(r=>isoLocalDate(new Date(r.starts_at))===key);const el=document.createElement('section');el.className='day'+(today?' today':'');el.innerHTML=`<div class="dayhead"><b>${new Intl.DateTimeFormat('en-GB',{weekday:'short'}).format(d)}</b><span class="datebubble">${d.getDate()}</span></div>${dayRows.length?dayRows.map(card).join(''):'<div class="empty">No classes</div>'}`;$('calendar').appendChild(el)}document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>book(b.dataset.book,b));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelBooking(b.dataset.cancel,b))}
function card(s){const booked=s.my_booking_status==='booked',full=Number(s.spaces_left)<=0,reserved=s.reserved_capacity>0;let cls=s.is_cancelled?'Cancelled':booked?'Booked':s.availability_note||`${s.spaces_left} spaces left`;let tag=s.is_cancelled?'warn':booked?'good':reserved?'warn':'';let button='';if(booked)button=`<button class="btn danger" data-cancel="${s.session_id}">Cancel booking</button>`;else if(!s.is_cancelled)button=`<button class="btn ${s.bookable_for_me?'good':'secondary'}" data-book="${s.session_id}" ${s.bookable_for_me?'':'disabled'}>${full?'Full':s.bookable_for_me?'Book class':'Unavailable'}</button>`;return `<article class="session ${s.is_cancelled?'cancelled':''}"><div class="time">${fmtTime(s.starts_at)}–${fmtTime(s.ends_at)}</div><h3>${esc(s.name)}</h3>${s.description?`<div class="meta">${esc(s.description)}</div>`:''}${s.staff_names?.length?`<div class="meta" style="margin-top:5px">Coach: ${esc(s.staff_names.join(', '))}</div>`:''}<div class="meta">${s.booked_count}/${s.capacity} booked</div><span class="status ${tag}">${esc(cls)}</span>${reserved&&s.reserved_plan_names?.length?`<div class="meta" style="margin-top:6px">Reserved: ${esc(s.reserved_plan_names.join(', '))}</div>`:''}${button}</article>`}
async function book(id,btn){btn.disabled=true;btn.textContent='Booking…';const{error}=await supabase.rpc('book_class_session',{p_session_id:id});if(error)alert(error.message);await loadWeek()}
async function cancelBooking(id,btn){btn.disabled=true;btn.textContent='Cancelling…';const{error}=await supabase.rpc('cancel_class_booking',{p_session_id:id});if(error)alert(error.message);await loadWeek()}
$('prevBtn').onclick=()=>{weekStart=addDays(weekStart,-7);loadWeek()};$('nextBtn').onclick=()=>{weekStart=addDays(weekStart,7);loadWeek()};$('todayBtn').onclick=()=>{weekStart=startOfWeek(new Date());loadWeek()};$('addBtn').onclick=()=>{$('date').value=isoLocalDate(new Date());$('modalMsg').textContent='';$('modal').classList.remove('hidden')};$('closeBtn').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};
$('saveBtn').onclick=async()=>{const name=$('name').value.trim(),date=$('date').value,start=$('start').value,duration=Number($('duration').value),capacity=Number($('capacity').value),reserved=Number($('reserved').value);if(!name||!date||!start||!Number.isFinite(duration)||duration<5||!Number.isInteger(capacity)||capacity<1||!Number.isInteger(reserved)||reserved<0||reserved>capacity){$('modalMsg').textContent='Check the class name, date, duration and capacity values.';$('modalMsg').className='msg error';return}const starts=new Date(date+'T'+start+':00');const ends=new Date(starts.getTime()+duration*60000);const payload={gym_id:gym.id,name,description:$('desc').value.trim()||null,starts_at:starts.toISOString(),ends_at:ends.toISOString(),capacity,reserved_capacity:reserved,reserved_release_minutes_before:$('release').value===''?null:Number($('release').value)};$('saveBtn').disabled=true;$('saveBtn').textContent='Saving…';const{data,error}=await supabase.from('class_sessions').insert(payload).select('id').single();if(error){$('modalMsg').textContent=error.message;$('modalMsg').className='msg error'}else{const selected=[...document.querySelectorAll('#planChecks input:checked')].map(x=>x.value);if(reserved>0&&selected.length){const rr=await supabase.from('class_session_reserved_plans').insert(selected.map(plan_id=>({session_id:data.id,plan_id})));if(rr.error){$('modalMsg').textContent='Class saved, but reserved-plan rules failed: '+rr.error.message;$('modalMsg').className='msg error';$('saveBtn').disabled=false;$('saveBtn').textContent='Save class';return}}const assigned=[...document.querySelectorAll('#staffChecks input:checked')].map((x,i)=>({session_id:data.id,gym_id:gym.id,user_id:x.value,assignment_role:x.dataset.role==='coach'?'coach':'staff',is_lead:i===0}));if(assigned.length){const sa=await supabase.from('class_session_staff').insert(assigned);if(sa.error){$('modalMsg').textContent='Class saved, but staff assignment failed: '+sa.error.message;$('modalMsg').className='msg error';$('saveBtn').disabled=false;$('saveBtn').textContent='Save class';return}}$('modal').classList.add('hidden');$('name').value='';$('desc').value='';document.querySelectorAll('#planChecks input,#staffChecks input').forEach(x=>x.checked=false);weekStart=startOfWeek(starts);await loadWeek()}$('saveBtn').disabled=false;$('saveBtn').textContent='Save class'};
init();
</script>
</body></html>
