<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Join training group · HybridOne</title><style>
:root{--bg:#f5f7fb;--ink:#101828;--muted:#667085;--line:#e7ebf2;--dark:#0b1020;--good:#067647;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(16,24,40,.1)}.brand{font-weight:950;letter-spacing:.08em;margin-bottom:24px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#7a8494}.muted{color:var(--muted)}h1{margin:6px 0 10px;font-size:30px}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:12px 14px;font-weight:850;cursor:pointer;margin-top:12px}.btn.primary{background:var(--dark);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line)}.btn:disabled{opacity:.55}.hidden{display:none!important}.preview{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fafbfc}.preview h2{margin:4px 0}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#ecfdf3;color:#067647;font-size:11px;font-weight:850}.msg{min-height:18px;margin-top:10px;font-size:13px}.bad{color:var(--bad)}.good{color:var(--good)}a{color:inherit}
</style></head><body><main class="card"><div class="brand">HYBRIDONE</div><div class="eyebrow">Private training group</div><h1>Join a group</h1><div id="intro" class="muted">Sign in to see who invited you and choose whether you want to join.</div>
<section id="signin"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="signInBtn" class="btn primary">Sign in</button><div id="authMsg" class="msg bad"></div><div class="muted" style="font-size:13px;margin-top:12px">Not a Hybrid Hub member yet? <a href="./join.html?gym=hybrid-hub-demo">Create a member account first</a>.</div></section>
<section id="invite" class="hidden"><div class="preview"><div class="eyebrow">You’ve been invited to</div><h2 id="groupName"></h2><div id="groupDesc" class="muted"></div><div style="margin-top:12px"><span class="tag" id="memberCount"></span></div><div class="muted" id="ownerName" style="margin-top:10px"></div></div><button id="joinBtn" class="btn primary">Join group</button><button id="openBtn" class="btn secondary hidden">Open group</button><div id="inviteMsg" class="msg"></div></section>
</main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');const $=id=>document.getElementById(id);const code=new URLSearchParams(location.search).get('code')||'';
async function preview(){const{data,error}=await sb.rpc('preview_training_group_invite',{p_code:code});if(error){$('inviteMsg').textContent=error.message;$('inviteMsg').className='msg bad';return}$('signin').classList.add('hidden');$('invite').classList.remove('hidden');$('groupName').textContent=data.name;$('groupDesc').textContent=data.description||'Private training group';$('memberCount').textContent=data.member_count+' member'+(Number(data.member_count)===1?'':'s');$('ownerName').textContent='Created by '+data.owner_name;$('joinBtn').classList.toggle('hidden',!!data.already_member);$('openBtn').classList.toggle('hidden',!data.already_member);$('openBtn').onclick=()=>location.href='./groups.html?group='+encodeURIComponent(data.id);$('joinBtn').onclick=async()=>{const b=$('joinBtn');b.disabled=true;b.textContent='Joining…';const{data:j,error:e}=await sb.rpc('join_training_group_by_code',{p_code:code});if(e){$('inviteMsg').textContent=e.message;$('inviteMsg').className='msg bad';b.disabled=false;b.textContent='Join group';return}location.href='./groups.html?group='+encodeURIComponent(j.id)}} 
$('signInBtn').onclick=async()=>{const b=$('signInBtn');b.disabled=true;b.textContent='Signing in…';const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});b.disabled=false;b.textContent='Sign in';if(error){$('authMsg').textContent=error.message;return}await preview()};
(async()=>{if(!code){$('intro').textContent='This invite link is incomplete.';$('signin').classList.add('hidden');return}const{data:{session}}=await sb.auth.getSession();if(session?.user)await preview()})();
</script></body></html>
