<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Hybrid Hub · HybridOne</title>
<style>
:root{--ink:#101828;--muted:#667085;--line:#dfe4ec;--dark:#0b1020}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand{background:var(--dark);color:#fff;padding:8vw;display:flex;flex-direction:column;justify-content:center}.brand small{font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#aeb8ca}.brand h1{font-size:clamp(42px,6vw,74px);line-height:1;margin:12px 0}.brand p{color:#cbd3df;font-size:18px;line-height:1.5;max-width:540px}.panel{padding:8vw 6vw;display:flex;align-items:center;background:#fff}.box{width:100%;max-width:440px;margin:auto}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#7a8494}.box h2{font-size:36px;margin:8px 0}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:800;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:var(--dark);color:#fff;font:inherit;font-weight:900;cursor:pointer}button:disabled{opacity:.55}.msg{margin-top:14px;font-size:14px;color:#b42318}.msg.good{color:#067647}.auth-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.auth-link{margin:0;padding:10px 8px;background:#fff;color:#344054;border:1px solid var(--line);font-size:13px}@media(max-width:460px){.auth-links{grid-template-columns:1fr}}.gym{margin:22px 0;padding:14px 16px;border:1px solid #e7ebf2;border-radius:14px;background:#f8fafc;font-weight:800}@media(max-width:760px){.wrap{display:block}.brand{min-height:220px;padding:42px 28px}.brand h1{font-size:42px}.panel{padding:36px 24px}}
</style>
</head>
<body>
<div class="wrap">
<section class="brand"><small>HybridOne</small><h1>Hybrid Hub</h1><p>Sign in to manage this gym.</p></section>
<section class="panel"><div class="box">
<div class="eyebrow">Hybrid Hub</div><h2>Sign in</h2><div class="muted">Use your HybridOne account.</div>
<div class="gym">Opening: Hybrid Hub</div>
<label for="email">Email</label><input id="email" type="email" autocomplete="email">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
<button id="signIn">Sign in to Hybrid Hub</button><div class="auth-links"><button class="auth-link" id="forgotPassword" type="button">Forgot password?</button><button class="auth-link" id="magicLink" type="button">Email me a sign-in link</button></div><div id="msg" class="msg"></div>
</div></section>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');
const gymId='242f57c2-6e37-4977-b3c5-1c87de7d0b98',btn=document.getElementById('signIn'),msg=document.getElementById('msg');
const expectedGymParam=new URLSearchParams(location.search).get('gym_id');
if(expectedGymParam&&expectedGymParam!==gymId){
  location.replace('./index.html?gym_id='+encodeURIComponent(gymId));
}
sessionStorage.setItem('hybrid-gym-id',gymId);
function emailValue(){return document.getElementById('email').value.trim().toLowerCase()}
function authReturn(mode){const url=new URL('./auth-return.html',location.href);url.searchParams.set('gym_id',gymId);url.searchParams.set('mode',mode);return url.toString()}
function showAuthMessage(text,good=false){msg.textContent=text;msg.className='msg'+(good?' good':'')}
btn.onclick=async()=>{msg.textContent='';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){msg.textContent='Enter your email and password.';return}btn.disabled=true;try{const{error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;sessionStorage.setItem('hybrid-gym-id',gymId);location.replace('./admin.html?gym_id='+encodeURIComponent(gymId))}catch(e){msg.textContent=e.message||'Could not sign in.';btn.disabled=false}};
document.getElementById('forgotPassword').onclick=async()=>{const email=emailValue();if(!email){showAuthMessage('Enter your email address first.');return}const button=document.getElementById('forgotPassword');button.disabled=true;try{const{error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:authReturn('recovery')});if(error)throw error;showAuthMessage('Check your email for a password reset link.',true)}catch(e){showAuthMessage(e.message||'Could not send a reset link.')}finally{button.disabled=false}};
document.getElementById('magicLink').onclick=async()=>{const email=emailValue();if(!email){showAuthMessage('Enter your email address first.');return}const button=document.getElementById('magicLink');button.disabled=true;try{const{error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:authReturn('magic'),shouldCreateUser:false}});if(error)throw error;showAuthMessage('Check your email for a secure sign-in link.',true)}catch(e){showAuthMessage(e.message||'Could not send a sign-in link.')}finally{button.disabled=false}};
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click()});
</script>
</body>
</html>
