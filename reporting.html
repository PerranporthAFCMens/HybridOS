<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Reporting · Hybrid OS</title>
<link rel="stylesheet" href="./admin-shell.css">
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#e7ebf2;--dark:#0b1020;--good:#067647;--warn:#b54708;--bad:#b42318;--shadow:0 14px 34px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{background:var(--dark);color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:900;letter-spacing:.08em}.gym{padding:13px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}.gym small{color:#98a2b3}.nav{display:grid;gap:6px}.main{padding:28px 30px 70px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#7a8494}.top h1{margin:4px 0;font-size:32px}.muted{color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls select,.controls button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;font-weight:750}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.stat{grid-column:span 3}.stat .num{font-size:30px;font-weight:900;margin-top:5px}.wide{grid-column:span 8}.narrow{grid-column:span 4}.half{grid-column:span 6}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.section-title h3{margin:0}.bar-list{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:minmax(110px,1.4fr) minmax(120px,3fr) auto;gap:10px;align-items:center;font-size:13px}.track{height:10px;border-radius:999px;background:#eef1f5;overflow:hidden}.fill{height:100%;background:#111827;border-radius:999px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#667085}.heat{display:grid;grid-template-columns:74px repeat(4,minmax(74px,1fr));gap:6px;min-width:430px}.heat .cell{padding:11px 8px;border-radius:11px;background:#f2f4f7;text-align:center;font-size:12px}.heat .head{font-weight:850;background:transparent}.heat .v1{background:#f2f4f7}.heat .v2{background:#e4e7ec}.heat .v3{background:#d0d5dd}.heat .v4{background:#98a2b3;color:#fff}.heat .v5{background:#344054;color:#fff}.notice{padding:13px;border-radius:13px;background:#fffaeb;color:#8a4b0f;font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}.export{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-weight:800;cursor:pointer;font-size:12px}.empty{padding:18px;border:1px dashed #d0d5dd;border-radius:14px;color:var(--muted)}@media(max-width:1000px){.stat{grid-column:span 6}.wide,.narrow,.half{grid-column:span 12}}@media(max-width:780px){.shell{display:block}.side{display:none}.main{padding:18px 14px 50px}.stat{grid-column:span 12}.bar-row{grid-template-columns:100px 1fr auto}}
</style></head><body>
<div id="loading">Loading reporting…</div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">HYBRID <b>OS</b></div><div class="gym"><small>Current gym</small><div id="gymName" style="font-weight:800;margin-top:4px"></div></div><nav class="nav"></nav></aside>
<main class="main"><div class="top"><div><div class="eyebrow">Business intelligence</div><h1>Reporting</h1><div class="muted">Membership, attendance, utilisation and member engagement in one place.</div></div><div class="controls"><select id="range"><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 12 months</option><option value="0">All time</option></select><button id="refresh">Refresh</button></div></div>
<div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="memberships">Memberships</button><button class="tab" data-tab="classes">Classes</button><button class="tab" data-tab="members">Members</button><button class="tab" data-tab="payments">Payments</button></div>
<section id="overview" class="pane"></section><section id="memberships" class="pane hidden"></section><section id="classes" class="pane hidden"></section><section id="members" class="pane hidden"></section><section id="payments" class="pane hidden"></section>
</main></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let gym=null,data={};
const money=p=>'£'+((Number(p)||0)/100).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:0});
const pct=(a,b)=>b?Math.round(a/b*100):0;const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function fromDate(){const n=Number($('range').value);if(!n)return null;const d=new Date();d.setDate(d.getDate()-n);return d.toISOString()}
function mrrValue(m,plans){const p=plans.find(x=>x.id===m.plan_id);if(!p)return 0;const v=p.price_pence||0,i=(p.billing_interval||'monthly').toLowerCase();if(i.includes('year'))return Math.round(v/12);if(i.includes('week'))return Math.round(v*52/12);return v}
function displayName(uid){const p=data.profiles.find(x=>x.id===uid)||{};return p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Member'}
function bookingCounts(){const map=new Map();data.bookings.forEach(b=>{const x=map.get(b.session_id)||{booked:0,attended:0,no_show:0,cancelled:0};x[b.status]=(x[b.status]||0)+1;map.set(b.session_id,x)});return map}
function sessionMetrics(){const bc=bookingCounts();return data.sessions.map(s=>{const b=bc.get(s.id)||{booked:0,attended:0,no_show:0,cancelled:0};const demand=b.booked+b.attended+b.no_show;const actual=b.attended;const local=new Date(s.starts_at);const hr=Number(new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:'Europe/London'}).format(local));const day=new Intl.DateTimeFormat('en-GB',{weekday:'short',timeZone:'Europe/London'}).format(local);const band=hr<9?'Morning':hr<16?'Daytime':hr<21?'Evening':'Late';return{...s,...b,demand,actual,fill:pct(demand,s.capacity),actualFill:pct(actual,s.capacity),day,band,hour:hr}})}
function barRows(rows,labelKey,valueKey,suffix=''){const max=Math.max(1,...rows.map(r=>r[valueKey]||0));return `<div class="bar-list">${rows.map(r=>`<div class="bar-row"><div>${esc(r[labelKey])}</div><div class="track"><div class="fill" style="width:${Math.round((r[valueKey]||0)/max*100)}%"></div></div><b>${esc(r[valueKey])}${suffix}</b></div>`).join('')}</div>`}
function stat(label,value,sub=''){return `<div class="card stat"><div class="muted">${label}</div><div class="num">${value}</div>${sub?`<div class="muted" style="font-size:12px;margin-top:5px">${sub}</div>`:''}</div>`}
function exportCsv(name,headers,rows){const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv=[headers.map(q).join(','),...rows.map(r=>r.map(q).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name+'.csv';a.click();URL.revokeObjectURL(a.href)}
function exportXls(name,headers,rows){const table='<table><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([table],{type:'application/vnd.ms-excel'}));a.download=name+'.xls';a.click();URL.revokeObjectURL(a.href)}
function bindExports(){document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{const key=b.dataset.export,fmt=b.dataset.fmt||'csv',set=exportSets()[key];if(!set)return;(fmt==='xls'?exportXls:exportCsv)(key,set.headers,set.rows)})}
function exportSets(){const sm=sessionMetrics();const planMap=new Map(data.plans.map(p=>[p.id,p.name]));const memberCounts=new Map();data.bookings.filter(b=>['attended','booked','no_show'].includes(b.status)).forEach(b=>memberCounts.set(b.user_id,(memberCounts.get(b.user_id)||0)+1));return{
 memberships:{headers:['Member','Plan','Status','Starts','Ends'],rows:data.memberships.map(m=>[displayName(m.user_id),planMap.get(m.plan_id)||'',m.status,m.starts_on||'',m.ends_on||''])},
 classes:{headers:['Class','Date/time','Capacity','Demand','Attended','No-show','Fill %'],rows:sm.map(s=>[s.name,new Date(s.starts_at).toLocaleString('en-GB'),s.capacity,s.demand,s.attended,s.no_show,s.fill])},
 members:{headers:['Member','Activity count'],rows:[...memberCounts.entries()].sort((a,b)=>b[1]-a[1]).map(([u,n])=>[displayName(u),n])}
}}
function render(){const sm=sessionMetrics(),active=data.memberships.filter(m=>m.status==='active'),mrr=active.reduce((n,m)=>n+mrrValue(m,data.plans),0),past=sm.filter(s=>new Date(s.starts_at)<new Date()),att=past.reduce((n,s)=>n+s.attended,0),noshow=past.reduce((n,s)=>n+s.no_show,0),demand=sm.reduce((n,s)=>n+s.demand,0),cap=sm.reduce((n,s)=>n+(s.capacity||0),0),avgFill=pct(demand,cap),newJoins=data.members.filter(m=>!fromDate()||new Date(m.joined_at)>=new Date(fromDate())).length;
 const byType=[...new Set(sm.map(s=>s.name))].map(name=>{const a=sm.filter(s=>s.name===name);return{name,sessions:a.length,bookings:a.reduce((n,x)=>n+x.demand,0),attendance:a.reduce((n,x)=>n+x.attended,0),fill:pct(a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.capacity,0))}}).sort((a,b)=>b.fill-a.fill);
 const byDay=days.map(day=>{const a=sm.filter(s=>s.day===day);return{day,fill:pct(a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.capacity,0)),attendance:a.reduce((n,x)=>n+x.attended,0)}});
 const bands=['Morning','Daytime','Evening','Late'].map(band=>{const a=sm.filter(s=>s.band===band);return{band,fill:pct(a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.capacity,0))}});
 const memberMap=new Map();data.bookings.forEach(b=>{const m=memberMap.get(b.user_id)||{uid:b.user_id,attended:0,booked:0,no_show:0};if(b.status==='attended')m.attended++;if(['attended','booked','no_show'].includes(b.status))m.booked++;if(b.status==='no_show')m.no_show++;memberMap.set(b.user_id,m)});const topMembers=[...memberMap.values()].sort((a,b)=>b.attended-a.attended||b.booked-a.booked).slice(0,12);
 const planMix=data.plans.map(p=>({name:p.name,count:active.filter(m=>m.plan_id===p.id).length,revenue:active.filter(m=>m.plan_id===p.id).reduce((n,m)=>n+mrrValue(m,data.plans),0)})).sort((a,b)=>b.count-a.count);
 $('overview').innerHTML=`<div class="grid">${stat('Active memberships',active.length)}${stat('Est. MRR',money(mrr))}${stat('Average class fill',avgFill+'%')}${stat('Attendance rate',pct(att,att+noshow)+'%')}${stat('New members',newJoins)}${stat('Class attendances',att)}${stat('No-shows',noshow)}${stat('Sessions analysed',sm.length)}</div><div class="grid"><div class="card wide"><div class="section-title"><h3>What is busiest?</h3><span class="muted">Average utilisation</span></div>${barRows(byDay,'day','fill','%')}<div style="height:18px"></div>${barRows(bands,'band','fill','%')}</div><div class="card narrow"><div class="section-title"><h3>Membership mix</h3></div>${barRows(planMix,'name','count')}</div></div>`;
 $('memberships').innerHTML=`<div class="grid">${stat('Active',active.length)}${stat('MRR',money(mrr))}${stat('Plans',data.plans.filter(p=>p.is_active).length)}${stat('New joins',newJoins)}</div><div class="card"><div class="section-title"><h3>Membership plans</h3><div><button class="export" data-export="memberships" data-fmt="csv">CSV</button> <button class="export" data-export="memberships" data-fmt="xls">Excel</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Plan</th><th>Members</th><th>MRR</th><th>Share</th></tr></thead><tbody>${planMix.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.count}</td><td>${money(p.revenue)}</td><td>${pct(p.count,active.length)}%</td></tr>`).join('')}</tbody></table></div></div>`;
 const heatRows=days.map(day=>{const cells=['Morning','Daytime','Evening','Late'].map(band=>{const a=sm.filter(s=>s.day===day&&s.band===band);const v=pct(a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.capacity,0));const cls=v>=85?'v5':v>=70?'v4':v>=50?'v3':v>=25?'v2':'v1';return `<div class="cell ${cls}">${v}%</div>`}).join('');return `<div class="cell head">${day}</div>${cells}`}).join('');
 $('classes').innerHTML=`<div class="grid">${stat('Avg fill',avgFill+'%')}${stat('Attendances',att)}${stat('No-shows',noshow)}${stat('Sessions',sm.length)}</div><div class="grid"><div class="card half"><div class="section-title"><h3>By class type</h3><div><button class="export" data-export="classes" data-fmt="csv">CSV</button> <button class="export" data-export="classes" data-fmt="xls">Excel</button></div></div>${barRows(byType.slice(0,10),'name','fill','%')}</div><div class="card half"><div class="section-title"><h3>Day × time heatmap</h3><span class="muted">Demand / capacity</span></div><div class="table-wrap"><div class="heat"><div class="cell head"></div><div class="cell head">Morning</div><div class="cell head">Daytime</div><div class="cell head">Evening</div><div class="cell head">Late</div>${heatRows}</div></div></div></div><div class="card"><div class="section-title"><h3>Class performance detail</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Class</th><th>Sessions</th><th>Bookings / demand</th><th>Attended</th><th>Avg fill</th></tr></thead><tbody>${byType.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.sessions}</td><td>${r.bookings}</td><td>${r.attendance}</td><td>${r.fill}%</td></tr>`).join('')}</tbody></table></div></div>`;
 $('members').innerHTML=`<div class="grid">${stat('Active gym members',data.gymMembers.filter(x=>x.role==='member'&&x.is_active).length)}${stat('Members attending',topMembers.filter(x=>x.attended>0).length)}${stat('Total attendances',att)}${stat('No-show rate',pct(noshow,att+noshow)+'%')}</div><div class="card"><div class="section-title"><h3>Most active members</h3><div><button class="export" data-export="members" data-fmt="csv">CSV</button> <button class="export" data-export="members" data-fmt="xls">Excel</button></div></div>${topMembers.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Attended</th><th>Total activity</th><th>No-shows</th></tr></thead><tbody>${topMembers.map((m,i)=>`<tr><td><b>${i+1}. ${esc(displayName(m.uid))}</b></td><td>${m.attended}</td><td>${m.booked}</td><td>${m.no_show}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Attendance data will appear here as members check in.</div>'}</div>`;
 const failed=data.payments.filter(p=>['failed','charged_back','late'].includes(String(p.state).toLowerCase()));const outstanding=failed.reduce((n,p)=>n+(p.amount_pence||0),0);
 $('payments').innerHTML=`<div class="grid">${stat('Failed / at-risk payments',failed.length)}${stat('Outstanding',money(outstanding))}${stat('Payment records',data.payments.length)}${stat('GoCardless','Not connected')}</div><div class="card"><div class="section-title"><h3>Bad debtors / payment recovery</h3><span class="muted">Ready for GoCardless</span></div>${failed.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Amount</th><th>Status</th><th>Failure</th></tr></thead><tbody>${failed.map(p=>`<tr><td>${esc(displayName(p.user_id))}</td><td>${money(p.amount_pence)}</td><td>${esc(p.state)}</td><td>${esc(p.failure_message||p.failure_code||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">Once GoCardless is connected, failed collections, outstanding balances, mandate issues and recovery status will appear here automatically.</div>'}</div>`;
 bindExports();
}
async function load(){const since=fromDate(),qs=[sb.from('membership_plans').select('*').eq('gym_id',gym.id),sb.from('memberships').select('*').eq('gym_id',gym.id),sb.from('members').select('*').eq('gym_id',gym.id),sb.from('gym_members').select('user_id,role,is_active,joined_at').eq('gym_id',gym.id),sb.from('profiles').select('id,display_name,first_name,last_name'),sb.from('payment_records').select('*').eq('gym_id',gym.id)];let ss=sb.from('class_sessions').select('*').eq('gym_id',gym.id).eq('is_cancelled',false).order('starts_at');if(since)ss=ss.gte('starts_at',since);const sres=await ss;const ids=(sres.data||[]).map(x=>x.id);let bres={data:[]};if(ids.length)bres=await sb.from('class_bookings').select('*').in('session_id',ids);const res=await Promise.all(qs);[data.plans,data.memberships,data.members,data.gymMembers,data.profiles,data.payments]=res.map(x=>x.data||[]);data.sessions=sres.data||[];data.bookings=bres.data||[];render()}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./index.html';return}const{data:gm}=await sb.from('gym_members').select('gym_id,role,gyms(id,name)').eq('user_id',session.user.id).eq('is_active',true).limit(1);if(!gm?.length||!['owner','admin'].includes(gm[0].role)){location.href='./index.html';return}gym=gm[0].gyms;$('gymName').textContent=gym.name;$('loading').classList.add('hidden');$('app').classList.remove('hidden');await load()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('hidden',p.id!==b.dataset.tab))});$('range').onchange=load;$('refresh').onclick=load;init();
</script><script src="./shared-admin-nav.js" defer></script></body></html>
