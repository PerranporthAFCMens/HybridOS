<script type="module">

const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let gym=null,data={};

const ageBand=dob=>{const a=ageNow(dob);if(a==='')return'Not set';if(a<18)return'Under 18';if(a<25)return'18–24';if(a<35)return'25–34';if(a<45)return'35–44';if(a<55)return'45–54';if(a<65)return'55–64';return'65+'};

function fromDate(){const n=Number($('range').value);if(!n)return null;const d=new Date();d.setDate(d.getDate()-n);return d.toISOString()}
function mrrValue(m,plans){const p=plans.find(x=>x.id===m.plan_id);if(!p)return 0;const v=p.price_pence||0,i=(p.billing_interval||'monthly').toLowerCase();if(i.includes('year'))return Math.round(v/12);if(i.includes('week'))return Math.round(v*52/12);return v}
function displayName(uid){const p=data.profiles.find(x=>x.id===uid)||{};return p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Member'}
function bookingCounts(){const map=new Map();data.bookings.forEach(b=>{const x=map.get(b.session_id)||{booked:0,attended:0,no_show:0,cancelled:0};x[b.status]=(x[b.status]||0)+1;map.set(b.session_id,x)});return map}
function sessionMetrics(){const bc=bookingCounts();return data.sessions.map(s=>{const b=bc.get(s.id)||{booked:0,attended:0,no_show:0,cancelled:0};const demand=b.booked+b.attended+b.no_show;const actual=b.attended;const local=new Date(s.starts_at);const hr=Number(new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:'Europe/London'}).format(local));const day=new Intl.DateTimeFormat('en-GB',{weekday:'short',timeZone:'Europe/London'}).format(local);const band=hr<9?'Morning':hr<16?'Daytime':hr<21?'Evening':'Late';return{...s,...b,demand,actual,fill:pct(demand,s.capacity),actualFill:pct(actual,s.capacity),day,band,hour:hr}})}
function barRows(rows,labelKey,valueKey,suffix=''){const max=Math.max(1,...rows.map(r=>r[valueKey]||0));return `<div class="bar-list">${rows.map(r=>`<div class="bar-row"><div>${esc(r[labelKey])}</div><div class="track"><div class="fill" style="width:${Math.round((r[valueKey]||0)/max*100)}%"></div></div><b>${esc(r[valueKey])}${suffix}</b></div>`).join('')}</div>`}
function stat(label,value,sub=''){return `<div class="card stat"><div class="muted">${label}</div><div class="num">${value}</div>${sub?`<div class="muted" style="font-size:12px;margin-top:5px">${sub}</div>`:''}</div>`}
function exportCsv(name,headers,rows){const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv=[headers.map(q).join(','),...rows.map(r=>r.map(q).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name+'.csv';a.click();URL.revokeObjectURL(a.href)}
function exportXlsx(name,headers,rows){if(!window.XLSX){alert('Excel export is still loading. Please try again.');return}const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Report');XLSX.writeFile(wb,name+'.xlsx')}
function bindExports(){document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{const key=b.dataset.export,fmt=b.dataset.fmt||'csv',set=exportSets()[key];if(!set)return;(fmt==='xlsx'?exportXlsx:exportCsv)(key,set.headers,set.rows)});document.querySelectorAll('[data-view-report]').forEach(b=>b.onclick=()=>showReport(b.dataset.viewReport))}
function exportSets(){
 const sm=sessionMetrics(),planMap=new Map(data.plans.map(p=>[p.id,p.name])),sessionMap=new Map(data.sessions.map(x=>[x.id,x]));
 const memberCounts=new Map();data.bookings.filter(b=>['attended','booked','no_show'].includes(b.status)).forEach(b=>memberCounts.set(b.user_id,(memberCounts.get(b.user_id)||0)+1));
 const gm=data.gymMembers.filter(x=>x.role==='member'),activeMemberships=data.memberships.filter(m=>m.status==='active');
 const monthlyLifecycle=new Map();
 gm.forEach(m=>{if(m.joined_at){const k=String(m.joined_at).slice(0,7),x=monthlyLifecycle.get(k)||{joined:0,left:0};x.joined++;monthlyLifecycle.set(k,x)}if(m.attrition_on){const k=String(m.attrition_on).slice(0,7),x=monthlyLifecycle.get(k)||{joined:0,left:0};x.left++;monthlyLifecycle.set(k,x)}});
 const lifecycleRows=[...monthlyLifecycle.entries()].sort().map(([month,x])=>[month,x.joined,x.left,x.joined-x.left]);
 const groupCount=(rows,keyFn)=>[...rows.reduce((m,r)=>{const k=keyFn(r);m.set(k,(m.get(k)||0)+1);return m},new Map()).entries()].sort((a,b)=>b[1]-a[1]);
 const memberRows=gm.map(m=>{const p=profileFor(m.user_id);return[displayName(m.user_id),fmtDate(m.joined_at),m.attrition_on?fmtDate(m.attrition_on):'',m.attrition_on?'Left':'Live',ageNow(p.date_of_birth),genderLabel(p.gender)]});
 const attendanceRows=data.bookings.filter(b=>inRange(b.booked_at)).map(b=>{const ss=sessionMap.get(b.session_id)||{};return[displayName(b.user_id),ss.name||'',fmtDateTime(ss.starts_at),b.status,fmtDateTime(b.booked_at),fmtDateTime(b.cancelled_at)]});
 const workoutRows=(data.workoutAssignments||[]).filter(w=>inRange(w.created_at)).map(w=>[displayName(w.member_user_id),w.title||'',w.workout_type||'',w.source||'',w.status||'',w.scheduled_for||'',fmtDateTime(w.completed_at),w.member_rpe??'']);
 return{
  membership_register:{headers:['Member','Plan','Status','Starts','Ends','Payment status'],rows:data.memberships.map(m=>[displayName(m.user_id),planMap.get(m.plan_id)||'',m.status,m.starts_on||'',m.ends_on||'',m.payment_status||''])},
  active_memberships:{headers:['Member','Plan','Starts','Payment provider','Payment status'],rows:activeMemberships.map(m=>[displayName(m.user_id),planMap.get(m.plan_id)||'',m.starts_on||'',m.payment_provider||'',m.payment_status||''])},
  membership_plan_mix:{headers:['Plan','Active members','Est. MRR'],rows:data.plans.map(p=>{const a=activeMemberships.filter(m=>m.plan_id===p.id);return[p.name,a.length,money(a.reduce((n,m)=>n+mrrValue(m,data.plans),0))]}).sort((a,b)=>b[1]-a[1])},
  membership_changes:{headers:['Member','Plan','Status','Starts','Ends','Updated'],rows:data.memberships.filter(m=>inRange(m.updated_at)).map(m=>[displayName(m.user_id),planMap.get(m.plan_id)||'',m.status,m.starts_on||'',m.ends_on||'',fmtDateTime(m.updated_at)])},

  class_performance:{headers:['Class','Sessions','Demand','Attended','No-show','Average fill %'],rows:[...new Set(sm.map(x=>x.name))].map(name=>{const a=sm.filter(x=>x.name===name);return[name,a.length,a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.attended,0),a.reduce((n,x)=>n+x.no_show,0),pct(a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.capacity,0))]}).sort((a,b)=>b[5]-a[5])},

  member_attendance:{headers:['Member','Activity count'],rows:[...memberCounts.entries()].sort((a,b)=>b[1]-a[1]).map(([u,n])=>[displayName(u),n])},
  inactive_members:{headers:['Member','Joined','Last recorded attendance'],rows:gm.filter(m=>!m.attrition_on).map(m=>{const dates=data.bookings.filter(b=>b.user_id===m.user_id&&b.status==='attended').map(b=>sessionMap.get(b.session_id)?.starts_at).filter(Boolean).sort();return[displayName(m.user_id),fmtDate(m.joined_at),dates.length?fmtDateTime(dates[dates.length-1]):'Never']} ).filter(r=>r[2]==='Never'||(fromDate()&&new Date(r[2].split(',').reverse().join('-'))<new Date(fromDate())))},

  revenue_by_state:{headers:['Payment state','Records','Value'],rows:[...data.payments.reduce((m,p)=>{const k=p.state||'unknown',x=m.get(k)||{n:0,v:0};x.n++;x.v+=Number(p.amount_pence)||0;m.set(k,x);return m},new Map()).entries()].map(([k,x])=>[k,x.n,money(x.v)])},

function renderLibrary(){
 const q=($('reportSearch')?.value||'').trim().toLowerCase();let shown=0;
 $('library').innerHTML=REPORT_CATALOGUE.map(([group,items])=>{const matches=items.filter(x=>!q||(x[1]+' '+x[2]+' '+group).toLowerCase().includes(q));shown+=matches.length;if(!matches.length)return'';return '<div class="report-group"><div class="report-group-head"><h2>'+esc(group)+'</h2><span>'+matches.length+' reports</span></div><div class="report-grid">'+matches.map(([key,title,desc])=>'<article class="report-card"><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p><div class="report-actions"><button class="view" data-view-report="'+key+'">View</button><button data-export="'+key+'" data-fmt="csv">CSV</button><button data-export="'+key+'" data-fmt="xlsx">Excel</button></div></article>').join('')+'</div></div>'}).join('')+'<div id="reportViewer" class="report-viewer"></div>';
 $('reportCount').textContent=shown+' reports';bindExports()
}
function showReport(key){
 const set=exportSets()[key],meta=reportMeta(key);if(!set)return;const viewer=$('reportViewer');const rows=set.rows||[];
 viewer.innerHTML='<div class="card"><div class="viewer-head"><div><div class="eyebrow">Report preview</div><h2 style="margin:3px 0">'+esc(meta[1])+'</h2><div class="report-count">'+rows.length+' rows</div></div><div class="report-actions"><button data-export="'+key+'" data-fmt="csv">CSV</button><button data-export="'+key+'" data-fmt="xlsx">Excel</button></div></div><div class="report-note">'+esc(meta[2])+'</div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr>'+set.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,100).map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(rows.length>100?'<div class="report-note">Preview limited to 100 rows. CSV and Excel exports include all rows.</div>':'')+'</div>';
 bindExports();viewer.scrollIntoView({behavior:'smooth',block:'start'})
}

function render(){const sm=sessionMetrics(),active=data.memberships.filter(m=>m.status==='active'),mrr=active.reduce((n,m)=>n+mrrValue(m,data.plans),0),past=sm.filter(s=>new Date(s.starts_at)<new Date()),att=past.reduce((n,s)=>n+s.attended,0),noshow=past.reduce((n,s)=>n+s.no_show,0),demand=sm.reduce((n,s)=>n+s.demand,0),cap=sm.reduce((n,s)=>n+(s.capacity||0),0),avgFill=pct(demand,cap),newJoins=data.members.filter(m=>!fromDate()||new Date(m.joined_at)>=new Date(fromDate())).length;
 const byType=[...new Set(sm.map(s=>s.name))].map(name=>{const a=sm.filter(s=>s.name===name);return{name,sessions:a.length,bookings:a.reduce((n,x)=>n+x.demand,0),attendance:a.reduce((n,x)=>n+x.attended,0),fill:pct(a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.capacity,0))}}).sort((a,b)=>b.fill-a.fill);
 const byDay=days.map(day=>{const a=sm.filter(s=>s.day===day);return{day,fill:pct(a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.capacity,0)),attendance:a.reduce((n,x)=>n+x.attended,0)}});
 const bands=['Morning','Daytime','Evening','Late'].map(band=>{const a=sm.filter(s=>s.band===band);return{band,fill:pct(a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.capacity,0))}});
 const memberMap=new Map();data.bookings.forEach(b=>{const m=memberMap.get(b.user_id)||{uid:b.user_id,attended:0,booked:0,no_show:0};if(b.status==='attended')m.attended++;if(['attended','booked','no_show'].includes(b.status))m.booked++;if(b.status==='no_show')m.no_show++;memberMap.set(b.user_id,m)});const topMembers=[...memberMap.values()].sort((a,b)=>b.attended-a.attended||b.booked-a.booked).slice(0,12);
 const planMix=data.plans.map(p=>({name:p.name,count:active.filter(m=>m.plan_id===p.id).length,revenue:active.filter(m=>m.plan_id===p.id).reduce((n,m)=>n+mrrValue(m,data.plans),0)})).sort((a,b)=>b.count-a.count);
 $('overview').innerHTML=`<div class="grid">${stat('Active memberships',active.length)}${stat('Est. MRR',money(mrr))}${stat('Average class fill',avgFill+'%')}${stat('Attendance rate',pct(att,att+noshow)+'%')}${stat('New members',newJoins)}${stat('Class attendances',att)}${stat('No-shows',noshow)}${stat('Sessions analysed',sm.length)}</div><div class="grid"><div class="card wide"><div class="section-title"><h3>What is busiest?</h3><span class="muted">Average utilisation</span></div>${barRows(byDay,'day','fill','%')}<div style="height:18px"></div>${barRows(bands,'band','fill','%')}</div><div class="card narrow"><div class="section-title"><h3>Membership mix</h3></div>${barRows(planMix,'name','count')}</div></div>`;
 $('memberships').innerHTML=`<div class="grid">${stat('Active',active.length)}${stat('MRR',money(mrr))}${stat('Plans',data.plans.filter(p=>p.is_active).length)}${stat('New joins',newJoins)}</div><div class="card"><div class="section-title"><h3>Membership plans</h3><div><button class="export" data-export="memberships" data-fmt="csv">CSV</button> <button class="export" data-export="memberships" data-fmt="xlsx">Excel</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Plan</th><th>Members</th><th>MRR</th><th>Share</th></tr></thead><tbody>${planMix.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.count}</td><td>${money(p.revenue)}</td><td>${pct(p.count,active.length)}%</td></tr>`).join('')}</tbody></table></div></div>`;
 const heatRows=days.map(day=>{const cells=['Morning','Daytime','Evening','Late'].map(band=>{const a=sm.filter(s=>s.day===day&&s.band===band);const v=pct(a.reduce((n,x)=>n+x.demand,0),a.reduce((n,x)=>n+x.capacity,0));const cls=v>=85?'v5':v>=70?'v4':v>=50?'v3':v>=25?'v2':'v1';return `<div class="cell ${cls}">${v}%</div>`}).join('');return `<div class="cell head">${day}</div>${cells}`}).join('');
 $('classes').innerHTML=`<div class="grid">${stat('Avg fill',avgFill+'%')}${stat('Attendances',att)}${stat('No-shows',noshow)}${stat('Sessions',sm.length)}</div><div class="grid"><div class="card half"><div class="section-title"><h3>By class type</h3><div><button class="export" data-export="classes" data-fmt="csv">CSV</button> <button class="export" data-export="classes" data-fmt="xlsx">Excel</button></div></div>${barRows(byType.slice(0,10),'name','fill','%')}</div><div class="card half"><div class="section-title"><h3>Day × time heatmap</h3><span class="muted">Demand / capacity</span></div><div class="table-wrap"><div class="heat"><div class="cell head"></div><div class="cell head">Morning</div><div class="cell head">Daytime</div><div class="cell head">Evening</div><div class="cell head">Late</div>${heatRows}</div></div></div></div><div class="card"><div class="section-title"><h3>Class performance detail</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Class</th><th>Sessions</th><th>Bookings / demand</th><th>Attended</th><th>Avg fill</th></tr></thead><tbody>${byType.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.sessions}</td><td>${r.bookings}</td><td>${r.attendance}</td><td>${r.fill}%</td></tr>`).join('')}</tbody></table></div></div>`;
 $('members').innerHTML=`<div class="grid">${stat('Active gym members',data.gymMembers.filter(x=>x.role==='member'&&x.is_active).length)}${stat('Members attending',topMembers.filter(x=>x.attended>0).length)}${stat('Total attendances',att)}${stat('No-show rate',pct(noshow,att+noshow)+'%')}</div><div class="card"><div class="section-title"><h3>Most active members</h3><div><button class="export" data-export="members" data-fmt="csv">CSV</button> <button class="export" data-export="members" data-fmt="xlsx">Excel</button></div></div>${topMembers.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Attended</th><th>Total activity</th><th>No-shows</th></tr></thead><tbody>${topMembers.map((m,i)=>`<tr><td><b>${i+1}. ${esc(displayName(m.uid))}</b></td><td>${m.attended}</td><td>${m.booked}</td><td>${m.no_show}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Attendance data will appear here as members check in.</div>'}</div>`;
 const failed=data.payments.filter(p=>['failed','charged_back','late'].includes(String(p.state).toLowerCase()));const outstanding=failed.reduce((n,p)=>n+(p.amount_pence||0),0);
 $('payments').innerHTML=`<div class="grid">${stat('Failed / at-risk payments',failed.length)}${stat('Outstanding',money(outstanding))}${stat('Payment records',data.payments.length)}${stat('GoCardless','Not connected')}</div><div class="card"><div class="section-title"><h3>Bad debtors / payment recovery</h3><span class="muted">Ready for GoCardless</span></div>${failed.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Amount</th><th>Status</th><th>Failure</th></tr></thead><tbody>${failed.map(p=>`<tr><td>${esc(displayName(p.user_id))}</td><td>${money(p.amount_pence)}</td><td>${esc(p.state)}</td><td>${esc(p.failure_message||p.failure_code||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">Once GoCardless is connected, failed collections, outstanding balances, mandate issues and recovery status will appear here automatically.</div>'}</div>`;
 bindExports();renderLibrary();
}
async function load(){const since=fromDate(),qs=[sb.from('membership_plans').select('*').eq('gym_id',gym.id),sb.from('memberships').select('*').eq('gym_id',gym.id),sb.from('members').select('*').eq('gym_id',gym.id),sb.from('gym_members').select('user_id,role,is_active,joined_at,attrition_on').eq('gym_id',gym.id),sb.from('profiles').select('id,display_name,first_name,last_name,date_of_birth,gender'),sb.from('payment_records').select('*').eq('gym_id',gym.id),sb.from('class_booking_purchases').select('*').eq('gym_id',gym.id),sb.from('workout_assignments').select('*').eq('gym_id',gym.id),sb.from('workout_sessions').select('*').eq('gym_id',gym.id),sb.from('pt_appointments').select('*').eq('gym_id',gym.id)];let ss=sb.from('class_sessions').select('*').eq('gym_id',gym.id).eq('is_cancelled',false).order('starts_at');if(since)ss=ss.gte('starts_at',since);const sres=await ss;const ids=(sres.data||[]).map(x=>x.id);let bres={data:[]};if(ids.length)bres=await sb.from('class_bookings').select('*').in('session_id',ids);const res=await Promise.all(qs);[data.plans,data.memberships,data.members,data.gymMembers,data.profiles,data.payments,data.classPurchases,data.workoutAssignments,data.workoutSessions,data.ptAppointments]=res.map(x=>x.data||[]);data.sessions=sres.data||[];data.bookings=bres.data||[];render()}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./index.html';return}const{data:gm}=await sb.from('gym_members').select('gym_id,role,gyms(id,name)').eq('user_id',session.user.id).eq('is_active',true).limit(1);if(!gm?.length||!['owner','admin'].includes(gm[0].role)){location.href='./index.html';return}gym=gm[0].gyms;$('gymName').textContent=gym.name;$('loading').classList.add('hidden');$('app').classList.remove('hidden');await load()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('hidden',p.id!==b.dataset.tab))});$('range').onchange=load;$('refresh').onclick=load;$('reportSearch').oninput=renderLibrary;init();
