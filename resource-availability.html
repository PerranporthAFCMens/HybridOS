<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource availability · Hybrid OS</title><link rel="stylesheet" href="./admin-shell.css"><style>:root{--bg:#f5f7fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#e7ebf2;--dark:#0b1020;--shadow:0 16px 40px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{background:var(--dark);color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:20px}.brand{font-size:18px;font-weight:900;letter-spacing:.08em}.gym{padding:13px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}.gym small{color:#98a2b3}.nav{display:grid;gap:6px}.main{padding:28px 30px 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#7a8494}.top h1{margin:4px 0;font-size:32px}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field select,.field input{width:100%;padding:11px;border:1px solid #d9dee7;border-radius:12px}.days{display:grid;gap:9px}.day{display:grid;grid-template-columns:100px 100px 1fr 1fr;gap:9px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:13px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--dark);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none}.msg{min-height:20px;margin-top:10px;font-size:13px}.good{color:#067647}.bad{color:#b42318}@media(max-width:850px){.day{grid-template-columns:75px 90px 1fr 1fr}}</style></head><body><div id="loading">Loading resource availability…</div><div id="app" class="shell hidden"><aside class="side"><div class="brand">HYBRID <b>OS</b></div><div class="gym"><small>Current gym</small><div id="gymName" style="font-weight:800;margin-top:4px"></div></div><nav class="nav"></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">Scheduling engine</div><h1>Resource availability</h1><div class="muted">Set the normal hours each room, area or piece of equipment can be scheduled.</div></div><a class="btn secondary" href="./admin-operations.html">← Staff & resources</a></div><div class="card"><div class="field"><label>Resource</label><select id="resource"></select></div><div class="days" id="days"></div><div id="msg" class="msg"></div><button id="save" class="btn primary" style="width:100%;margin-top:12px">Save availability</button></div></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');const $=id=>document.getElementById(id);const labels=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let gymId=null,resources=[];async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./index.html';return}const{data:gm}=await sb.from('gym_members').select('gym_id,role,gyms(name)').eq('user_id',session.user.id).eq('is_active',true).limit(1);if(!gm?.length||!['owner','admin'].includes(gm[0].role)){location.href='./index.html';return}gymId=gm[0].gym_id;$('gymName').textContent=gm[0].gyms?.name||'';const{data}=await sb.from('resources').select('id,name,resource_type,is_active').eq('gym_id',gymId).eq('is_active',true).order('name');resources=data||[];$('resource').innerHTML=resources.map(r=>`<option value="${r.id}">${r.name} · ${r.resource_type}</option>`).join('');$('days').innerHTML=labels.map((d,i)=>`<div class="day"><b>${d.slice(0,3)}</b><label><input type="checkbox" data-on="${i}" checked> Open</label><input type="time" data-start="${i}" value="06:00"><input type="time" data-end="${i}" value="22:00"></div>`).join('');$('resource').onchange=load;$('save').onclick=save;$('loading').classList.add('hidden');$('app').classList.remove('hidden');await load()}async function load(){const rid=$('resource').value;if(!rid)return;const{data}=await sb.from('resource_availability').select('*').eq('gym_id',gymId).eq('resource_id',rid);const map=new Map((data||[]).map(x=>[Number(x.weekday),x]));for(let i=0;i<7;i++){const r=map.get(i);document.querySelector(`[data-on="${i}"]`).checked=r?r.is_available:true;document.querySelector(`[data-start="${i}"]`).value=(r?.start_time||'06:00').slice(0,5);document.querySelector(`[data-end="${i}"]`).value=(r?.end_time||'22:00').slice(0,5)}}async function save(){const rid=$('resource').value;if(!rid)return;const btn=$('save');btn.disabled=true;btn.textContent='Saving…';const rows=[];for(let i=0;i<7;i++)rows.push({gym_id:gymId,resource_id:rid,weekday:i,is_available:document.querySelector(`[data-on="${i}"]`).checked,start_time:document.querySelector(`[data-start="${i}"]`).value,end_time:document.querySelector(`[data-end="${i}"]`).value});const{error}=await sb.from('resource_availability').upsert(rows,{onConflict:'resource_id,weekday'});btn.disabled=false;btn.textContent='Save availability';$('msg').textContent=error?error.message:'Availability saved.';$('msg').className='msg '+(error?'bad':'good')}init();</script><script src="./shared-admin-nav.js" defer></script></body></html>
