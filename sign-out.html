<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Signing out · Hybrid OS</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#101828;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e7ebf2;border-radius:22px;padding:26px;box-shadow:0 14px 34px rgba(16,24,40,.08);text-align:center}
.brand{font-size:18px;font-weight:900;letter-spacing:.09em;margin-bottom:18px}
.muted{color:#667085;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="brand">HYBRID OS</div>
  <h1 style="font-size:26px;margin:0 0 8px">Signing you out…</h1>
  <div id="status" class="muted">Ending this Hybrid OS session.</div>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');
const status=document.getElementById('status');
try{
  await supabase.auth.signOut();
  location.replace('./index.html');
}catch(e){
  status.textContent=e?.message||'Could not sign out. Please try again.';
}
</script>
</body>
</html>
