<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>Social · HybridOne</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#e7ebf2;--dark:#0b1020;--accent:#00d9a6;--shadow:0 14px 34px rgba(16,24,40,.08)}*{box-sizing:border-box}html,body{min-height:100%;background:var(--bg)}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,textarea{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:var(--dark);color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:900;letter-spacing:.08em}.gym{padding:13px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}.gym small{color:#98a2b3}.nav{display:grid;gap:6px}.nav a{color:#a9b2c2;text-decoration:none;padding:12px;border-radius:12px}.nav a.active,.nav a:hover{background:rgba(255,255,255,.09);color:#fff}.logout{margin-top:auto;border:1px solid rgba(255,255,255,.14);background:transparent;color:#d0d5dd;padding:11px;border-radius:12px}.main{padding:28px 30px 90px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.top h1{margin:0;font-size:30px}.userchip{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 11px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e9e7ff;font-weight:850;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.feed-wrap{max-width:760px;margin:0 auto}.composer,.post{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.composer{padding:16px;margin-bottom:14px}.composer-row{display:flex;gap:11px;align-items:flex-start}.composer textarea{flex:1;border:0;outline:0;resize:none;min-height:70px;font-size:16px;line-height:1.5;background:transparent}.composer-actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #eef1f5;padding-top:12px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary{background:var(--dark);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.post{margin-bottom:14px;padding:16px}.post-head{display:flex;align-items:center;gap:10px}.post-meta{min-width:0}.post-author{font-weight:850}.post-time{font-size:12px;color:var(--muted);margin-top:2px}.post-body{font-size:16px;line-height:1.6;color:#344054;margin:15px 0;white-space:pre-wrap;overflow-wrap:anywhere}.post-body a{color:#087fb7}.post-actions{display:flex;gap:18px;align-items:center;border-top:1px solid #eef1f5;border-bottom:1px solid #eef1f5;padding:10px 0;margin-top:10px}.action{border:0;background:transparent;color:#667085;font-weight:750;padding:4px 0;cursor:pointer}.action.active{color:#d92d20}.reaction-summary{font-size:13px;color:#667085;margin-top:10px}.comments{margin-top:10px}.comment{display:flex;gap:9px;margin:10px 0}.comment.reply{margin-left:52px}.comment .avatar{width:34px;height:34px}.bubble{background:#f2f4f7;border-radius:17px;padding:9px 12px;max-width:calc(100% - 44px)}.comment-name{font-weight:850;font-size:14px}.comment-text{font-size:14px;line-height:1.45;color:#475467;margin-top:3px;white-space:pre-wrap}.comment-tools{font-size:12px;color:#7a8494;font-weight:750;margin:5px 0 0 10px}.comment-tools button{border:0;background:transparent;color:inherit;font-weight:800;padding:0 7px 0 0}.comment-composer{display:flex;gap:9px;align-items:center;margin-top:12px}.comment-composer .avatar{width:34px;height:34px}.comment-composer input{flex:1;border:0;background:#f2f4f7;border-radius:999px;padding:11px 14px;outline:0}.empty{background:#fff;border:1px dashed #d0d5dd;border-radius:18px;padding:28px;text-align:center;color:#667085}.mobile-menu-btn,.mobile-menu-close,.mobile-nav-backdrop{display:none}.replying{font-size:12px;color:#667085;margin:8px 0 0 44px}.replying button{border:0;background:transparent;color:#b42318}.msg{font-size:13px;margin-top:8px;color:#b42318}
@media(max-width:900px){html,body{background:#f5f7fb!important}.shell{display:block;min-height:100dvh}.side{display:flex;position:fixed;left:0;top:0;bottom:0;width:min(82vw,310px);height:100dvh;z-index:70;transform:translateX(-105%);transition:transform .22s ease;box-shadow:18px 0 40px rgba(0,0,0,.22);overflow:auto}.main{padding:calc(env(safe-area-inset-top) + 82px) 0 calc(env(safe-area-inset-bottom) + 28px)}.feed-wrap{max-width:none}.top{padding:0 16px;margin-bottom:14px}.top h1{font-size:26px}.userchip{display:none}.composer,.post{border-radius:0;border-left:0;border-right:0;box-shadow:none}.post{margin-bottom:10px}.mobile-menu-btn{display:grid;place-items:center;position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:14px;z-index:61;width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-size:24px;box-shadow:0 8px 24px rgba(16,24,40,.12)}body.mobile-nav-open .side{transform:translateX(0)}.mobile-menu-close{display:grid;place-items:center;position:absolute;top:14px;right:14px;width:38px;height:38px;border:1px solid rgba(255,255,255,.15);border-radius:11px;background:rgba(255,255,255,.08);color:#fff;font-size:24px}.mobile-nav-backdrop{display:block;position:fixed;inset:0;background:rgba(11,16,32,.48);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s ease}body.mobile-nav-open .mobile-nav-backdrop{opacity:1;pointer-events:auto}.comment.reply{margin-left:38px}}
</style></head><body>
<div id="loading" style="padding:28px">Loading social feed…</div>
<div id="app" class="shell hidden"><aside class="side"><button id="mobileMenuClose" class="mobile-menu-close">×</button><div class="brand">HYBRID<b>ONE</b></div><div class="gym"><small>My gym</small><div id="gymName" style="font-weight:800;margin-top:4px"></div></div><nav class="nav"><a href="./member.html" data-shell-icon="home"><span>Home</span></a><a href="./member.html#classes" data-shell-icon="classes"><span>Classes</span></a><a class="active" href="./social.html" data-shell-icon="social"><span>Social</span></a><a href="./member.html#workouts" data-shell-icon="workouts"><span>Workouts</span></a><a href="./member.html#pbs" data-shell-icon="pbs"><span>PBs</span></a><a href="./member.html#membership" data-shell-icon="membership"><span>My membership</span></a><a href="./integrations.html" data-shell-icon="integrations"><span>Integrations</span></a><a href="./member.html#profile" data-shell-icon="profile"><span>Profile</span></a></nav><button id="logoutBtn" class="logout">Sign out</button></aside>
<main class="main"><button id="mobileMenuBtn" class="mobile-menu-btn">☰</button><div id="mobileNavBackdrop" class="mobile-nav-backdrop"></div><header class="top"><h1>Social</h1><div class="userchip"><div id="topAvatar" class="avatar">H</div><div><b id="topName"></b><div id="topEmail" style="font-size:12px;color:#667085"></div></div></div></header>
<div class="feed-wrap"><section class="composer"><div class="composer-row"><div id="myAvatar" class="avatar">H</div><textarea id="postBody" maxlength="5000" placeholder="Share something with your gym..."></textarea></div><div class="composer-actions"><button id="postBtn" class="btn primary">Post</button></div><div id="postMsg" class="msg"></div></section><div id="feed"></div></div></main></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD');const $=id=>document.getElementById(id);let gymId,userId,role,profiles=new Map(),me={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function initials(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function nameOf(id){const p=profiles.get(id)||{};return p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Member'}
function avatarHtml(id,cls='avatar'){const p=profiles.get(id)||{};return p.avatar_url?`<div class="${cls}"><img src="${esc(p.avatar_url)}" alt=""></div>`:`<div class="${cls}">${esc(initials(nameOf(id)))}</div>`}
function ago(v){const ms=Date.now()-new Date(v).getTime(),m=Math.floor(ms/60000);if(m<1)return'now';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';const d=Math.floor(h/24);return d<14?d+'d':new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'}).format(new Date(v))}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./index.html';return}userId=session.user.id;const{data:gm}=await sb.from('gym_members').select('gym_id,role,gyms(name)').eq('user_id',userId).eq('is_active',true).limit(1);if(!gm?.length){location.href='./index.html';return}gymId=gm[0].gym_id;role=gm[0].role;$('gymName').textContent=gm[0].gyms?.name||'My gym';const{data:pf}=await sb.from('profiles').select('id,display_name,first_name,last_name,avatar_url');(pf||[]).forEach(p=>profiles.set(p.id,p));me=profiles.get(userId)||{};$('topName').textContent=nameOf(userId);$('topEmail').textContent=session.user.email||'';for(const id of['topAvatar','myAvatar']){const el=$(id);if(me.avatar_url)el.innerHTML=`<img src="${esc(me.avatar_url)}" alt="">`;else el.textContent=initials(nameOf(userId))}$('loading').classList.add('hidden');$('app').classList.remove('hidden');await loadFeed()}
async function loadFeed(){const[{data:posts,error},{data:comments},{data:reactions}]=await Promise.all([sb.from('social_posts').select('*').eq('gym_id',gymId).order('created_at',{ascending:false}).limit(100),sb.from('social_comments').select('*').eq('gym_id',gymId).order('created_at'),sb.from('social_reactions').select('*').eq('gym_id',gymId)]);if(error){$('feed').innerHTML='<div class="empty">Could not load the social feed.</div>';return}const cs=comments||[],rs=reactions||[];$('feed').innerHTML=(posts||[]).length?(posts||[]).map(p=>renderPost(p,cs,rs)).join(''):'<div class="empty">No posts yet. Be the first to say something.</div>';wire()}
function renderPost(p,comments,reactions){const pcs=comments.filter(c=>c.post_id===p.id),roots=pcs.filter(c=>!c.parent_comment_id),prs=reactions.filter(r=>r.post_id===p.id),mine=prs.find(r=>r.user_id===userId);return `<article class="post" data-post="${p.id}"><div class="post-head">${avatarHtml(p.user_id)}<div class="post-meta"><div class="post-author">${esc(nameOf(p.user_id))}</div><div class="post-time">${ago(p.created_at)}</div></div></div><div class="post-body">${linkify(p.body)}</div>${prs.length?`<div class="reaction-summary">❤️ ${prs.length}</div>`:''}<div class="post-actions"><button class="action react ${mine?'active':''}" data-post="${p.id}">♥ ${mine?'Liked':'Like'}</button><button class="action focus-comment" data-post="${p.id}">Comment</button></div><div class="comments">${roots.map(c=>renderComment(c,pcs,reactions)).join('')}</div><div class="comment-composer">${avatarHtml(userId)}<input data-comment-input="${p.id}" placeholder="Add a comment…"><button class="action send-comment" data-post="${p.id}">Post</button></div><div class="replying hidden" data-reply-state="${p.id}"></div></article>`}
function renderComment(c,all,reactions){const replies=all.filter(x=>x.parent_comment_id===c.id),mine=reactions.find(r=>r.comment_id===c.id&&r.user_id===userId),count=reactions.filter(r=>r.comment_id===c.id).length;return `<div class="comment-wrap"><div class="comment">${avatarHtml(c.user_id)}<div><div class="bubble"><div class="comment-name">${esc(nameOf(c.user_id))}</div><div class="comment-text">${linkify(c.body)}</div></div><div class="comment-tools"><button class="react-comment ${mine?'active':''}" data-comment="${c.id}">${mine?'♥ Liked':'Like'}</button><button class="reply-comment" data-post="${c.post_id}" data-comment="${c.id}" data-name="${esc(nameOf(c.user_id))}">Reply</button> ${ago(c.created_at)} ${count?` · ❤️ ${count}`:''}</div></div></div>${replies.map(r=>`<div class="comment reply">${avatarHtml(r.user_id)}<div><div class="bubble"><div class="comment-name">${esc(nameOf(r.user_id))}</div><div class="comment-text">${linkify(r.body)}</div></div><div class="comment-tools">${ago(r.created_at)}</div></div></div>`).join('')}</div>`}
function wire(){document.querySelectorAll('.react').forEach(b=>b.onclick=()=>toggleReaction('post',b.dataset.post));document.querySelectorAll('.react-comment').forEach(b=>b.onclick=()=>toggleReaction('comment',b.dataset.comment));document.querySelectorAll('.focus-comment').forEach(b=>b.onclick=()=>document.querySelector(`[data-comment-input="${b.dataset.post}"]`)?.focus());document.querySelectorAll('.send-comment').forEach(b=>b.onclick=()=>sendComment(b.dataset.post));document.querySelectorAll('[data-comment-input]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendComment(i.dataset.commentInput)}});document.querySelectorAll('.reply-comment').forEach(b=>b.onclick=()=>{const st=document.querySelector(`[data-reply-state="${b.dataset.post}"]`);st.dataset.parent=b.dataset.comment;st.classList.remove('hidden');st.innerHTML=`Replying to ${b.dataset.name} <button type="button">Cancel</button>`;st.querySelector('button').onclick=()=>{st.classList.add('hidden');delete st.dataset.parent};document.querySelector(`[data-comment-input="${b.dataset.post}"]`)?.focus()})}
async function toggleReaction(kind,id){let q=sb.from('social_reactions').select('id').eq('user_id',userId);q=kind==='post'?q.eq('post_id',id):q.eq('comment_id',id);const{data}=await q.maybeSingle();if(data)await sb.from('social_reactions').delete().eq('id',data.id);else await sb.from('social_reactions').insert({gym_id:gymId,user_id:userId,[kind==='post'?'post_id':'comment_id']:id,reaction:'heart'});await loadFeed()}
async function sendComment(postId){const input=document.querySelector(`[data-comment-input="${postId}"]`),body=input?.value.trim();if(!body)return;const st=document.querySelector(`[data-reply-state="${postId}"]`),parent=st?.dataset.parent||null;input.disabled=true;const{error}=await sb.from('social_comments').insert({gym_id:gymId,post_id:postId,user_id:userId,parent_comment_id:parent,body});input.disabled=false;if(!error){input.value='';if(st){st.classList.add('hidden');delete st.dataset.parent}await loadFeed()}}
$('postBtn').onclick=async()=>{const body=$('postBody').value.trim();if(!body)return;$('postBtn').disabled=true;$('postBtn').textContent='Posting…';const{error}=await sb.from('social_posts').insert({gym_id:gymId,user_id:userId,body});$('postBtn').disabled=false;$('postBtn').textContent='Post';if(error){$('postMsg').textContent=error.message}else{$('postBody').value='';$('postMsg').textContent='';await loadFeed()}};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.href='./index.html'};$('mobileMenuBtn').onclick=()=>document.body.classList.add('mobile-nav-open');$('mobileMenuClose').onclick=$('mobileNavBackdrop').onclick=()=>document.body.classList.remove('mobile-nav-open');init();
</script></body></html>
