<!doctype html>
<html lang="en"><head><script src="./supabase-request-guard.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff access · HybridOne</title><link rel="stylesheet" href="./admin-shell.css"><style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#e7ebf2;--dark:#0b1020;--good:#067647;--bad:#b42318;--shadow:0 14px 34px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,select,input{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{background:var(--dark);color:#fff;padding:24px 18px}.brand{font-size:18px;font-weight:900;letter-spacing:.08em}.gym{padding:13px;border-radius:16px;background:rgba(255,255,255,.07);margin:22px 0}.gym small{color:#98a2b3}.nav{display:grid;gap:6px}.main{padding:28px 30px 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#7a8494}.top h1{margin:4px 0;font-size:32px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.staff-list{display:grid;gap:8px}.staff-btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;text-align:left;cursor:pointer}.staff-btn.active{border-color:#101828;background:#f8fafc}.muted{color:var(--muted)}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:12px}.permissions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.perm{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:11px}.perm input{margin-top:3px}.perm b{display:block;font-size:13px}.perm span{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--dark);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none}.msg{margin-top:10px;font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}@media(max-width:850px){.shell{display:block}.side{display:none}.main{padding:18px 14px 50px}.grid{grid-template-columns:1fr}.permissions{grid-template-columns:1fr}}
</style></head><body><div id="loading">Loading staff access…</div><div id="app" class="shell hidden"><aside class="side"><div class="brand">HYBRID<b>ONE</b></div><div class="gym"><small>Current gym</small><div id="gymName" style="font-weight:800;margin-top:4px"></div></div><nav class="nav"></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">Staff portal</div><h1>Staff access</h1><div class="muted">Choose exactly what each staff member can see and do.</div></div><a class="btn secondary" href="./admin-operations.html">← Staff & resources</a></div><div class="grid"><div class="card"><h3 style="margin-top:0">Team</h3><div id="staffList" class="staff-list"></div></div><div class="card"><div id="empty" class="muted">Select a staff member.</div><div id="editor" class="hidden"><div class="eyebrow">Access profile</div><h2 id="staffName" style="margin:4px 0"></h2><div class="field"><label>Access level</label><select id="preset"><option value="own_calendar">Own calendar only</option><option value="coach">Coach / PT</option><option value="reception">Reception</option><option value="manager">Manager</option><option value="full_access">Full access</option><option value="custom">Custom</option></select></div><div id="accessSummary" class="notice" style="margin:10px 0 14px">Choose an access level, then fine-tune individual permissions if needed.</div><div id="permissions" class="permissions"></div><button id="save" class="btn primary" style="width:100%;margin-top:16px">Save access</button><div id="msg" class="msg"></div></div></div></div></main></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://mzgnhmeydhhpzgxlgudh.supabase.co','sb_publishable_sxWDz2XL-BB5oXbPOR-1zg_XROZYWdD'),$=id=>document.getElementById(id);let gymId=null,current=null,staff=[],access=[];
const defs=[
['full_access','Full owner-level access','Same operational access as the owner while remaining a Staff/Employee account.'],
['view_timetable','View full timetable','See the gym-wide class timetable.'],
['create_classes','Create classes','Add classes to the timetable.'],
['edit_timetable','Edit timetable','Change scheduled classes.'],
['cancel_classes','Cancel classes','Cancel scheduled classes.'],
['mark_attendance','Mark attendance','Mark booked members attended or no-show.'],
['view_member_contact','View member contact details','See member contact information where available.'],
['view_memberships','View memberships','See member plans and membership state.'],
['manage_memberships','Manage memberships','Change membership records.'],
['view_reporting','View reporting','Open business and attendance reports.'],
['manage_resources','Manage rooms & resources','Edit rooms, areas and equipment.'],
['manage_staff','Manage staff','Edit staff setup and access.'],
['view_own_pay','View own pay','See their own pay rate only.'],
['view_member_notes','View member notes','See coaching/member notes.'],
['moderate_community','Moderate community','Manage community content.']
];
const presets={
own_calendar:{},
coach:{view_timetable:true,mark_attendance:true,view_member_notes:true,view_own_pay:true},
reception:{view_timetable:true,mark_attendance:true,view_member_contact:true,view_memberships:true,view_own_pay:true},
manager:{view_timetable:true,create_classes:true,edit_timetable:true,cancel_classes:true,mark_attendance:true,view_member_contact:true,view_memberships:true,manage_memberships:true,view_reporting:true,manage_resources:true,manage_staff:true,view_own_pay:true,view_member_notes:true,moderate_community:true},
full_access:Object.fromEntries(defs.map(([k])=>[k,true]))
};
function defaults(name){const out={};defs.forEach(([k])=>out[k]=!!presets[name]?.[k]);return out}
function nameOf(s){return s.name||s.email||'Staff'}
function summary(name){return({own_calendar:'Only their own assigned calendar/classes. No behind-the-scenes gym access.',coach:'Own work plus coaching tools, attendance and member notes.',reception:'Timetable, attendance, member contact and membership visibility.',manager:'Broad operational control without owner-equivalent account access.',full_access:'Owner-level operational access. Use only for staff you fully trust.',custom:'Custom access. Individual permissions below decide what this person can use.'})[name]||''}
function renderPerms(p){$('permissions').innerHTML=defs.map(([k,l,d])=>`<label class="perm"><input type="checkbox" data-perm="${k}" ${p[k]?'checked':''}><div><b>${l}</b><span>${d}</span></div></label>`).join('');document.querySelectorAll('[data-perm]').forEach(i=>i.onchange=()=>{$('preset').value='custom';$('accessSummary').textContent=summary('custom')})}
function choose(uid){current=staff.find(s=>s.user_id===uid);document.querySelectorAll('.staff-btn').forEach(b=>b.classList.toggle('active',b.dataset.uid===uid));$('empty').classList.add('hidden');$('editor').classList.remove('hidden');$('staffName').textContent=nameOf(current);const row=access.find(a=>a.user_id===uid);$('preset').value=row?.preset||'own_calendar';$('accessSummary').textContent=summary($('preset').value);renderPerms({...defaults(row?.preset||'own_calendar'),...(row?.permissions||{})});$('msg').textContent=''}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='./index.html';return}const{data:gm}=await sb.from('gym_members').select('gym_id,role,gyms(name)').eq('user_id',session.user.id).eq('is_active',true).eq('gym_id',sessionStorage.getItem('hybrid-gym-id')||'00000000-0000-0000-0000-000000000000').limit(1);if(!gm?.length||!['owner','admin'].includes(gm[0].role)){location.href='./index.html';return}gymId=gm[0].gym_id;$('gymName').textContent=gm[0].gyms?.name||'';const{data:members}=await sb.from('gym_members').select('user_id,role').eq('gym_id',gymId).eq('is_active',true).in('role',['staff','coach']);const ids=(members||[]).map(x=>x.user_id);let pm=[];if(ids.length){const r=await sb.from('profiles').select('id,display_name,first_name,last_name').in('id',ids);pm=r.data||[]}const map=new Map(pm.map(p=>[p.id,p]));staff=(members||[]).map(m=>{const p=map.get(m.user_id)||{};return{...m,name:p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||m.role}}).sort((a,b)=>a.name.localeCompare(b.name));const ar=await sb.from('staff_access').select('user_id,preset,permissions').eq('gym_id',gymId);access=ar.data||[];$('staffList').innerHTML=staff.length?staff.map(s=>`<button class="staff-btn" data-uid="${s.user_id}"><b>${nameOf(s)}</b><div class="muted" style="font-size:12px">${s.role}</div></button>`).join(''):'<div class="muted">No staff or coaches yet.</div>';document.querySelectorAll('.staff-btn').forEach(b=>b.onclick=()=>choose(b.dataset.uid));$('preset').onchange=()=>{const value=$('preset').value;$('accessSummary').textContent=summary(value);renderPerms(value==='custom'?(access.find(a=>a.user_id===current?.user_id)?.permissions||{}):defaults(value))};$('save').onclick=save;$('loading').classList.add('hidden');$('app').classList.remove('hidden');if(staff[0])choose(staff[0].user_id)}
async function save(){if(!current)return;const btn=$('save');btn.disabled=true;btn.textContent='Saving…';const permissions={};document.querySelectorAll('[data-perm]').forEach(i=>permissions[i.dataset.perm]=i.checked);let preset=$('preset').value;const base=defaults(preset),same=defs.every(([k])=>base[k]===permissions[k]);if(!same)preset='custom';const{error}=await sb.from('staff_access').upsert({gym_id:gymId,user_id:current.user_id,preset,permissions,updated_at:new Date().toISOString()},{onConflict:'gym_id,user_id'});btn.disabled=false;btn.textContent='Save access';$('msg').textContent=error?error.message:'Access saved.';$('msg').className='msg '+(error?'bad':'good');if(!error){const ix=access.findIndex(a=>a.user_id===current.user_id),row={user_id:current.user_id,preset,permissions};if(ix>=0)access[ix]=row;else access.push(row);$('preset').value=preset}}
init();
</script><script src="./shared-admin-nav.js" defer></script></body></html>
